:root {
  --y: #FFB72E; --ink: #141414; --ink2: #1E1E1E; --soft: #5C5C5C; --cream: #F7F7F7; --line: #E6E6E6;
  --gold: #8A5A05; --navy: #04122D; --navy2: #0B1E47; --glow: #D2A06D;
  --c1: #FFB72E; --c2: #141414; --c3: #A39683;
  --ease: cubic-bezier(.23, 1, .32, 1); --hh: 56px;
}
@media (min-width: 768px) { :root { --hh: 64px; } }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--hh) + 1rem); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
body { margin: 0; background: #fff; color: var(--ink); font-family: 'Assistant', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
h1, h2, h3, h4, p, figure, dl, dd { margin: 0; }
img { max-width: 100%; }
::selection { background: var(--y); color: var(--ink); }
:focus-visible { outline: 3px solid var(--y); outline-offset: 3px; border-radius: 8px; }
.rp { overflow-x: clip; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; margin: 0; padding: 0; list-style: none; }
.wrap { max-width: 76rem; margin-inline: auto; padding-inline: clamp(1rem, 4vw, 2rem); }
.y { color: var(--y); }
.pad { display: inline-block; flex: none; width: 1em; height: 1em; background: var(--y); border-radius: 20% / 20%; transform: rotate(12deg); }
.ic { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.h2 { font-size: clamp(2.3rem, 5.6vw, 4.1rem); font-weight: 800; line-height: 1.04; text-wrap: balance; }
.h2 > span { display: block; }
.sec-h { margin-bottom: clamp(2rem, 5vw, 3.25rem); }
.sec-lede { margin-top: 1.1rem; max-width: 46rem; font-size: clamp(1.1rem, 1.6vw, 1.25rem); line-height: 1.65; color: var(--soft); text-wrap: pretty; }
.kick { display: flex; align-items: center; gap: .55rem; margin-bottom: .9rem; font-size: 1.12rem; font-weight: 800; color: var(--gold); }
.kick .pad { width: .6em; height: .6em; }
.kick--lt { color: var(--glow); }
.kick--lt .pad { background: var(--glow); }
.mny { white-space: nowrap; }
.mny .cur, .cur { font-size: .62em; font-weight: 700; margin-inline-start: .15em; }
.lbl { display: block; font-size: .92rem; font-weight: 800; color: var(--soft); }
.ni { flex: none; width: 2.4rem; height: 2.4rem; display: grid; place-items: center; border-radius: .7rem; background: var(--ink); color: var(--y); }
.ni .ic { width: 1.3rem; height: 1.3rem; }
section[id] { scroll-margin-top: calc(var(--hh) + .5rem); }

/* ההצמדה מתוך scrollcraft.css של הסקיל, בלי שאר העיצוב שלו */
.sc-act--pinned { position: relative; }
[data-sc-stage].sc-stage { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: clip; }

/* כניסה רכה לכרטיסים. רק בתנועה מלאה */
html.mo .rv { opacity: 0; transform: translateY(22px); transition: opacity .6s var(--ease) var(--dl, 0s), transform .6s var(--ease) var(--dl, 0s); }

/* ================================================================ הפס העליון */
.hd { position: fixed; inset: 0 0 auto; z-index: 50; height: var(--hh); background: rgba(255, 255, 255, .92);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.hd-in { height: 100%; max-width: 76rem; margin-inline: auto; padding-inline: clamp(1rem, 4vw, 2rem); display: flex; align-items: center; gap: 1rem; }
.hd-logo { height: 30px; width: auto; }
.hd-t { display: none; margin-inline-start: auto; font-size: .95rem; font-weight: 700; color: var(--soft); }
.hd-go { margin-inline-start: auto; display: inline-flex; align-items: center; gap: .55rem; height: 40px; padding-inline: 1rem .85rem;
  border-radius: 10px; background: var(--ink); color: #fff; text-decoration: none; font-weight: 800; font-size: .98rem;
  transition: transform .16s var(--ease); }
.hd-go .ic { width: 1.1rem; height: 1.1rem; color: var(--y); }

@media (min-width: 768px) { .hd-logo { height: 36px; } .hd-t { display: inline; } .hd-t + .hd-go { margin-inline-start: 0; } }
@media (hover: hover) and (pointer: fine) { .hd-go:hover { transform: translateY(-1px); } }
.hd-bar { position: absolute; inset-inline: 0; bottom: -1px; height: 3px; background: var(--y); transform-origin: right center; transform: scaleX(var(--sp, 0)); }
html:not(.mo) .hd-bar { display: none; }

/* ================================================================ כותרת העמוד: מה זה ולמי */
.doc { position: relative; z-index: 1; padding: calc(var(--hh) + 1.75rem) 0 .25rem; }
.doc-in { max-width: 80rem; margin-inline: auto; padding-inline: clamp(1rem, 4vw, 2rem); display: flex; flex-direction: column; align-items: flex-start; gap: 1.25rem; }
.doc-logo { flex: none; width: 6.75rem; height: 6.75rem; overflow: hidden; border-radius: 1.2rem; background: var(--navy);
  box-shadow: 0 18px 40px -22px rgba(4, 18, 45, .75), 0 0 0 1px rgba(4, 18, 45, .08); }
.doc-logo img { display: block; width: 100%; height: 100%; object-fit: cover; }
.doc-h { font-size: clamp(1.9rem, 4.7vw, 3.75rem); font-weight: 800; line-height: 1.06; text-wrap: balance; }
.doc-k { display: flex; align-items: center; gap: .55rem; margin-bottom: .45rem; font-size: clamp(1.25rem, 2.4vw, 1.6rem); font-weight: 800; color: var(--gold); }
.doc-k .pad { width: .6em; height: .6em; }
.doc-w { display: block; }
.doc-f { display: block; margin-top: .55rem; font-size: clamp(1.3rem, 2.5vw, 2.1rem); font-weight: 800; line-height: 1.2; color: var(--soft); }
.doc-f b { color: var(--ink); }
.doc-s { display: block; margin-top: .15rem; font-size: .66em; font-weight: 700; color: var(--soft); }
.doc + .hero { padding-top: 0; }
@media (min-width: 768px) {
  .doc-in { flex-direction: row; align-items: center; gap: 2.25rem; }
  .doc-logo { width: 9.5rem; height: 9.5rem; border-radius: 1.5rem; }
}
@media (min-width: 1024px) {
  .doc { padding-top: calc(var(--hh) + 2.5rem); }
  .doc + .hero { margin-top: -3rem; }
  html:not(.mo) .doc + .hero .hero-copy { padding-top: 2rem; }
  .doc + .hero .hero-stage:not(.sc-stage) { padding-top: 1rem; }
}

/* ================================================================ פתיח */
.hero { position: relative; background: #fff; padding-top: var(--hh); }
.hero::before { content: ''; position: absolute; width: 18rem; height: 18rem; inset-inline-start: -6rem; top: -5rem; pointer-events: none;
  background: hsl(39 100% 59% / .14); border-radius: 34% 66% 34% 66% / 66% 34% 66% 34%; transform: rotate(-12deg); }
.hero-copy { position: relative; padding: 2rem clamp(1rem, 4vw, 2rem) 1.5rem; }

.hero-h span { display: block; }
.hero-pts { margin-top: 1.4rem; max-width: 34rem; gap: .65rem; }
.hero-pts li { font-size: clamp(1.1rem, 1.6vw, 1.28rem); font-weight: 700; line-height: 1.45; }
.hero-nums { list-style: none; margin: 1.75rem 0 0; padding: 0; max-width: 36rem; display: grid; grid-template-columns: minmax(0, 1fr); }
.hero-nums li { display: flex; align-items: baseline; gap: 1rem; padding: .8rem 0; border-top: 1px solid var(--line); }
.hero-nums li:first-child { border-top: 2px solid var(--ink); }
.hero-nums b { flex: none; min-width: 8.5rem; font-size: clamp(1.7rem, 7vw, 2.1rem); font-weight: 800; line-height: 1; white-space: nowrap; }
.hero-nums li > span { font-size: 1rem; font-weight: 700; line-height: 1.4; color: var(--soft); text-wrap: pretty; }
@media (min-width: 640px) {
  .hero-nums { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .hero-nums li { display: block; padding: .9rem .9rem 0 .5rem; border-top: 2px solid var(--ink); }
  .hero-nums li:first-child { border-top: 2px solid var(--ink); }
  .hero-nums li + li { border-inline-start: 1px solid var(--line); }
  .hero-nums b { display: block; min-width: 0; font-size: clamp(1.6rem, 2.7vw, 2.1rem); }
  .hero-nums li > span { display: block; margin-top: .45rem; font-size: .92rem; }
}
.hero-stage { display: flex; align-items: center; justify-content: center; padding: 1rem clamp(1rem, 4vw, 2rem) 3rem; }
.hero-stage.sc-stage { padding-block: calc(var(--hh) + .4rem) .6rem; }
@media (min-width: 1024px) {
  .hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); max-width: 80rem; margin-inline: auto; padding-top: 0; }
  .hero-copy { display: flex; align-items: center; padding: calc(var(--hh) + 2rem) 2rem 2rem; }
  html.mo .hero-copy { position: sticky; top: 0; height: 100vh; height: 100svh; padding-top: var(--hh); }
  .hero-stage { padding-top: calc(var(--hh) + 1rem); }
}

/* ---- הטלפון: כל המידות ב-em, ולכן הוא מצטמצם יחד עם גובה המסך ---- */
.scene { display: flex; flex-direction: column; align-items: center; gap: .8rem; width: 100%;
  --pf: clamp(10.5px, min(17.5px, calc((100svh - var(--hh) - 10.5rem) / 33), calc((100vw - 3.4rem) / 21)), 17.5px); }
.scene figcaption { max-width: 23rem; text-align: center; font-size: .9rem; line-height: 1.45; color: var(--soft); text-wrap: balance; }
.scene-depth { position: relative; width: 21em; font-size: var(--pf); margin-top: 2.7rem; }
.lyr { position: absolute; inset: 0; will-change: transform; }
.lyr-far .blob { position: absolute; width: 118%; aspect-ratio: 1; inset-inline-end: -40%; top: 2%;
  background: hsl(39 100% 59% / .24); border-radius: 34% 66% 34% 66% / 66% 34% 66% 34%; transform: rotate(-12deg); }
.lyr-mid .stripes { position: absolute; width: 80%; height: 36%; inset-inline-start: -16%; bottom: 4%; transform: skewY(-5deg);
  background-image: repeating-linear-gradient(-45deg, hsl(39 100% 59% / .6) 0 2px, transparent 2px 12px); }
.lyr-phone { position: relative; perspective: 1100px; }
.lyr-phone::before { content: ''; position: absolute; inset: -.55em; background: var(--y); border-radius: 2.7em; transform: rotate(-3.5deg); }
.phone { position: relative; border-radius: 2.55em; background: #1c1c1e; padding: .38em; transform: rotateY(var(--ry, 0deg)) rotateX(var(--rx, 0deg));
  box-shadow: 0 46px 80px -34px rgba(20, 14, 0, .6), 0 16px 30px -16px rgba(20, 14, 0, .35); }
.ph-screen { position: relative; height: 31em; border-radius: 2.2em; overflow: hidden; background: #fff; }
.ph-label { position: absolute; z-index: 3; inset-inline: 0; bottom: calc(100% + .95em); margin-inline: auto; width: max-content; max-width: 100%;
  display: flex; align-items: center; gap: .5em; padding: .42em 1em; border-radius: 999px; background: var(--ink); color: var(--y);
  font-size: 1rem; font-weight: 800; transition: opacity .4s var(--ease), transform .5s var(--ease); }
.ph-label .pad { width: .65em; height: .65em; }
html.mo .ph-label:not(.on) { opacity: 0; transform: translateY(.6rem); }
.dots { display: flex; gap: .45rem; }
.dots i { width: .5rem; height: .5rem; border-radius: 50%; background: #D5D5D5; transition: background-color .3s, transform .3s var(--ease); }
.dots i.on { background: var(--ink); transform: scale(1.35); }

/* מסך הטלפון: שלוש תחנות. בתנועה מלאה הן זו על זו, ובתנועה מופחתת זו מתחת לזו */
.scr { position: relative; overflow: hidden; font-size: 1em; }
.scr::before { content: ''; position: absolute; z-index: 4; top: .62em; left: 50%; transform: translateX(-50%); width: 5.2em; height: 1.25em; border-radius: 1em; background: #0c0c0d; }
.scr--g { background: #fff; padding-top: 2.7em; }
.scr--he, .scr--ru { background: #f0f2f5; padding-top: 2.5em; }
.scr--ru { font-family: 'Assistant', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; letter-spacing: 0; }
html.mo .scr { position: absolute; inset: 0; opacity: 0; transform: translateY(1.4em) scale(.98); pointer-events: none;
  transition: opacity .5s var(--ease), transform .6s var(--ease); }
html.mo .phone[data-st="g"] .scr--g, html.mo .phone[data-st="he"] .scr--he, html.mo .phone[data-st="ru"] .scr--ru { opacity: 1; transform: none; }
html.mo .phone:not([data-st="g"]) .scr--g { transform: translateY(-1.4em) scale(.98); }
html.mo .phone[data-st="ru"] .scr--he { transform: translateY(-1.4em) scale(.98); }

/* בתנועה מופחתת הטלפון מתפרק לשלושה מסכים ערוכים זה מתחת לזה, והתווית ליד המסך הרוסי */
html:not(.mo) .scene-depth, html:not(.mo) .lyr-phone, html:not(.mo) .phone, html:not(.mo) .ph-screen { display: contents; }
html:not(.mo) .lyr-far, html:not(.mo) .lyr-mid, html:not(.mo) .dots, html:not(.mo) .lyr-phone::before { display: none; }
html:not(.mo) .scr { width: 21em; max-width: 100%; font-size: var(--pf); border: .38em solid #1c1c1e; border-radius: 2.55em; box-shadow: 0 26px 50px -30px rgba(20, 14, 0, .55); padding-bottom: .7em; }
html:not(.mo) .scr--g { order: 1; } html:not(.mo) .scr--he { order: 2; } html:not(.mo) .ph-label { order: 3; } html:not(.mo) .scr--ru { order: 4; } html:not(.mo) figcaption { order: 5; }
html:not(.mo) .ph-label { position: static; margin: .6rem auto 0; }
html:not(.mo) .scene { gap: 1.1rem; --pf: min(17px, calc((100vw - 3.4rem) / 22)); }
html:not(.mo) .hero-stage { padding-block: 1.5rem 3rem; }
@media (min-width: 1024px) { html:not(.mo) .hero-copy { align-items: flex-start; } }

/* מסך חיפוש בגוגל. מראה כללי של תוצאת חיפוש, בלי הלוגו שלו */
.g-bar { display: flex; align-items: center; gap: .6em; height: 2.7em; margin: 0 .95em; padding-inline: 1em; border-radius: 1.4em; background: #f1f3f4; color: #5f6368; }
.g-bar .ic { width: 1.15em; height: 1.15em; flex: none; }

.g-caret { display: none; width: 2px; height: 1.15em; margin-inline-start: 1px; background: #202124; }
html.mo .g-bar.typing .g-caret { display: block; animation: caret 1s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }
.g-res { padding: 1.05em 1.05em .8em; }
.g-ad { transition: opacity .5s var(--ease), transform .6s var(--ease); }
html.mo .g-ad:not(.on) { opacity: 0; transform: translateY(.9em); }
.g-top { display: flex; align-items: center; gap: .45em; font-size: .8em; color: #5f6368; }
.g-fav { width: 1.9em; height: 1.9em; border-radius: 50%; background: #e8eaed; flex: none; }
.g-spon { font-weight: 800; color: #202124; }
.g-site { color: #4d5156; unicode-bidi: isolate; }
.g-h { margin-top: .5em; font-size: 1.1em; font-weight: 700; line-height: 1.3; color: #1a0dab; text-wrap: balance; }
.g-b { margin-top: .4em; font-size: .88em; line-height: 1.5; color: #4d5156; }
.g-links { display: flex; flex-wrap: wrap; gap: .45em; list-style: none; margin: .8em 0 0; padding: 0; }
.g-links li { padding: .3em .85em; border: 1px solid #dadce0; border-radius: 1em; font-size: .82em; font-weight: 600; color: #1a0dab; }
.g-org { margin-top: 1.1em; display: grid; gap: 1em; opacity: .75; transition: opacity .6s var(--ease) .15s; }
html.mo .g-ad:not(.on) + .g-org { opacity: 0; }
.g-sk { display: grid; gap: .38em; }
.g-sk i { display: block; height: .5em; border-radius: .3em; background: #e3e5e8; }
.g-sk .a { width: 36%; height: .42em; }
.g-sk .b { width: 78%; height: .62em; background: #cfd8f0; }
.g-sk .c { width: 100%; }
.g-sk .c.d { width: 62%; }
.g-dot { opacity: .7; }

/* פיד של פייסבוק. מראה כללי של מודעה בפיד, בלי הלוגו שלו */
.f-comp { display: flex; align-items: center; gap: .6em; padding: .35em .75em .6em; }
.f-c1 { width: 2.3em; height: 2.3em; border-radius: 50%; background: #d8dbe0; flex: none; }
.f-c2 { flex: 1; height: 2.3em; border-radius: 1.2em; background: #fff; }
.f-ad { margin: 0 .5em; border-radius: 1em; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .12); overflow: hidden; }
.f-h { display: flex; align-items: center; gap: .65em; padding: .75em .85em .55em; }
.f-av { width: 2.6em; height: 2.6em; border-radius: 50%; object-fit: cover; flex: none; background: var(--navy); }
.f-who { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.f-who > b { font-size: .92em; color: #050505; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.f-sp { display: flex; align-items: center; gap: .3em; font-size: .76em; color: #65676b; }
.f-sp .ic { width: 1.05em; height: 1.05em; }
.f-more { color: #65676b; } .f-more .ic { width: 1.6em; height: 1.6em; }
.f-t { padding: 0 .9em .65em; font-size: .88em; line-height: 1.45; color: #050505; }
.f-media { display: grid; place-items: center; height: 8.2em; background: var(--navy); }
.f-media img { display: block; width: 8.2em; height: 8.2em; max-width: none; object-fit: cover; }
.f-bar { display: flex; align-items: center; justify-content: space-between; gap: .6em; padding: .65em .85em; background: #f0f2f5; }
.f-bt { min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
.f-bt b { font-size: .88em; color: #050505; }
.f-bt span { font-size: .74em; color: #65676b; }
.f-cta { flex: none; padding: .5em .9em; border-radius: .55em; background: #e4e6eb; font-size: .78em; font-weight: 800; color: #050505; white-space: nowrap; }
.f-react { display: flex; justify-content: space-around; padding: .5em .6em; border-top: 1px solid #e4e6eb; color: #65676b; }
.f-react .ic { width: 1.35em; height: 1.35em; }
.f-next { margin: .5em .5em 0; padding: .8em; border-radius: 1em 1em 0 0; background: #fff; display: grid; gap: .4em; }
.f-next i { display: block; height: .5em; border-radius: .3em; background: #e3e5e8; }
.f-next i:first-child { width: 45%; } .f-next i:nth-child(2) { width: 90%; } .f-next i:nth-child(3) { width: 70%; }
.scr--ru .f-who > b { text-align: start; }

/* ================================================================ רגע השיא: כחול לילה וזהב */
.edge { position: relative; overflow: hidden; background: var(--navy); color: #fff; padding-block: clamp(4.5rem, 11vw, 8rem); }
.edge-glow { position: absolute; width: 46rem; height: 46rem; inset-inline-start: -16rem; top: -18rem; pointer-events: none;
  background: radial-gradient(closest-side, rgba(210, 160, 109, .2), transparent); }
.edge .wrap { position: relative; }
.edge-top { display: grid; gap: 1.4rem; grid-template-areas: "k" "h" "p"; }
.edge-top .kick { grid-area: k; margin-bottom: 0; }
.edge-h { grid-area: h; font-size: clamp(2.6rem, 7vw, 5.4rem); font-weight: 800; line-height: 1.02; text-wrap: balance; }
.edge-h span { display: block; }
.edge-h .gl { color: var(--glow); }
.edge-p { grid-area: p; max-width: 40rem; gap: 1rem; }
.edge-p li { font-size: clamp(1.12rem, 1.7vw, 1.3rem); line-height: 1.5; color: rgba(255, 255, 255, .88); }
.edge .edge-p .ic { background: var(--glow); }
@media (min-width: 960px) {
  .edge-top { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); grid-template-areas: "k p" "h p"; column-gap: 4rem; align-items: end; }
  .edge-top .kick { align-self: end; }
}
.chart { margin-top: clamp(2.5rem, 6vw, 4rem); padding: clamp(1rem, 3vw, 2rem) clamp(.9rem, 3vw, 2rem) 1.1rem; border: 1px solid rgba(210, 160, 109, .3); border-radius: 1.4rem;
  background: linear-gradient(180deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .012)); }
.ch-t { margin-bottom: 1.1rem; font-size: clamp(1.1rem, 2vw, 1.45rem); font-weight: 800; line-height: 1.35; color: #fff; text-wrap: balance; }
.ch-box { position: relative; height: 16rem; }
@media (min-width: 768px) { .ch-box { height: 22rem; } }
.ch-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.ch-grid line { stroke: rgba(255, 255, 255, .1); stroke-width: 1; stroke-dasharray: 3 5; }
.ch-grid line.base { stroke: rgba(255, 255, 255, .3); stroke-dasharray: none; }
.ch-line { fill: none; stroke: var(--glow); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
.ch-br { fill: none; stroke: rgba(210, 160, 109, .75); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.pt { position: absolute; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; border-radius: 50%; background: var(--navy); border: 2px solid var(--glow);
  opacity: 0; transform: scale(.4); transition: opacity .3s var(--ease), transform .4s var(--ease); }
.pt--k { width: 15px; height: 15px; margin: -7.5px 0 0 -7.5px; background: var(--glow); border-color: var(--navy); box-shadow: 0 0 0 2px var(--glow); }
.pt.on { opacity: 1; transform: none; }
.pl { position: absolute; transform: translate(-50%, -100%); font-size: 1.2rem; font-weight: 800; color: #fff; white-space: nowrap; opacity: 0; transition: opacity .35s var(--ease); }
.pl.on { opacity: 1; }
.pl.pl--first { transform: translate(-50%, 0); }
.pl--top { color: var(--glow); font-size: 1.35rem; }
.mx { position: absolute; bottom: 0; transform: translateX(-50%); font-size: .82rem; font-weight: 700; color: rgba(255, 255, 255, .62); white-space: nowrap; }
.mx--off { display: none; }
.nw { white-space: nowrap; }
.ch-s { margin-top: .6rem; font-size: .88rem; color: rgba(255, 255, 255, .58); }
.edge-use { margin-top: clamp(2rem, 5vw, 3rem); display: grid; gap: 1rem; max-width: 58rem; }
.use { padding-inline-start: 1.25rem; border-inline-start: 4px solid var(--glow); font-size: clamp(1.4rem, 2.7vw, 2.1rem); font-weight: 800; line-height: 1.3; color: #fff; text-wrap: balance; }
.rule { padding-inline-start: calc(1.25rem + 4px); font-size: .95rem; line-height: 1.6; color: rgba(255, 255, 255, .66); text-wrap: pretty; }

/* ================================================================ גוגל */
.gg { background: #fff; padding-block: clamp(4.5rem, 10vw, 7.5rem); }
.cmps { display: grid; gap: 1.1rem; }
.cmp { display: flex; flex-direction: column; background: var(--cream); border: 1px solid var(--line); border-radius: 1.4rem; padding: 1.5rem 1.4rem 1.3rem; box-shadow: inset 0 5px 0 var(--c1); }
.cmp-h { display: flex; align-items: flex-start; gap: .65rem; font-size: 1.5rem; font-weight: 800; line-height: 1.2; text-wrap: balance; margin-top: .35rem; }

   scrollcraft: a scroll-driven interaction runtime
   ----------------------------------------------------------------------------
   Vanilla JS. Zero dependencies. Zero DOM generation.

   The engine does NOT build your page. You author real, semantic HTML and mark
   it up with data-sc-* attributes; the engine reads them and drives them from a
   single scroll value on a single rAF loop. That is deliberate: a runtime that
   generates its own DOM from a config object makes every site it touches look
   identical, which is the failure mode this replaces.

   ---------------------------------------------------------------------------
   ACTS: the unit of scroll time
   ---------------------------------------------------------------------------
     <section data-sc-act="pin" data-sc-span="2.5"> ... </section>

     data-sc-act   scrub | pin | pan | flow   (default: flow)
     data-sc-clip-map="travel" opts a pinned act OUT of full-life clip mapping.
                   By DEFAULT a scrub clip is mapped across the stage's entire
                   on-screen life, not across its pinned travel, because a pinned
                   stage is visible for a viewport BEFORE the pin begins (sliding
                   up into view) and a viewport AFTER it ends (sliding off the
                   top). Mapped to pinned travel, the clip sits on its first
                   frame through the whole entry and its last frame through the
                   whole exit: the reader watches a still photograph while the
                   page moves. Pair it with data-sc-dwell, which moves quickly at
                   the edges and settles in the middle, so the fast motion lands
                   on the two slides and the settle lands inside the pin where
                   the copy is. data-sc-runout is accepted and ignored; it named
                   the old opt-in for the exit half of this.
     data-sc-span  viewport-heights of scroll this act owns. Pinned devices only
                   (scrub/pin/pan). Default 1.5. The engine sets the outer
                   height and sticks the first .sc-stage / [data-sc-stage] child.

     Every act exposes a normalized progress p (0..1):
       pinned  p = (y - top) / (height - vh)
       flow    p = (y + vh - top) / (height + vh)
     and publishes it as --sc-p on the act element, so CSS can read it too.

   ---------------------------------------------------------------------------
   DEVICES: what p drives
   ---------------------------------------------------------------------------
     data-sc-scrub            on <video>. p scrubs currentTime. Blob-loaded, so
                              it seeks without needing HTTP range support.
     data-sc-sequence="a/{i}.webp:120:1"
                              on <canvas>. p scrubs an image sequence
                              (path template : frameCount : startIndex).
     data-sc-pan="0.6"        on a wide rail inside data-sc-act="pan". p drives
                              horizontal travel. Value = extra travel multiplier.
     data-sc-parallax="-0.2"  translateY by rate * act-progress * viewport.
                              Negative = moves up faster than scroll (recedes).
     data-sc-cue="0.1 0.5"    opacity/rise keyed to p. One value = enter+hold.
                              Two = enter..leave. Add a third for the hold point.
     data-sc-kinetic="lines"  lines | words | chars. Splits the element and
                              staggers its reveal across the cue window.
     data-sc-reveal="up"      up | down | left | right | iris. clip-path wipe.
     data-sc-count="0 4200"   number bloom across the cue window. Outside any
                              act it ticks up once on entry instead, over
                              data-sc-count-ms (default 1400).
     data-sc-in               flow-section reveal, fires once on entry via
                              IntersectionObserver (cheaper, and content that
                              re-hides on scroll-up is a defect, not an effect).
                              data-sc-stagger="60" on the parent staggers kids.
     data-sc-drift="#07090c"  page background interpolates toward this colour
                              while the act is on screen.

   ---------------------------------------------------------------------------
   WORLDFLIGHT: the page mode for one continuous flight
   ---------------------------------------------------------------------------
     <div data-sc-mode="worldflight" data-sc-seam="0.12">
       <div data-sc-world>
         <div data-sc-segment data-sc-w="1.4" data-sc-linger="0.3"
              data-sc-waypoint="Approach">
           <img class="sc-world__poster" src="p1.webp" alt="">
           <video data-sc-src="leg1.mp4" data-sc-src-mobile="leg1-m.mp4"></video>
         </div>
         ... more segments, in flight order ...
       </div>
       <div data-sc-world-copy>
         <div class="sc-world__scrim sc-scrim sc-scrim--band"></div>
         <div data-sc-copy data-sc-window="hero"> ... </div>
         <div data-sc-copy data-sc-window="0.34 0.56"> ... </div>
         <div data-sc-copy data-sc-window="finale"> ... </div>
       </div>
       <div data-sc-spacer aria-hidden="true"></div>
     </div>

   Acts cut the page into pinned blocks, which is the right shape for a page of
   chapters and the wrong shape for one continuous camera move: the reader hits
   the end of an act, the stage unsticks, a static page slides past, and the next
   act starts the whole thing again. Worldflight removes the seams by removing
   the blocks. There is ONE fixed stage for the entire page. The only element in
   document flow is a spacer, whose height the engine sets to the sum of the
   segment weights plus one viewport so the last flight can finish. Scroll drives
   the film timeline and the overlay opacity. Nothing else moves.

     data-sc-w        viewport-heights this segment owns. Default 1.3.
     data-sc-linger   dwell remap for this leg only (see lingerEase). Max 0.6.
     data-sc-seam     crossfade band, in viewport-heights of scroll. Default 0.12.
     data-sc-waypoint label published on --sc-seg / the sc:waypoint event, so a
                      page can draw its own route rail. The engine draws none.
     data-sc-window   on a copy block: "hero" | "finale" | "from to [in [out]]"
                      as fractions of the WHOLE track.

   Every clip stays mounted for the life of the page. Segments crossfade by
   opacity over the seam band; nothing ever swaps a src, because a src swap is a
   black frame and a black frame is the cut this mode exists to avoid.

   ---------------------------------------------------------------------------
   POINTER: interactivity that isn't scroll
   ---------------------------------------------------------------------------
     data-sc-tilt="8"         3D tilt toward the pointer, spring-damped, degrees.
     data-sc-magnet="0.35"    element drifts toward the pointer inside its bounds.
     data-sc-spotlight        publishes --sc-mx/--sc-my (0..1) for a light that
                              follows the pointer across the surface.
   All three are gated to (hover: hover) and (pointer: fine) and disabled under
   prefers-reduced-motion. Touch never fires them.

   ---------------------------------------------------------------------------
   REDUCED MOTION
   ---------------------------------------------------------------------------
   Fewer and gentler, not zero. Cues still fade (comprehension survives), but
   translation collapses, video clips are never fetched (the poster holds), and
   pointer devices are inert. A worldflight still tells its whole story: the
   posters cross-dissolve through the same seams and the same copy windows.

   ---------------------------------------------------------------------------
   THE PLAYHEAD
   ---------------------------------------------------------------------------
   Every scrub clip on the page, act or worldflight, is driven by one smoothed
   playhead. Scroll only ever writes a TARGET; a standalone rAF loop walks the
   current time toward it at a fixed fraction per frame (data-sc-lerp, default
   0.18; 1.0 under reduced motion, which is no smoothing at all). Writes are
   gated by a deadband and skipped while the decoder is still seeking. Without
   the smoothing a trackpad flick reads as a stutter, because wheel events do
   not arrive at a constant rate and a 1:1 write reproduces every gap in them.
   ========================================================================== */

  var clamp01 = function (x) { return clamp(x, 0, 1); };
  var smooth = function (x) { x = clamp01(x); return x * x * (3 - 2 * x); };
  var lerp = function (a, b, t) { return a + (b - a) * t; };

  // moves quicker at the edges. f(0)=0 and f(1)=1 always, so seam frames between
  // consecutive clips are untouched and the chain stays invisible.
  function dwell(x, L) {
    if (!L) return x;
    L = clamp01(L);
    var c = x - 0.5;
    return (1 - L) * x + L * (4 * c * c * c + 0.5);

  // derivative at the midpoint gets low enough that the camera visibly stops
  // dead mid-leg, which reads as a stall rather than a hold. The endpoints are
  // fixed by construction: f(0)=0, f(1)=1, so the first and last frames of every
  // leg are still exactly the frames the seam law matched, and the chain between
  // legs stays invisible no matter how much dwell a leg asks for.
  function lingerEase(x, L) {
    if (!L) return x;
    L = clamp(L, 0, 0.6);
    var c = x - 0.5;
    return (1 - L) * x + L * (4 * c * c * c + 0.5);

  // clips are unusually short (where 0.18 lags behind the pointer) can tighten
  // it, and it is never read as 0: a 0 lerp is a playhead that never moves.

    var v = parseFloat(el && el.getAttribute && el.getAttribute('data-sc-lerp'));

  // ---- colour -------------------------------------------------------------
  function parseColor(str) {

      if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];

    m = str.match(/rgba?\(([^)]+)\)/i);

      var p = m[1].split(/[,\s/]+/).filter(Boolean).map(parseFloat);
      return [p[0], p[1], p[2]];

  function mixColor(a, b, t) {
    return 'rgb(' + Math.round(lerp(a[0], b[0], t)) + ',' +
                    Math.round(lerp(a[1], b[1], t)) + ',' +
                    Math.round(lerp(a[2], b[2], t)) + ')';

  // ---- text splitting -----------------------------------------------------
  // Wraps each unit in a masked span so the reveal can slide from behind a clean
  // edge instead of just fading. Lines are measured after layout, so this must
  // run once fonts are ready or the line boxes are wrong.
  function splitText(el, mode) {
    if (el.__scSplit) return el.__scSplit;
    var text = el.textContent;
    var units = [];

    if (mode === 'chars' || mode === 'words') {
      var parts = mode === 'chars' ? Array.from(text) : text.split(/(\s+)/);
      el.textContent = '';
      parts.forEach(function (t) {
        if (/^\s+$/.test(t)) { el.appendChild(document.createTextNode(t)); return; }
        var mask = document.createElement('span');
        mask.className = 'sc-split';
        var inner = document.createElement('span');
        inner.className = 'sc-split__i';
        inner.textContent = t;
        mask.appendChild(inner);
        el.appendChild(mask);
        units.push(inner);
      });
    } else {

      el.textContent = '';
      var probes = words.map(function (w, i) {
        var s = document.createElement('span');
        s.textContent = w;
        el.appendChild(s);
        if (i < words.length - 1) el.appendChild(document.createTextNode(' '));
        return s;

      probes.forEach(function (s) {

        inner.className = 'sc-split__i';
        inner.textContent = words.join(' ');
        mask.appendChild(inner);

    first.style.left = X(0) + 'px'; first.style.top = (Y(vals[0]) + 16) + 'px';
    var a = +topL.getAttribute('data-from'), b = +topL.getAttribute('data-to'), yb = Y(vmax) - 24;
    br.setAttribute('d', 'M' + X(a) + ' ' + (yb + 8) + 'V' + yb + 'H' + X(b) + 'V' + (yb + 8));
    topL.style.left = ((X(a) + X(b)) / 2) + 'px'; topL.style.top = (yb - 6) + 'px';
    CH = { w: w, line: line, clip: clip, br: br, pts: pts, first: first, topL: topL, a: a, b: b, X: X, cum: cum, total: cum[n - 1], n: n, vals: vals };
    line.style.strokeDasharray = CH.total + ' ' + (CH.total + 2);
  }
  function drawChart(p) {
    if (!CH) return;
    var L = CH.total * p;
    CH.line.style.strokeDashoffset = Math.max(0, CH.total - L);
    // ראש הקו, כדי שהשטח שמתחתיו יתמלא יחד איתו
    var hx = CH.X(0);
    for (var j = 1; j < CH.n; j++) {
      if (L >= CH.cum[j]) { hx = CH.X(j); } else { hx = CH.X(j - 1) + (CH.X(j) - CH.X(j - 1)) * ((L - CH.cum[j - 1]) / (CH.cum[j] - CH.cum[j - 1])); break; }
    }
    CH.clip.setAttribute('width', Math.max(0, hx));
    CH.pts.forEach(function (pt, i) { pt.classList.toggle('on', L >= CH.cum[i] - 0.5 && p > 0); });
    CH.first.classList.toggle('on', p > 0.01);
    CH.topL.classList.toggle('on', L >= CH.cum[CH.b] - 0.5);
    CH.br.style.opacity = L >= CH.cum[CH.b] - 0.5 ? 1 : 0;
  }

  /* ---------- מסילה: קו שמתמלא בגלילה ומדליק כל תחנה כשהוא מגיע אליה ---------- */
  function makeRail(list, nodeSel, itemSel, horizontal) {
    var rail = $('.rail', list), fill = $('.rail-f', rail), nodes = $$(nodeSel, list), items = $$(itemSel, list);
    var R = { cur: 0, len: 0, pos: [], horiz: false, list: list };
    R.layout = function () {
      var lr = list.getBoundingClientRect();
      R.horiz = horizontal();
      var c = nodes.map(function (n) { var r = n.getBoundingClientRect(); return { x: r.left + r.width / 2 - lr.left, y: r.top + r.height / 2 - lr.top }; });
      var f = c[0], l = c[c.length - 1];
      if (R.horiz) {
        // בעברית התחנה הראשונה מימין, והקו נמתח שמאלה
        R.len = f.x - l.x; R.pos = c.map(function (p) { return f.x - p.x; });
        rail.style.cssText = 'left:' + l.x + 'px;width:' + R.len + 'px;top:' + (f.y - 2) + 'px;height:4px';
        fill.style.cssText = 'right:0;top:0;height:100%;width:0';
      } else {
        R.len = l.y - f.y; R.pos = c.map(function (p) { return p.y - f.y; });
        rail.style.cssText = 'left:' + (f.x - 2) + 'px;width:4px;top:' + f.y + 'px;height:' + R.len + 'px';
        fill.style.cssText = 'left:0;top:0;width:100%;height:0';
      }
    };
    R.draw = function (L, started) {
      if (R.horiz) fill.style.width = L + 'px'; else fill.style.height = L + 'px';
      items.forEach(function (it, i) { it.classList.toggle('on', started && L >= R.pos[i] - 1); });
    };
    R.target = function () {
      var r = list.getBoundingClientRect();
      if (R.horiz) return { L: R.len * clamp((vh * 0.86 - r.top) / (vh * 0.34), 0, 1), started: r.top < vh * 0.86 };
      var railTop = $('.rail', list).getBoundingClientRect().top;
      var line = vh * 0.62;
      return { L: clamp(line - railTop, 0, R.len), started: line > railTop };
    };
    return R;
  }
  var flow = $('[data-flow]'), tlist = $('[data-rail]');
  var RF = flow ? makeRail(flow, '.node', '.step', function () { return innerWidth >= 1100; }) : null;
  var RT = tlist ? makeRail(tlist, '.dot', '.stop', function () { return false; }) : null;

  /* ---------- התקציב: הפס מתמלא והסכום עולה ---------- */
  var bd = $('[data-bd]'), BD = null;
  if (bd) BD = { bar: $('.bd-barin', bd), tot: $('.bd-total b', bd), end: +$('[data-total]', bd).getAttribute('data-total') };
  // הסכום תמיד הסופי: מי שעוצר באמצע הגלילה לא יראה סכום שגוי. רק הפס מתמלא
  function drawBudget(p) { if (!BD) return; BD.bar.style.setProperty('--bp', p.toFixed(3)); BD.tot.textContent = fmt(BD.end); }

  /* ---------- תנועה מופחתת: הכול במצבו הסופי ---------- */
  function layoutAll() {
    layoutChart();
    [RF, RT].forEach(function (R) { if (R) R.layout(); });
  }
  function finalState() {
    drawChart(1);
    [RF, RT].forEach(function (R) { if (R) R.draw(R.len, true); });
    drawBudget(1);
  }
  if (reduce) {
    layoutAll(); finalState();
    var lastW = innerWidth;
    addEventListener('resize', function () { if (innerWidth !== lastW) { lastW = innerWidth; layoutAll(); finalState(); } });
    if (D.fonts && D.fonts.ready) D.fonts.ready.then(function () { layoutAll(); finalState(); });
    addEventListener('load', function () { layoutAll(); finalState(); });
    if (window.ScrollCraft) ScrollCraft.mount(D); // בלי רגעים מוצמדים. רק מסמן שהעמוד מוכן
    return;
  }
  root.classList.add('mo');

  /* ---------- ההצמדה של הטלפון דרך המנוע של הסקיל (scrollcraft.js, בלי שינוי) ---------- */
  $$('[data-m-act]').forEach(function (el) {
    el.setAttribute('data-sc-act', el.getAttribute('data-m-act'));
    el.setAttribute('data-sc-span', el.getAttribute('data-m-span'));
    var st = $('[data-m-stage]', el);
    if (st) st.setAttribute('data-sc-stage', '');
  });
  var engine = window.ScrollCraft ? ScrollCraft.mount(D) : null;

  var mods = [], running = false, ptr = { x: 0, y: 0, tx: 0, ty: 0 };
  var hd = $('.hd');
  function prog(el) { var r = el.getBoundingClientRect(); return clamp(-r.top / Math.max(1, r.height - vh), 0, 1); }
  function tick() {
    var again = false;
    ptr.x = lerp(ptr.x, ptr.tx, 0.08); ptr.y = lerp(ptr.y, ptr.ty, 0.08);
    if (Math.abs(ptr.x - ptr.tx) > 0.001 || Math.abs(ptr.y - ptr.ty) > 0.001) again = true;
    if (hd) hd.style.setProperty('--sp', clamp(scrollY / Math.max(1, D.documentElement.scrollHeight - vh), 0, 1).toFixed(4));
    mods.forEach(function (m) { if (m.update()) again = true; });
    if (again) requestAnimationFrame(tick); else running = false;
  }
  function kick() { if (!running) { running = true; requestAnimationFrame(tick); } }
  // ההתקדמות המצוירת מתקרבת ליעד בהדרגה בכל פריים, ולא קופצת לפי הגלילה הגולמית
  function smooth(m, target, rate) {
    var d = target - m.cur;

    m.cur += d * rate; return true;
  }
  function smoothPx(m, target, rate) {
    var d = target - m.cur;
    if (Math.abs(d) < 0.4) { m.cur = target; return false; }
    m.cur += d * rate; return true;
  }

  /* ---------- הפתיח: הטלפון מקדם שלוש תחנות, חיפוש בגוגל, פייסבוק בעברית ואותה מודעה ברוסית ---------- */
  (function hero() {
    var act = $('.hero-chat'); if (!act) return;
    var phone = $('.phone', act), typed = $('.g-typed', act), bar = $('.g-bar', act), ad = $('.g-ad', act);
    var label = $('.ph-label', act), dots = $$('.dots i', act);
    var far = $('.lyr-far', act), mid = $('.lyr-mid', act);
    var full = typed.getAttribute('data-full');
    var m = { cur: 0, st: '' };
    var ST = ['g', 'he', 'ru'];
    m.layout = function () { m.st = ''; };
    m.update = function () {
      var moving = smooth(m, prog(act), 0.2), p = m.cur;
      var k = p < 0.34 ? 0 : p < 0.67 ? 1 : 2;
      if (ST[k] !== m.st) {
        phone.setAttribute('data-st', ST[k]); m.st = ST[k];
        dots.forEach(function (d, i) { d.classList.toggle('on', i === k); });
        label.classList.toggle('on', k === 2);
      }
      // תחנה א: שורת החיפוש מתמלאת אות אחר אות, ואז המודעה עולה לראש התוצאות
      var tp = seg(p, 0.03, 0.17), typing = p > 0.02 && p < 0.185;
      bar.classList.toggle('typing', typing);
      typed.textContent = p >= 0.185 ? full : full.slice(0, Math.round(full.length * tp));
      ad.classList.toggle('on', p >= 0.2);
      // עומק: הטלפון מסתובב לחזית, והשכבות זזות בקצב שונה בגלילה ובעכבר
      var turn = out3(seg(p, 0, 0.8));
      phone.style.setProperty('--ry', (lerp(16, 3, turn) + ptr.x * 5).toFixed(2) + 'deg');
      phone.style.setProperty('--rx', (lerp(6, 1.5, turn) - ptr.y * 4).toFixed(2) + 'deg');
      far.style.transform = 'translate3d(' + (ptr.x * -10).toFixed(1) + 'px,' + (p * -28 + ptr.y * -8).toFixed(1) + 'px,0)';
      mid.style.transform = 'translate3d(' + (ptr.x * -20).toFixed(1) + 'px,' + (p * -64 + ptr.y * -14).toFixed(1) + 'px,0)';
      // המצב הגלוי, בשביל כלי הבדיקה של הסקיל (shoot.mjs), שלא רואה תנועה שהמנוע לא מניע
      act.setAttribute('data-sc-verify-state', [ST[k], typed.textContent.length, ad.classList.contains('on'), Math.round(lerp(16, 3, turn))].join('|'));
      return moving;
    };
    mods.push(m);
    if (fine) {
      addEventListener('pointermove', function (e) {
        var r = act.getBoundingClientRect();
        if (r.bottom < 0 || r.top > vh) return;
        ptr.tx = clamp(e.clientX / vw * 2 - 1, -1, 1); ptr.ty = clamp(e.clientY / vh * 2 - 1, -1, 1); kick();
      }, { passive: true });
    }
  })();

  /* ---------- השיא: הקו של הגרף נמתח לפי הגלילה ---------- */
  if (chart) mods.push((function () {
    var m = { cur: 0 };
    var box = $('.ch-box', chart);
    m.layout = function () { layoutChart(); drawChart(m.cur); };
    m.update = function () {
      var r = box.getBoundingClientRect();
      var target = clamp((vh * 0.82 - r.top) / (r.height * 0.9), 0, 1);
      var moving = smooth(m, target, 0.14);
      drawChart(m.cur);
      return moving;
    };
    return m;
  })());

  /* ---------- המסלול של פנייה אחת, וסדר העבודה ---------- */
  [RF, RT].forEach(function (R) {
    if (!R) return;
    mods.push((function () {
      var m = { cur: 0 };
      m.layout = function () { R.layout(); var t = R.target(); m.cur = t.L; R.draw(m.cur, t.started); };
      m.update = function () {
        var t = R.target();
        var moving = smoothPx(m, t.L, 0.16);
        R.draw(m.cur, t.started);
        return moving;
      };
      return m;
    })());
  });

  /* ---------- התקציב ---------- */
  if (bd) mods.push((function () {
    var m = { cur: 0 };
    m.update = function () {
      var r = bd.getBoundingClientRect();
      var target = clamp((vh * 0.78 - r.top) / (vh * 0.34), 0, 1);
      var moving = smooth(m, target, 0.12);
      drawBudget(m.cur);
      return moving;
    };
    return m;
  })());

  /* ---------- כניסה רכה לכרטיסים ---------- */
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.12 });
    $$('.rv').forEach(function (el) {
      var sibs = $$('.rv', el.parentNode).filter(function (s) { return s.parentNode === el.parentNode; });
      el.style.setProperty('--dl', (Math.min(sibs.indexOf(el), 4) * 0.08) + 's');
      io.observe(el);
    });
  } else {
    $$('.rv').forEach(function (el) { el.classList.add('in'); });
  }

  function relayout() {
    vh = innerHeight; vw = innerWidth;
    if (engine) engine.layout();
    mods.forEach(function (m) { if (m.layout) m.layout(); });
    kick();
  }
  addEventListener('scroll', kick, { passive: true });
  var lastW = innerWidth, lastH = innerHeight;
  addEventListener('resize', function () {
    // בטלפון שורת הכתובת משנה את הגובה תוך כדי גלילה, ואז אין צורך לפרוס מחדש
    if (innerWidth === lastW && Math.abs(innerHeight - lastH) < 140) { vh = innerHeight; kick(); return; }
    lastW = innerWidth; lastH = innerHeight;
    relayout();
  });
  relayout();
  if (D.fonts && D.fonts.ready) D.fonts.ready.then(relayout);
  addEventListener('load', relayout);
}


(function(){
  var app=document.getElementById('app');
  function fail(){app.innerHTML='<p style="text-align:center;padding:6rem 1rem;color:#5C5C5C;font-size:1.1rem">הקישור לא שלם. פתחו את הקישור המלא כפי שנשלח אליכם.</p>'}
  function b64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  var m=location.hash.match(/k=([A-Za-z0-9_-]+)/);
  if(!m||!window.crypto||!crypto.subtle){fail();return}
  var blob=b64u(document.getElementById('payload').textContent.trim());
  crypto.subtle.importKey('raw',b64u(m[1]),'AES-GCM',false,['decrypt'])
    .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:blob.slice(0,12)},k,blob.slice(12))})
    .then(function(buf){app.innerHTML=new TextDecoder().decode(buf);initPage()})
    .catch(fail);
})();
