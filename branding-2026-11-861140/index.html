      Array.prototype.forEach.call(root.querySelectorAll('[data-sc-in]'), function (el) { io.observe(el); });
    } else {
      Array.prototype.forEach.call(root.querySelectorAll('[data-sc-in]'), function (el) { el.classList.add('sc-in'); });
    }

    // ---- entry counters (fire once) --------------------------------------
    // A [data-sc-count] outside any pinned act is not scrubbed by scroll; it
    // ticks up once when it enters view, over data-sc-count-ms (default 1400).
    // Same formatting rules as the act counter: write the target as it should
    // render. Reduced motion writes the final value and never animates.
    (function () {
      var ease = function (t) { return 1 - Math.pow(1 - t, 3); };
      var num = function (s) { return parseFloat(String(s).replace(/,/g, '')) || 0; };
      var spec = function (c) { return (c.getAttribute('data-sc-count') || '').trim().split(/\s+/); };
      var els = Array.prototype.filter.call(root.querySelectorAll('[data-sc-count]'), function (c) {
        return !c.closest('[data-sc-act]');
      });
      if (!els.length) return;
      function run(c) {
        var nums = spec(c);
        var a = num(nums[0]), b = num(nums[1]), tpl = nums[1] || '0';
        var ms = parseFloat(c.getAttribute('data-sc-count-ms')) || 1400;
        if (reduce || ms <= 0) { c.textContent = formatNum(b, tpl); return; }
        var t0 = null, last = null;
        function frame(now) {
          if (t0 === null) t0 = now;
          var t = Math.min((now - t0) / ms, 1);
          var out = formatNum(a + (b - a) * ease(t), tpl);
          if (out !== last) { c.textContent = out; last = out; }
          if (t < 1) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }
      els.forEach(function (c) { var n = spec(c); c.textContent = formatNum(num(n[0]), n[1] || '0'); });
      if ('IntersectionObserver' in window) {
        var cio = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (!e.isIntersecting) return;
            run(e.target); cio.unobserve(e.target);
          });
        }, { rootMargin: '0px 0px -10% 0px', threshold: 0.5 });
        els.forEach(function (c) { cio.observe(c); });
      } else {
        els.forEach(run);
      }
    })();

    // ---- layout -----------------------------------------------------------
    function layout() {
      vh = innerHeight; vw = innerWidth;
      acts.forEach(function (a) {
        if (a.pinned) a.el.style.height = (a.span * 100) + 'vh';
      });
      // The spacer is the whole document flow of a worldflight. Its height is
      // the sum of the leg weights plus one viewport: without that extra screen
      // the track runs out at the moment the last leg reaches p=1, so the last
      // leg's final second is a place the reader can never actually stop.
      // Set in pixels, not vh, because .sc-world is sized in svh on phones and a
      // vh/svh mismatch would put the track and the stage on different rulers.
      worlds.forEach(function (W) {
        if (W.spacer) W.spacer.style.height = Math.round((W.total + 1) * vh) + 'px';
      });
      acts.forEach(function (a) {
        var r = a.el.getBoundingClientRect();
        a.top = r.top + scrollY;
        a.height = r.height;
      });
      if (acts.length) {
        acts.forEach(function (a) {
          if (a.seq && a.seq.el) {
            var box = a.seq.el.getBoundingClientRect();
            var dpr = Math.min(devicePixelRatio || 1, 2);
            a.seq.el.width = Math.round(box.width * dpr);
            a.seq.el.height = Math.round(box.height * dpr);
            a.seq.drawn = -1;
          }
        });
      }
      // A pinned act whose stage is not actually sticky fails silently: the
      // stage just scrolls by, the copy cues correctly against a frame nobody
      // can see, and every automated check passes. Any author rule that sets
      // `position` on the stage causes it. Say so.
      acts.forEach(function (a) {
        if (!a.pinned || !a.stage || a.stageChecked) return;
        a.stageChecked = true;
        var pos = getComputedStyle(a.stage).position;
        if (pos !== 'sticky' && pos !== '-webkit-sticky') {
          console.warn('[scrollcraft] act "' + (a.el.id || a.device) + '" will not pin: its stage computes ' +
            'position:' + pos + ', not sticky. Something is overriding .sc-stage.', a.stage);
        }
      });

      worlds.forEach(function (W) {
        W.top = W.el.getBoundingClientRect().top + scrollY;
        if (W.checked) return;
        W.checked = true;
        if (!W.stage) {
          console.warn('[scrollcraft] worldflight has no [data-sc-world] stage; nothing will fly.', W.el);
          return;
        }
        if (!W.spacer) {
          console.warn('[scrollcraft] worldflight has no [data-sc-spacer]; the page has no scroll track.', W.el);
        }
        // The same silent failure as an unpinned act, one level worse: a stage
        // that is not fixed scrolls away and takes the whole page with it, while
        // every progress number still reads correctly.
        var wp = getComputedStyle(W.stage).position;
        if (wp !== 'fixed') {
          console.warn('[scrollcraft] worldflight stage computes position:' + wp + ', not fixed. ' +
            'Something is overriding .sc-world, and the flight will scroll off screen.', W.stage);
        }
      });

      needsLayout = false;
      read();
    }

    // ---- video ------------------------------------------------------------
    function loadVideo(a) { loadClip(a.video); }
    function loadClip(V) {
      // Under reduced motion the clip is never fetched. The poster holds the
      // frame and the copy still cues, so the page reads without the decode.
      if (reduce || !V || V.loading) return;
      var src = V.el.getAttribute('data-sc-src') ||
                (isMobile() && V.el.getAttribute('data-sc-src-mobile')) ||
                V.el.currentSrc || V.el.src;
      if (isMobile() && V.el.getAttribute('data-sc-src-mobile')) src = V.el.getAttribute('data-sc-src-mobile');
      if (!src) return;
      V.loading = true;
      fetch(src).then(function (r) { if (!r.ok) throw new Error(r.status); return r.blob(); })
        .then(function (blob) {
          // Listeners and preload BEFORE src. Assigning src starts the load, so
          // attaching afterwards and then calling load() restarts it and aborts
          // the first request (visible as ERR_ABORTED on the blob URL).
          V.el.addEventListener('loadedmetadata', function () {
            V.ready = true;
            // Force one seek even when the target is already 0. The reveal is
            // gated on a 'seeked' event, and the raf loop only seeks when the
            // time actually needs to change, so a clip sitting at the very top
            // of its act would never seek, never fire 'seeked', and never
            // replace its poster until the reader scrolled it off zero.
            try { V.el.currentTime = Math.max(V.target * (V.el.duration || 1), 0.001); } catch (e) {}
            read();
            // Prime the decoder the moment the clip can be primed, without
            // waiting for a gesture. A muted inline play() is allowed with no
            // user activation on every platform except a restricted one (Low
            // Power Mode, data saver), and there the rejection is harmless: the
            // gesture listeners below retry on the next real touch.
            primeClip(V);
          });
          // Reveal only once a real frame has painted. iOS keeps a seeked-but-
          // never-played muted video blank, so hiding the poster on metadata
          // alone flashes an empty stage.
          var reveal = function () {
            if (V.painted) return;
            V.painted = true;
            V.host.classList.add('sc-has-clip');
            V.el.classList.add('sc-has-clip');
          };
          V.el.addEventListener('seeked', reveal, { once: true });
          // Never let visibility depend only on an event that may not arrive.
          // On iOS a clip that has not been played can accept a seek and never
          // fire 'seeked', which leaves the element at opacity 0 for the life of
          // the page: the poster stays up, the act looks frozen, and every later
          // act is fine because by then the reader has touched the screen and
          // the decoder is live. Reveal on a timer as well. A stage that is
          // briefly blank is a smaller fault than one that never shows its clip.
          setTimeout(reveal, 2500);
          V.el.preload = 'auto';
          V.el.muted = true;            // as a property, not only an attribute
          V.el.playsInline = true;
          V.el.src = URL.createObjectURL(blob);
        })
        .catch(function () { V.loading = false; });
    }

    // ---- image sequence ---------------------------------------------------
    function loadSeq(a) {
      var S = a.seq;
      if (!S || S.frames.length) return;
      for (var i = 0; i < S.count; i++) {
        (function (i) {
          var img = new Image();
          img.decoding = 'async';
          img.src = S.tpl.replace('{i}', String(S.start + i))
                         .replace('{ii}', String(S.start + i).padStart(2, '0'))
                         .replace('{iii}', String(S.start + i).padStart(3, '0'))
                         .replace('{iiii}', String(S.start + i).padStart(4, '0'));
          img.onload = function () { S.loaded++; if (S.loaded === 1) S.drawn = -1; };
          S.frames[i] = img;
        })(i);
      }
    }
    function drawSeq(a) {
      var S = a.seq;
      if (!S || !S.frames.length) return;
      var idx = clamp(Math.round(a.p * (S.count - 1)), 0, S.count - 1);
      if (idx === S.drawn) return;
      var img = S.frames[idx];
      if (!img || !img.complete || !img.naturalWidth) return;
      var cw = S.el.width, ch = S.el.height;
      // cover fit
      var scale = Math.max(cw / img.naturalWidth, ch / img.naturalHeight);
      var w = img.naturalWidth * scale, h = img.naturalHeight * scale;
      S.ctx.drawImage(img, (cw - w) / 2, (ch - h) / 2, w, h);
      S.drawn = idx;
    }

    // ---- worldflight ------------------------------------------------------
    // t is the position along the flight, measured in viewport-heights of
    // scroll, so every number here is in the same unit the author wrote the
    // weights in. There is no per-segment geometry to read: the stage never
    // moves, so nothing needs measuring on scroll.
    function readWorld(W) {
      if (!W.segs.length) return;
      var S = W.seam;
      var t = clamp((y - W.top) / Math.max(vh, 1), 0, W.total);
      var pr = t / W.total;
      var i, s;

      // The current leg is the last one whose crossfade has begun.
      var k = 0;
      for (i = 0; i < W.segs.length; i++) if (t >= W.segs[i].c0 - S / 2) k = i;

      for (i = 0; i < W.segs.length; i++) {
        s = W.segs[i];
        var local = clamp01((t - s.c0) / Math.max(s.w, 0.001));
        s.local = local;

        // Fetch a leg only while it is within reach. Loading the whole flight up
        // front is tens of megabytes before the first frame paints; loading it

  }, { rootMargin: '-48% 0px -50% 0px', threshold: 0 });
  $$('[data-tile]').forEach(function(s){ io.observe(s); });
  setTile(1);
  function closeMenu(){ menu.hidden = true; mgBtn.setAttribute('aria-expanded','false'); }
  mgBtn.addEventListener('click', function(e){
    e.stopPropagation();
    var open = menu.hidden; menu.hidden = !open; mgBtn.setAttribute('aria-expanded', String(open));
    if (open) menuLinks[0].focus({ preventScroll: true });
  });
  menuLinks.forEach(function(a){ a.addEventListener('click', closeMenu); });
  document.addEventListener('click', function(e){ if (!menu.hidden && !menu.contains(e.target)) closeMenu(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !menu.hidden) { closeMenu(); mgBtn.focus(); } });

  // פיצול ציטוטים למילים
  $$('[data-split]').forEach(function(q){
    var words = q.textContent.trim().split(/\s+/);
    q.setAttribute('aria-label', q.textContent.trim());
    q.innerHTML = words.map(function(w){ return '<span class="w" aria-hidden="true">'+w+'</span>'; }).join(' ');
  });

  if (RM) {
    // מצב סופי סטטי: רק מה שצריך מדידה
    var r0 = $('#s-gap .track--a .rail'); if (r0) root.style.setProperty('--railw', r0.offsetWidth + 'px');
    placeChips(true);
    return;
  }

  // ===== מנגנון הסצנות: התקדמות מוחלקת לכל סצנה =====
  var scenes = [];
  function scene(el, mode, render, measure, opts){
    if (!el) return null;
    var s = { el: el, mode: mode, render: render, measure: measure || null, opts: opts || {}, cur: -1, shown: -2 };
    scenes.push(s); return s;
  }
  function target(s){
    var r = s.el.getBoundingClientRect(), vh = innerHeight;
    s.near = r.bottom > -vh * 0.5 && r.top < vh * 1.5;
    if (s.mode === 'pin') { var span = s.el.offsetHeight - vh; return span > 0 ? clamp(-r.top / span, 0, 1) : 0; }
    if (s.mode === 'through') { var a = vh * (s.opts.at || .7); return clamp((a - r.top) / Math.max(1, r.height), 0, 1); }
    // view: 0 כשהראש בתחתית המסך, 1 כשהוא מגיע לקו העליון שנקבע
    var end = vh * (s.opts.end == null ? .3 : s.opts.end);
    return clamp((vh - r.top) / (vh - end), 0, 1);
  }
  function measureAll(){ scenes.forEach(function(s){ if (s.measure) s.measure(); s.shown = -2; }); }

  // ----- 1 · פתיחה -----
  var hero = $('.hero'), grid = $('.hero__grid'), tps = $$('.hero__grid .tp'), copyIn = $('.hero__copy-in');
  var ghost = $('.hero__ghost'), fgA = $('.hero__fg--a'), fgB = $('.hero__fg--b');
  var depth = [46,-28,72,-54,0,34,-22,60,-40];
  var tileSize = 100, heroOffY = 0, tilt = { x:0, y:0, tx:0, ty:0 };
  var fine = matchMedia('(hover: hover) and (pointer: fine)').matches;
  if (fine) addEventListener('pointermove', function(e){
    tilt.tx = (e.clientY / innerHeight - .5) * -10;
    tilt.ty = (e.clientX / innerWidth - .5) * 14;
  }, { passive: true });
  var heroS = scene($('#s-open'), 'pin', function(p){
    var vw = innerWidth, vh = innerHeight, mob = vw < 820;
    var a = sm(seg(p, 0, .42));
    var z = seg(p, .36, 1), ze = Math.pow(z, 2.4);
    var offX = mob ? 0 : -.2 * vw, offY = mob ? heroOffY : 0;
    var rx = (1 - a) * (12 + tilt.x), ry = (1 - a) * (-20 + tilt.y);
    grid.style.transform = 'translate(-50%,-50%) translate(' + (offX * (1 - a)) + 'px,' + (offY * (1 - a)) + 'px) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';
    var cover = Math.hypot(vw, vh) / tileSize * 1.25;
    tps.forEach(function(t, i){
      var row = Math.floor(i / 3) - 1, col = (i % 3) - 1;
      var dz = depth[i] * (1 - a);
      if (i === 4) {
        t.style.transform = 'translate3d(0,0,' + (dz + (z > 0 ? 3 : 0)) + 'px) scale(' + (1 + ze * cover) + ')';
        t.style.zIndex = z > 0 ? 5 : '';
      } else {
        var fly = out3(seg(z, 0, .7));
        t.style.transform = 'translate3d(' + (col * fly * vw * .55) + 'px,' + (row * fly * vh * .55) + 'px,' + dz + 'px)';
        t.style.opacity = 1 - seg(z, .05, .55);
      }
    });
    copyIn.style.transform = 'translateY(' + (-seg(p, 0, .4) * 7) + 'vh)';
    copyIn.style.opacity = 1 - seg(p, .06, .3);
    ghost.style.transform = 'translateY(' + (p * 14) + 'vh) rotate(' + (-8 + a * 8) + 'deg)';
    ghost.style.opacity = 1 - seg(p, .18, .42);
    fgA.style.transform = 'translate(' + (tilt.y * -2.2) + 'px,' + (-p * 95 + tilt.x * 2) + 'vh) rotate(' + (p * 40) + 'deg)';
    fgB.style.transform = 'translate(' + (tilt.y * 1.6) + 'px,' + (-p * 70) + 'vh) rotate(' + (-p * 30) + 'deg)';
    fgA.style.opacity = fgB.style.opacity = 1 - seg(p, .3, .5);
  }, function(){
    grid.style.width = '';
    if (innerWidth < 820) {
      var prevT = copyIn.style.transform; copyIn.style.transform = 'none';
      var cb = copyIn.getBoundingClientRect().bottom - hero.getBoundingClientRect().top;
      copyIn.style.transform = prevT;
      var avail = innerHeight - cb - 20, g = grid.offsetWidth;
      if (avail < g + 24) { g = Math.max(84, avail - 24); grid.style.width = g + 'px'; }
      heroOffY = cb + 10 + Math.max(avail, g) / 2 - innerHeight / 2;
    }
    tileSize = tps[4].offsetWidth || 100;
  });

  // ----- 2 · הפער -----
  var railA = $('#s-gap .track--a .rail'), railB = $('#s-gap .track--b .rail'), tracks = $('#s-gap .tracks');
  var fillA = $('#s-gap .rail__fill'), mkA = $('#s-gap .mk--a'), band = $('#s-gap .band');
  var dots = $$('#s-gap .rail__dot'), miles = $$('#s-gap .miles li'), ats = [.22,.56,.9];
  var gapA = $('#s-gap .gap__a'), gapB = $('#s-gap .gap__b'), trackB = $('#s-gap .track--b');
  var railW = 600;
  scene($('#s-gap'), 'pin', function(p){
    var x = sm(seg(p, .1, .56)) * .9;
    mkA.style.transform = 'translateX(' + (-x * railW) + 'px)';
    fillA.style.transform = 'scaleX(' + x + ')';
    ats.forEach(function(at, i){ var on = x >= at - .005; dots[i].classList.toggle('is-on', on); miles[i].classList.toggle('is-on', on); });
    trackB.style.opacity = .35 + .65 * seg(p, .02, .1);
    var b = seg(p, .58, .7);
    band.style.opacity = b; band.style.transform = 'scaleX(' + out3(b) + ')';
    gapA.style.opacity = 1 - seg(p, .66, .74);
    gapB.style.opacity = seg(p, .74, .82);
    gapB.style.transform = 'translateY(' + ((1 - out3(seg(p, .74, .84))) * 2) + 'vh)';
  }, function(){
    railW = railA.offsetWidth;
    var tr = tracks.getBoundingClientRect(), a = railA.getBoundingClientRect(), b = railB.getBoundingClientRect();
    var top = a.top - tr.top - 26, bottom = b.bottom - tr.top + 26;
    band.style.top = top + 'px'; band.style.height = (bottom - top) + 'px';
  });

  // ----- 3 · המתג (השיא) -----
  var tg = $('.tg'), knob = $('.tg__knob'), orB = $('.tg__or'), andB = $('.tg__and');
  var hA = $('.choice__h--a'), hB = $('.choice__h--b'), capA = $('.cap--a'), capB = $('.cap--b'), stamp = $('.choice__stamp');
  var tgW = 800, tgH = 90, vert = false;
  scene($('#s-choice'), 'pin', function(p){
    // הורה מתלבט: הכפתור עובר ימינה ושמאלה, ואז נמתח על שני הצדדים
    var x = sm(seg(p, .1, .17)) - sm(seg(p, .21, .28)) + sm(seg(p, .32, .39));
    var m = sm(seg(p, .5, .64));
    var R = vert ? 26 : 999;
    if (!vert) {
      var half = tgW / 2;
      var start = (1 - x) * half;            // מרחק מהקצה השמאלי של הכפתור
      var width = half * (1 + m);
      var left = start * (1 - m);
      var right = tgW - left - width;
      knob.style.clipPath = 'inset(0 ' + Math.max(0, right) + 'px 0 ' + Math.max(0, left) + 'px round ' + R + 'px)';
    } else {
      var halfH = tgH / 2;
      var top = x * halfH * (1 - m);
      var h = halfH * (1 + m);
      var bot = tgH - top - h;
      knob.style.clipPath = 'inset(' + Math.max(0, top) + 'px 0 ' + Math.max(0, bot) + 'px 0 round ' + R + 'px)';
    }
    tg.setAttribute('data-on', m > .5 ? 'both' : (x < .5 ? 'r' : 'l'));
    tg.style.opacity = seg(p, 0, .05);
    tg.style.transform = 'scale(' + (mix(.94, 1, out3(seg(p, 0, .07))) * (1 + .03 * sm(seg(p, .5, .58)) - .03 * sm(seg(p, .58, .66)))) + ')';
    var swap = seg(p, .5, .58);
    orB.style.opacity = 1 - swap; orB.style.transform = 'rotate(' + (swap * -90) + 'deg) scale(' + (1 - swap * .4) + ')';
    andB.style.opacity = seg(p, .55, .62); andB.style.transform = 'rotate(' + ((1 - seg(p, .55, .64)) * 90) + 'deg)';
    hA.style.opacity = 1 - seg(p, .56, .62);
    hA.style.transform = 'translateY(' + (-seg(p, .56, .62) * 2) + 'vh)';
    hB.style.opacity = seg(p, .6, .67);
    hB.style.transform = 'translateY(' + ((1 - out3(seg(p, .6, .68))) * 2.5) + 'vh)';
    capA.style.opacity = seg(p, .2, .27) * (1 - seg(p, .5, .56));
    capB.style.opacity = seg(p, .76, .84);
    var st = seg(p, .66, .76);
    stamp.style.opacity = seg(st, 0, .4);
    stamp.style.transform = 'scale(' + mix(1.35, 1, back(st)) + ')';
  }, function(){
    vert = matchMedia('(max-width:640px)').matches;
    tgW = knob.offsetWidth; tgH = knob.offsetHeight;
  });

  // ----- 4 · שלושת הפעלים ושורת התיכונים -----
  var verbs = $$('.verbs span'), slogan = $('.ours__slogan'), oursNote = $('.ours__note');
  scene($('.verbs'), 'view', function(p){
    verbs.forEach(function(v, i){
      var t = out3(seg(p, .04 + i * .13, .42 + i * .13));
      v.style.transform = 'translateX(' + ((1 - t) * (i % 2 ? -28 : 28)) + 'vw)';
      v.style.opacity = seg(t, 0, .35);
    });
    slogan.style.opacity = oursNote.style.opacity = seg(p, .6, .85);
  }, null, { end: .12 });
  var schools = $$('.school'), us = $('.school--us'), usSpan = $('.school--us span');
  scene($('.schools__row'), 'view', function(p){
    var s = sm(seg(p, .5, .8));
    schools.forEach(function(el, i){
      var t = out3(seg(p, .05 + i * .06, .32 + i * .06));
      if (el === us) {
        el.style.opacity = seg(t, 0, .3);
        el.style.transform = 'translateY(' + ((1 - t) * 3) + 'rem) scale(' + (1 + .06 * s) + ')';
      } else {
        el.style.opacity = seg(t, 0, .3) * mix(1, .8, s);
        el.style.transform = 'translateY(' + ((1 - t) * 3 + s * .6) + 'rem) scale(' + (1 - .07 * s) + ')';
      }
    });
    usSpan.style.opacity = .25 + .75 * s;
  }, null, { end: .3 });

  // ----- 5 · המסננת -----
  var chipsS = $$('.chip-s'), sieveCols = $('.sieve__cols'), chipDx = [];
  scene(sieveCols, 'view', function(p){
    var q = sm(seg(p, .3, .7));
    chipsS.forEach(function(c, i){
      var d = chipDx[i] || { x:0, y:0, r:0 };
      c.style.transform = 'translate(' + (d.x * (1 - q)) + 'px,' + (d.y * (1 - q)) + 'px) rotate(' + (d.r * (1 - q)) + 'deg)';
      c.style.opacity = seg(p, .05 + i * .03, .2 + i * .03);
    });
  }, function(){
    var box = sieveCols.getBoundingClientRect(), cx = box.left + box.width / 2, cy = box.top + box.height * .45;
    chipsS.forEach(function(c, i){
      var prev = c.style.transform; c.style.transform = 'none';
      var r = c.getBoundingClientRect();
      chipDx[i] = { x: cx - (r.left + r.width / 2), y: cy - (r.top + r.height / 2) + (i - 2) * 10, r: [-9, 6, -4, 10, -6][i] || 0 };
      c.style.transform = prev;
    });
  }, { end: .28 });

  // ----- 6 · המשפטים שלכם -----
  var q1 = $('.qt--1'), q2 = $('.qt--2');
  var w1 = $$('.w', q1), w2 = $$('.w', q2), n1 = $('.qt__note', q1), n2 = $('.qt__note', q2);
  function light(ws, f){ var n = Math.round(f * ws.length); ws.forEach(function(w, i){ w.classList.toggle('is-on', i < n); }); }
  scene($('#s-words'), 'pin', function(p){
    light(w1, seg(p, .04, .36));
    light(w2, seg(p, .56, .88));
    n1.style.opacity = seg(p, .36, .42);
    n2.style.opacity = seg(p, .88, .94);
    q1.style.opacity = 1 - seg(p, .48, .53);
    q2.style.opacity = seg(p, .52, .57);
  });

  // ----- 7 · הקיר -----
  var bricks = $$('.brick').sort(function(a, b){ return a.getAttribute('data-o') - b.getAttribute('data-o'); });
  var rowLabels = { 1: $('.row[data-phase="1"] .row__label'), 2: $('.row[data-phase="2"] .row__label'), 3: $('.row[data-phase="3"] .row__label') };
  var wallFoot = $('.wall__foot');
  scene($('#s-plan'), 'pin', function(p){
    var vh = innerHeight;
    bricks.forEach(function(b, i){
      var st = .05 + i * (.74 / 17), t = seg(p, st, st + .085);
      b.style.transform = 'translateY(' + ((1 - back(t)) * -.62 * vh) + 'px) rotate(' + ((1 - t) * (i % 2 ? 7 : -7)) + 'deg)';
      b.style.opacity = seg(t, 0, .12);
    });
    rowLabels[1].style.opacity = seg(p, .05, .1);
    rowLabels[2].style.opacity = seg(p, .05 + 7 * (.74 / 17), .1 + 7 * (.74 / 17));
    rowLabels[3].style.opacity = seg(p, .05 + 14 * (.74 / 17), .1 + 14 * (.74 / 17));
    wallFoot.style.opacity = seg(p, .86, .93);
  });

  // ----- 8 · מבית הספר אל העיר -----
  var ring1 = $('.orb--1'), ring2 = $('.orb--2'), chips = $$('.ripple__viz .chip'), rcA = $('.rc--a'), rcB = $('.rc--b');
  function placeChips(stat){
    var viz = $('.ripple__viz'); if (!viz) return;
    var r2 = $('.orb--2').offsetWidth / 2;
    $$('.ripple__viz .chip').forEach(function(c){
      var a = +c.getAttribute('data-a') * Math.PI / 180, rr = r2 * (+c.getAttribute('data-r')) * 2;
      var vr = viz.getBoundingClientRect(), cx = vr.left + vr.width * parseFloat(getComputedStyle(viz).getPropertyValue('--cx')) / 100;
      var half = c.offsetWidth / 2 + 12, x = Math.cos(a) * rr;
      x = clamp(x, half - cx, innerWidth - half - cx);
      c.dataset.x = x; c.dataset.y = Math.sin(a) * rr;
      if (stat) c.style.transform = 'translate(-50%,-50%) translate(' + c.dataset.x + 'px,' + c.dataset.y + 'px)';
    });
  }
  scene($('#s-expo'), 'pin', function(p){
    var s1 = out3(seg(p, .04, .26)), s2 = sm(seg(p, .46, .74));
    ring1.style.transform = 'translate(-50%,-50%) scale(' + s1 + ')';
    ring2.style.transform = 'translate(-50%,-50%) scale(' + mix(.35, 1, s2) + ')';
    ring2.style.opacity = seg(p, .46, .52);
    chips.forEach(function(c, i){
      var t = out3(seg(p, .6 + i * .05, .72 + i * .05));
      c.style.opacity = seg(t, 0, .4);
      c.style.transform = 'translate(-50%,-50%) translate(' + (c.dataset.x * mix(.4, 1, t)) + 'px,' + (c.dataset.y * mix(.4, 1, t)) + 'px) scale(' + mix(.7, 1, t) + ')';
    });
    rcA.style.opacity = 1 - seg(p, .42, .48);
    rcB.style.opacity = seg(p, .5, .58);
    rcB.style.transform = 'translateY(' + ((1 - out3(seg(p, .5, .6))) * 2) + 'vh)';
  }, function(){ placeChips(false); });

  // ----- 8ב · הקו של הערוצים, והמשפך -----
  var chanFill = $('.chan__rail i');
  scene($('.chan__list'), 'through', function(p){ chanFill.style.transform = 'scaleY(' + p + ')'; }, null, { at: .65 });
  var fChans = $$('.funnel__chans span'), fBar = $('.funnel__bar'), fPoint = $('.funnel__point');
  scene($('#s-funnel'), 'view', function(p){
    fChans.forEach(function(c, i){
      var t = out3(seg(p, .1 + i * .05, .4 + i * .05));
      c.style.opacity = seg(t, 0, .4); c.style.transform = 'translateY(' + ((1 - t) * -1.4) + 'rem)';
    });
    fBar.style.transform = 'scaleY(' + sm(seg(p, .5, .72)) + ')';
    var t = seg(p, .7, .9);
    fPoint.style.opacity = seg(t, 0, .3); fPoint.style.transform = 'scale(' + mix(.85, 1, back(t)) + ')';
  }, null, { end: .25 });

  // ----- 9 · לוח הזמנים -----
  var tlFill = $('.tl__rail i'), stops = $$('.tl__stop');
  scene($('.tl'), 'view', function(p){
    var f = sm(seg(p, .15, .85)), vertTl = matchMedia('(max-width:700px)').matches;
    tlFill.style.transform = vertTl ? 'scaleY(' + f + ')' : 'scaleX(' + f + ')';
    stops.forEach(function(s, i){ s.classList.toggle('is-on', f >= i / (stops.length - 1) - .02); });
  }, null, { end: .35 });

  // ===== לולאה אחת =====
  var last = performance.now();
  function frame(now){
    var dt = Math.min(64, now - last); last = now;
    var k = 1 - Math.pow(1 - .2, dt / 16.67);
    var tk = 1 - Math.pow(1 - .08, dt / 16.67);
    var tiltMoved = false;
    if (fine) {
      var nx = tilt.x + (tilt.tx - tilt.x) * tk, ny = tilt.y + (tilt.ty - tilt.y) * tk;
      tiltMoved = Math.abs(nx - tilt.x) + Math.abs(ny - tilt.y) > .002;
      tilt.x = nx; tilt.y = ny;
    }
    var ts = scenes.map(target);
    scenes.forEach(function(s, i){
      var t = ts[i];
      if (s.cur < 0) s.cur = t; else { s.cur += (t - s.cur) * k; if (Math.abs(t - s.cur) < .0004) s.cur = t; }
      var force = s === heroS && tiltMoved;
      if ((s.near || s.shown === -2) && (s.cur !== s.shown || force)) { s.shown = s.cur; s.render(s.cur); }
    });
    requestAnimationFrame(frame);
  }
  function boot(){ measureAll(); requestAnimationFrame(frame); }
  var rt; addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(measureAll, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ measureAll(); });
  boot();
})();

}

(function(){
  var app=document.getElementById('app');
  function fail(){app.innerHTML='<p style="text-align:center;padding:6rem 1rem;color:#6E6A62;font-size:1.1rem">הקישור לא שלם. פתחו את הקישור המלא כפי שנשלח אליכם.</p>'}
  function b64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  var m=location.hash.match(/k=([A-Za-z0-9_-]+)/);
  if(!m||!window.crypto||!crypto.subtle){fail();return}
  var blob=b64u(document.getElementById('payload').textContent.trim());
  crypto.subtle.importKey('raw',b64u(m[1]),'AES-GCM',false,['decrypt'])
    .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:blob.slice(0,12)},k,blob.slice(12))})
    .then(function(buf){app.innerHTML=new TextDecoder().decode(buf);initPage()})
    .catch(fail);
})();
