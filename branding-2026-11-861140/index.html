<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F5B424'/%3E%3C/svg%3E">
<style>/* ============================================================================
   scrollcraft.css: the taste floor
   ----------------------------------------------------------------------------
   Two layers, and the split matters:

     TOKENS   what you override per brand. Colour roles, the type ramp, the
              spacing scale, elevation, motion. A brand is ~12 values.
     DEVICES  what the engine drives. Do not restyle these to taste; they are
              the mechanism. Style your own markup instead.

   Nothing here draws a "component". There are no card, badge, or pill classes,
   because a stylesheet that ships those is how every page built on it ends up
   with the same shapes. You get a floor and a vocabulary; the composition is
   yours.
   ========================================================================== */

/* ---------------------------------------------------------------- tokens -- */
:root {
  /* --- colour roles. Override these six and the page is rebranded. -------- */
  --sc-canvas:      #08090b;   /* the page ground. Drift interpolates this.   */
  --sc-surface:     #101217;   /* anything raised off the ground             */
  --sc-ink:         #f4f2ef;   /* primary text                               */
  --sc-ink-soft:    #9a9ba1;   /* secondary text. Tinted, never flat gray.   */
  --sc-accent:      #d8ff3e;   /* ONE accent. It owns a region, not confetti. */
  --sc-accent-ink:  #08090b;   /* text that sits on the accent               */

  --sc-hairline:    color-mix(in oklab, var(--sc-ink) 12%, transparent);
  --sc-hairline-strong: color-mix(in oklab, var(--sc-ink) 22%, transparent);

  /* --- type. Two families max. Display carries voice, text carries prose. - */
  --sc-font-display: "Instrument Sans", "Geist", system-ui, sans-serif;
  --sc-font-text:    "Geist", system-ui, sans-serif;
  --sc-font-mono:    "Geist Mono", ui-monospace, monospace;

  /* Fluid ramp. Tracking tightens as size grows because a face set at 6rem
     with 0 tracking reads loose; this is optical correction, not decoration. */
  --sc-t-xs:   clamp(0.75rem, 0.72rem + 0.15vw, 0.82rem);
  --sc-t-sm:   clamp(0.875rem, 0.84rem + 0.18vw, 0.95rem);
  --sc-t-base: clamp(1rem, 0.96rem + 0.22vw, 1.125rem);
  --sc-t-lg:   clamp(1.2rem, 1.1rem + 0.5vw, 1.5rem);
  --sc-t-xl:   clamp(1.6rem, 1.35rem + 1.2vw, 2.25rem);
  --sc-t-2xl:  clamp(2.1rem, 1.6rem + 2.4vw, 3.4rem);
  --sc-t-3xl:  clamp(2.8rem, 1.9rem + 4.2vw, 5rem);
  --sc-t-4xl:  clamp(3.4rem, 1.9rem + 6.6vw, 7.5rem);

  --sc-track-tight:  -0.035em;
  --sc-track-snug:   -0.02em;
  --sc-track-normal: -0.005em;
  --sc-track-wide:    0.08em;

  --sc-leading-none: 0.94;
  --sc-leading-tight: 1.06;
  --sc-leading-body: 1.62;

  --sc-measure: 62ch;

  /* --- space. 4px base: the useful middle steps an 8-only scale misses. --- */
  --sc-1: 0.25rem;  --sc-2: 0.5rem;   --sc-3: 0.75rem;  --sc-4: 1rem;
  --sc-5: 1.5rem;   --sc-6: 2rem;     --sc-7: 3rem;     --sc-8: 4rem;
  --sc-9: 6rem;     --sc-10: 8rem;    --sc-11: 12rem;

  /* Section rhythm is fluid so a phone doesn't inherit desktop air. */
  --sc-section: clamp(4.5rem, 9vw, 11rem);
  --sc-gutter:  clamp(1.25rem, 5vw, 5.5rem);
  --sc-maxw:    82rem;

  /* --- radius. Pick one scale for the page and hold it. ------------------- */
  --sc-r-sm: 6px;  --sc-r-md: 12px;  --sc-r-lg: 20px;  --sc-r-pill: 999px;

  /* --- elevation. Every shadow has an offset AND a soft blur, and is tinted
         to the canvas hue. A zero-offset coloured halo is decoration, not
         depth, so there isn't one here. ---------------------------------- */
  --sc-shadow-color: 220 40% 2%;
  --sc-e1: 0 1px 2px hsl(var(--sc-shadow-color) / 0.28),
           0 2px 6px -1px hsl(var(--sc-shadow-color) / 0.20);
  --sc-e2: 0 2px 4px hsl(var(--sc-shadow-color) / 0.24),
           0 8px 18px -4px hsl(var(--sc-shadow-color) / 0.30);
  --sc-e3: 0 4px 8px hsl(var(--sc-shadow-color) / 0.22),
           0 18px 40px -8px hsl(var(--sc-shadow-color) / 0.38),
           0 48px 90px -24px hsl(var(--sc-shadow-color) / 0.30);

  /* Edge light: a 1px top highlight sells a raised surface better than any
     amount of blur, because real raised things catch light on their lip. */
  --sc-edge: inset 0 1px 0 color-mix(in oklab, var(--sc-ink) 10%, transparent);

  /* --- motion. Built-in CSS easings are too weak for UI. ------------------ */
  --sc-ease-out:    cubic-bezier(0.23, 1, 0.32, 1);
  --sc-ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --sc-ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --sc-d-fast: 160ms;  --sc-d-base: 240ms;  --sc-d-slow: 420ms;

  --sc-z-stage: 1; --sc-z-copy: 20; --sc-z-chrome: 60;
}

/* --------------------------------------------------------------- reset -- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

body {
  margin: 0;
  background: var(--sc-canvas);
  color: var(--sc-ink);
  font-family: var(--sc-font-text);
  font-size: var(--sc-t-base);
  line-height: var(--sc-leading-body);
  letter-spacing: var(--sc-track-normal);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-synthesis-weight: none;
  overflow-x: clip;
}
img, video, canvas, svg { display: block; max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }

/* ------------------------------------------------- the browser surfaces --
   The parts you did not draw still carry the design. Selection, caret, focus
   ring, scrollbar and tabular numerals all ship with defaults that belong to no
   design system. Theming them is the cheapest signal that a page was built
   rather than assembled, and it is the step that gets skipped most reliably. */
::selection { background: var(--sc-accent); color: var(--sc-accent-ink); }
:root { caret-color: var(--sc-accent); accent-color: var(--sc-accent); }
:focus-visible {
  outline: 2px solid var(--sc-accent);
  outline-offset: 3px;
  border-radius: var(--sc-r-sm);
}
:where(a) { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 0.22em; }
@supports (scrollbar-color: auto) {
  html { scrollbar-color: color-mix(in oklab, var(--sc-ink) 26%, transparent) transparent; scrollbar-width: thin; }
}
:where(table, .sc-nums, [data-sc-count]) { font-variant-numeric: tabular-nums; }

/* ----------------------------------------------------------- typography -- */
.sc-display {
  font-family: var(--sc-font-display);
  font-weight: 500;
  line-height: var(--sc-leading-none);
  letter-spacing: var(--sc-track-tight);
  text-wrap: balance;
  margin: 0;
}
.sc-display--xl { font-size: var(--sc-t-4xl); }
.sc-display--lg { font-size: var(--sc-t-3xl); }
.sc-display--md { font-size: var(--sc-t-2xl); letter-spacing: var(--sc-track-snug); }
.sc-lede {
  font-size: var(--sc-t-lg);
  line-height: 1.44;
  letter-spacing: var(--sc-track-snug);
  color: var(--sc-ink);
  max-width: 46ch;
  text-wrap: pretty;
  margin: 0;
}
.sc-body { max-width: var(--sc-measure); color: var(--sc-ink-soft); text-wrap: pretty; margin: 0; }
.sc-label {
  font-family: var(--sc-font-mono);
  font-size: var(--sc-t-xs);
  letter-spacing: var(--sc-track-wide);
  text-transform: uppercase;
  color: var(--sc-ink-soft);
}

/* ---------------------------------------------------------------- layout -- */
.sc-wrap { width: 100%; max-width: var(--sc-maxw); margin-inline: auto; padding-inline: var(--sc-gutter); }
.sc-section { padding-block: var(--sc-section); }
/* More space above a heading than below it: the gap belongs to the boundary,
   not to the pair. */
.sc-stack > * + * { margin-top: var(--sc-4); }
.sc-stack > :is(h1,h2,h3) { margin-top: var(--sc-7); }
.sc-stack > :is(h1,h2,h3):first-child { margin-top: 0; }
.sc-rule { height: 1px; border: 0; background: var(--sc-hairline); margin: 0; }

/* =============================================================== DEVICES ==
   Driven by the engine. Restyle your own markup, not these.                */

.sc-act--pinned { position: relative; }
.sc-stage {
  position: sticky; top: 0;
  height: 100vh; height: 100svh;
  overflow: clip;
  z-index: var(--sc-z-stage);
}

/* scrub / sequence media */
.sc-stage :is(video[data-sc-scrub], canvas[data-sc-sequence], .sc-stage__poster) {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
}
video[data-sc-scrub] { opacity: 0; transition: opacity 380ms var(--sc-ease-out); }
.sc-has-clip video[data-sc-scrub] { opacity: 1; }
/* The poster is a live frame-holder, not a placeholder: it stays up until a
   real video frame has painted, which is what stops the blank-stage flash. */
.sc-stage__poster { z-index: 0; transition: opacity 380ms var(--sc-ease-out); }
.sc-has-clip .sc-stage__poster { opacity: 0; }

/* A scrim only where text sits. A full-frame darkening layer flattens the
   image everywhere to fix contrast in one corner. */
.sc-scrim {
  position: absolute; inset: 0; pointer-events: none; z-index: 1;
  background: linear-gradient(
    var(--sc-scrim-angle, 180deg),
    color-mix(in oklab, var(--sc-canvas) var(--sc-scrim-a, 78%), transparent) 0%,
    color-mix(in oklab, var(--sc-canvas) 30%, transparent) 42%,
    transparent 68%);
}
/* Point the scrim at the copy. A scrim gradient that darkens the top while the
   copy sits at the bottom fixes contrast nowhere and flattens the image
   everywhere, which is the most common way text-over-video goes wrong. */
.sc-scrim--bottom { --sc-scrim-angle: 0deg; }
.sc-scrim--left   { --sc-scrim-angle: 90deg; }
.sc-scrim--right  { --sc-scrim-angle: 270deg; }

/* Corner scrims, for copy anchored to a corner. An edge gradient has to darken
   a whole band across the frame to cover one corner; a corner gradient puts the
   density where the text is and leaves the rest of the image alone. Pair with
   .sc-copy--lead / .sc-copy--trail. */
.sc-scrim--lead {
  background: linear-gradient(to top right,
    color-mix(in oklab, var(--sc-canvas) 94%, transparent) 0%,
    color-mix(in oklab, var(--sc-canvas) 72%, transparent) 30%,
    color-mix(in oklab, var(--sc-canvas) 30%, transparent) 52%,
    transparent 72%);
}
.sc-scrim--trail {
  background: linear-gradient(to top left,
    color-mix(in oklab, var(--sc-canvas) 94%, transparent) 0%,
    color-mix(in oklab, var(--sc-canvas) 72%, transparent) 30%,
    color-mix(in oklab, var(--sc-canvas) 30%, transparent) 52%,
    transparent 72%);
}
/* A band across the bottom, for copy that spans the full width of the frame.
   That is what both corner anchors become below 860px, and it is also the right
   shape whenever the copy block is wider than a corner. */
.sc-scrim--band {
  background: linear-gradient(to top,
    color-mix(in oklab, var(--sc-canvas) 94%, transparent) 0%,
    color-mix(in oklab, var(--sc-canvas) 74%, transparent) 22%,
    color-mix(in oklab, var(--sc-canvas) 30%, transparent) 42%,
    transparent 58%);
}
.sc-scrim--vignette {
  background: radial-gradient(120% 90% at 50% 45%, transparent 40%,
              color-mix(in oklab, var(--sc-canvas) 70%, transparent) 100%);
}

/* copy over a stage.
   max-width is in rem, never ch. A `ch` on this container resolves against the
   CONTAINER's font-size (body size), not the display size of the heading inside
   it, so `max-width: 20ch` here silently produces a ~180px column and wraps a
   hero headline to six lines. Set a ch measure on the text element itself. */
.sc-copy {
  position: absolute; z-index: var(--sc-z-copy);
  inset-inline: var(--sc-gutter);
  max-width: min(46rem, 76vw);
  will-change: opacity, transform;
}
.sc-copy--lead   { left: var(--sc-gutter); bottom: clamp(3rem, 12vh, 9rem); }
/* inset-inline FIRST. It is the shorthand for left+right, so declaring it after
   `left: 50%` resets left to auto and the block drifts off the left edge. */
.sc-copy--center { inset-inline: auto; left: 50%; top: 50%; translate: -50% -50%; text-align: center; }
.sc-copy--trail  { inset-inline: auto; right: var(--sc-gutter); bottom: clamp(3rem, 12vh, 9rem); text-align: right; }

/* cue defaults: the engine writes opacity/transform inline, these are the
   pre-paint state so nothing flashes before the first read() */
[data-sc-cue] { opacity: 0; will-change: opacity, transform; }
.sc-ready [data-sc-cue] { transition: none; }

/* kinetic split */
.sc-split { display: inline-block; overflow: hidden; vertical-align: top; }
/* Descenders live below the baseline; a line mask clipped to the line box eats
   the tails off g, y, p, j. The padding buys them room back. */
.sc-split--line { display: block; padding-bottom: 0.14em; margin-bottom: -0.14em; }
.sc-split__i { display: inline-block; will-change: transform, opacity; }
.sc-is-split { opacity: 1 !important; }

/* horizontal rail */
[data-sc-pan] { display: flex; will-change: transform; }

/* reveal + parallax */
[data-sc-reveal] { will-change: clip-path; }
[data-sc-parallax] { will-change: transform; }

/* flow reveal (fires once) */
[data-sc-in], [data-sc-stagger] > * {
  opacity: 0;
  transform: translate3d(0, 14px, 0);
  transition: opacity 620ms var(--sc-ease-out), transform 620ms var(--sc-ease-out);
}
[data-sc-in].sc-in, [data-sc-stagger] > .sc-in { opacity: 1; transform: none; }

/* pointer devices */
[data-sc-tilt] { transform-style: preserve-3d; will-change: transform; }
[data-sc-magnet] { will-change: transform; }
/* isolation always; position only if nothing more specific already set it.
   Written with :where() (zero specificity) on purpose: a plain `position:
   relative` here has the same weight as `.sc-stage` and, being later in the
   file, silently wins. A stage carrying both attributes then stops being
   sticky and the whole act scrolls away instead of pinning. */
[data-sc-spotlight] { isolation: isolate; }
:where([data-sc-spotlight]) { position: relative; }
[data-sc-spotlight]::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2;
  background: radial-gradient(
    28rem 28rem at calc(var(--sc-mx, 0.5) * 100%) calc(var(--sc-my, 0.5) * 100%),
    color-mix(in oklab, var(--sc-accent) 16%, transparent), transparent 70%);
  opacity: 0; transition: opacity var(--sc-d-slow) var(--sc-ease-out);
}
[data-sc-spotlight]:hover::after { opacity: 1; }

/* =========================================================== WORLDFLIGHT ==
   One fixed stage for the whole page. The only thing in document flow is the
   spacer, and it is empty. If you find yourself adding a section here, you want
   act mode instead: the moment a real block scrolls past the fixed stage, the
   page has a seam again and the whole point is gone.                        */

[data-sc-mode="worldflight"] { position: relative; }

.sc-world {
  position: fixed; inset: 0;
  overflow: clip;
  z-index: var(--sc-z-stage);
  background: var(--sc-canvas);
}

/* Every leg is mounted for the life of the page and stacked in the same box.
   The engine owns opacity, visibility and z-index here; do not set them. */
.sc-world__seg {
  position: absolute; inset: 0;
  opacity: 0;
  will-change: opacity;
}
.sc-world__seg > :is(video, img, canvas) {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
}
/* The poster is the frame-holder AND the first camera move: the engine pushes
   it in slowly until a real decoded frame is available to replace it. */
.sc-world__poster {
  z-index: 0;
  transform-origin: 50% 50%;
  transition: opacity 420ms var(--sc-ease-out);
}
.sc-world__seg > video { z-index: 1; }
.sc-world__seg.sc-has-clip .sc-world__poster { opacity: 0; }
/* The act stylesheet lights a clip through its ancestor act. A worldflight leg
   has no act, so match the class the engine also writes on the clip itself. */
video[data-sc-scrub].sc-has-clip { opacity: 1; }

/* The copy layer is fixed too, and inert by default: the engine hands
   pointer-events back to a block only while it is actually legible. */
.sc-world__copy {
  position: fixed; inset: 0;
  z-index: var(--sc-z-copy);
  pointer-events: none;
}
.sc-world__scrim { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
[data-sc-copy] {
  opacity: 0;
  pointer-events: none;
  will-change: opacity, transform;
}
.sc-ready [data-sc-copy] { transition: none; }

/* The track. Empty on purpose. */
.sc-world__spacer { pointer-events: none; }

/* scroll progress */
[data-sc-progress] {
  position: fixed; inset: 0 0 auto 0; height: 2px; z-index: var(--sc-z-chrome);
  background: var(--sc-accent); transform-origin: 0 50%; transform: scaleX(0);
  will-change: transform;
}

/* ----------------------------------------------------------- atmosphere --
   Depth is not only shadow. Grain keeps a flat dark ground from banding, and
   it is the difference between "a dark page" and "a lit room". */
.sc-grain { position: fixed; inset: 0; pointer-events: none; z-index: 3; opacity: 0.045; }
.sc-grain::before {
  content: ""; position: absolute; inset: -50%;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
}

/* -------------------------------------------------------- reduced motion -- */
@media (prefers-reduced-motion: reduce) {
  /* Fewer and gentler, not zero. Opacity still carries the reveal so the page
     is comprehensible; every position change is dropped. */
  [data-sc-in], [data-sc-stagger] > * { transform: none; transition-duration: 220ms; }
  [data-sc-parallax], [data-sc-pan], .sc-split__i { transform: none !important; }
  /* A wipe is a position change too. Show reveal content settled. */
  [data-sc-reveal] { clip-path: none !important; }
  /* A rail's transform IS its navigation, not decoration. Zeroing it the way
     parallax and kinetic type are zeroed parks the act on its first screenful
     and makes everything past the fold unreachable: a device degrading into
     missing content. Hand the travel back to the reader as an ordinary scroll
     region instead, so the same items are all still gettable without motion.
     A build that would rather re-lay the rail out as a grid can still do that;
     this is the floor, not the ceiling. */
  [data-sc-act="pan"] .sc-stage,
  [data-sc-act="pan"] [data-sc-stage] {
    overflow-x: auto; overflow-y: hidden;
    overscroll-behavior-x: contain;
    scroll-snap-type: x proximity;
  }
  [data-sc-pan] > * { scroll-snap-align: center; }
  [data-sc-spotlight]::after { display: none; }
  /* A worldflight keeps its whole story here. No clip is ever fetched, so the
     posters are the film, and they cross-dissolve through exactly the same
     seams at exactly the same scroll positions. The push-in and the copy drift
     are the only things that go. */
  .sc-world__poster, [data-sc-copy] { transform: none !important; }
}

/* --------------------------------------------------------------- mobile -- */
@media (max-width: 860px) {
  .sc-copy { inset-inline: var(--sc-gutter); max-width: none; }
  .sc-copy--trail { text-align: left; }
  .sc-stage { height: 100svh; }
  /* .sc-copy--trail re-anchors to the left and spans the full width here, so a
     bottom-RIGHT corner gradient darkens the one corner the copy just left and
     guarantees a contrast failure over any bright clip. Point the density at
     the copy: the same band .sc-scrim--band paints. */
  .sc-scrim--trail {
    background: linear-gradient(to top,
      color-mix(in oklab, var(--sc-canvas) 94%, transparent) 0%,
      color-mix(in oklab, var(--sc-canvas) 74%, transparent) 22%,
      color-mix(in oklab, var(--sc-canvas) 30%, transparent) 42%,
      transparent 58%);
  }
}


/* ===== גופנים: FbJabutinski לעברית ולספרות, Poppins ללטינית ולמספרים גדולים ===== */






/* ===== המותג: צהוב, שחור, לבן, אפור בהיר ===== */
:root{
  --sc-canvas:#FFFFFF;
  --sc-surface:#F2F1EE;
  --sc-ink:#1B1A17;
  --sc-ink-soft:#6E6A62;
  --sc-accent:#F5B424;
  --sc-accent-ink:#1B1A17;
  --sc-font-display:FbJabutinski, Poppins, system-ui, sans-serif;
  --sc-font-text:FbJabutinski, Poppins, system-ui, sans-serif;
  --sc-track-tight:0;
  --sc-track-snug:0;
  --sc-track-normal:0;
  --y:#F5B424;
  --k:#1B1A17;
  --w:#FFFFFF;
  --g:#F2F1EE;
  --soft:#6E6A62;
  --soft-dark:#B8B2A6;
  --ink-dark:#F7F4EF;
  --lift:0 2px 4px rgba(27,26,23,.06),0 18px 40px -18px rgba(27,26,23,.28);
  --pad:clamp(1.25rem,5vw,4.5rem);
  --ease:cubic-bezier(.2,.7,.2,1);
}
html{scroll-behavior:smooth}
body{font-family:FbJabutinski, Poppins, system-ui, sans-serif;font-weight:400;background:#FFFFFF;color:#1B1A17;overflow-x:clip}
img{max-width:100%}
.num{font-family:Poppins, system-ui, sans-serif;font-weight:800;font-feature-settings:"tnum" 1}
h1,h2,h3{font-weight:900;margin:0;line-height:1.1}
p{margin:0}
.wrap{width:100%;max-width:76rem;margin-inline:auto;padding-inline:var(--pad);box-sizing:border-box}
.stack{display:grid}
.stack > *{grid-area:1/1}
.eyebrow{font-weight:700;font-size:1rem;color:#8A6B14;margin-block-end:1rem}
.sec--dark .eyebrow{color:var(--y)}
.hl{background:linear-gradient(180deg,transparent 58%, #F5B424 58%);padding-inline:.06em;border-radius:3px}

/* קרקעות */
.sec--light{background:#FFFFFF;color:#1B1A17}
.sec--paper{background:#F2F1EE;color:#1B1A17}
.sec--dark{background:#1B1A17;color:#F7F4EF;--sc-ink:#F7F4EF;--sc-ink-soft:#B8B2A6}
.sec--yellow{background:#F5B424;color:#1B1A17}
.stage{overflow:hidden}
.sec--light .stage{background:#FFFFFF}
.sec--paper .stage{background:#F2F1EE}
.sec--dark .stage{background:#1B1A17}

/* ===== פס עליון ===== */
.topbar{
  position:fixed;inset-block-start:0;inset-inline:0;z-index:60;
  height:calc(56px + env(safe-area-inset-top,0px));
  padding-block-start:env(safe-area-inset-top,0px);
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding-inline:clamp(1rem,4vw,2.5rem);
  background:color-mix(in oklab, #FFFFFF 88%, transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 8px 26px -18px rgba(27,26,23,.55);
  box-sizing:border-box;
}
.topbar__brand{display:flex;align-items:center;gap:.7rem}
.topbar__brand img{height:26px;width:auto}
.topbar__doc{font-weight:700;font-size:.85rem;color:#6E6A62}
.mg{display:flex;align-items:center;gap:.7rem;background:#F2F1EE;border:0;border-radius:999px;padding:.4rem .5rem .4rem 1rem;cursor:pointer;font:inherit;color:#1B1A17}
.mg__name{font-weight:700;font-size:.9rem;min-width:6.5em;text-align:start}
.mg__grid{display:grid;grid-template-columns:repeat(3,8px);gap:2px;padding:4px;background:#FFFFFF;border-radius:8px}
.mg__grid i{width:8px;height:8px;border-radius:2px;background:#E9E4DA;transition:background .3s var(--ease)}
.mg__grid i.is-past{background:#1B1A17}
.mg__grid i.is-now{background:#F5B424}
.menu{position:fixed;z-index:61;inset-block-start:calc(64px + env(safe-area-inset-top,0px));inset-inline-end:clamp(1rem,4vw,2.5rem);
  background:#FFFFFF;border-radius:24px;box-shadow:var(--lift);padding:.6rem;width:min(18rem,calc(100vw - 2rem));box-sizing:border-box}
.menu a{display:flex;align-items:center;gap:.8rem;padding:.65rem .8rem;border-radius:14px;color:#1B1A17;text-decoration:none;font-weight:700;font-size:.98rem}
.menu a:hover,.menu a:focus-visible{background:#F2F1EE}
.menu a i{display:inline-block;width:12px;height:12px;border-radius:3px;background:#E9E4DA}
.menu a.is-past i{background:#1B1A17}
.menu a.is-now i{background:#F5B424}
@media(max-width:640px){.topbar__doc{display:none}.mg__name{font-size:.82rem;min-width:0}}
span[data-sc-progress]{background:#F5B424;height:3px;transform-origin:100% 50%;z-index:62}

/* ===== 1 · פתיחה: תשע קוביות בעומק ===== */
.hero{perspective:1500px;display:flex;align-items:center}
.hero__copy{position:relative;z-index:5;width:100%;box-sizing:border-box;padding-inline:var(--pad);padding-block:calc(56px + 2rem) 2rem}
.hero__copy-in{max-width:min(40rem,48vw);will-change:transform,opacity}
.hero__kicker{display:inline-flex;align-items:center;gap:.55rem;font-weight:700;font-size:clamp(1rem,1.5vw,1.25rem);color:#8A6B14;margin-block-end:1.1rem}
.hero__kicker i{width:.75em;height:.75em;background:#F5B424;border-radius:4px;display:inline-block}
.hero h1{font-size:clamp(2.5rem,5.6vw,5.2rem);line-height:1.02}
.hero__for{display:flex;align-items:center;gap:.9rem;margin-block-start:1.3rem;font-weight:700;font-size:clamp(1.1rem,1.9vw,1.6rem);color:#44413B;line-height:1.2}
.hero__for img{height:clamp(30px,3.2vw,44px);width:auto;background:#FFFFFF;border-radius:10px;padding:6px 8px;box-shadow:var(--lift)}
.hero__lead{margin-block-start:1.5rem;font-size:clamp(1.05rem,1.35vw,1.2rem);line-height:1.6;color:#44413B;max-width:44ch;text-wrap:pretty}
.hero__note{margin-block-start:.8rem;font-size:.95rem;line-height:1.55;color:#6E6A62;max-width:46ch}
.hero__grid{position:absolute;left:50%;top:50%;z-index:3;width:min(32vw,430px);aspect-ratio:1;
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:7%;
  transform-style:preserve-3d;will-change:transform;
  transform:translate(-50%,-50%) translate(-20vw,0) rotateX(12deg) rotateY(-20deg)}
.tp{transform-style:preserve-3d;will-change:transform,opacity;position:relative}
.tile{position:absolute;inset:0;border-radius:20%;box-shadow:0 2px 4px rgba(27,26,23,.08),0 22px 34px -16px rgba(27,26,23,.4);
  animation:tileIn 1s cubic-bezier(.16,1.12,.3,1) backwards;animation-delay:calc(var(--i) * 70ms + 120ms)}
.t--y{background:#F5B424}.t--k{background:#1B1A17}.t--w{background:#FFFFFF}.t--g{background:#F2F1EE}
@keyframes tileIn{from{opacity:0;transform:translate3d(var(--sx),var(--sy),0) rotate(var(--sr)) scale(.55)}to{opacity:1;transform:none}}
.hero__ghost{position:absolute;z-index:1;left:12%;top:16%;width:min(38vw,520px);aspect-ratio:1;border-radius:18%;background:#F2F1EE;will-change:transform,opacity;transform:rotate(-8deg)}
.hero__fg{position:absolute;z-index:6;border-radius:22%;will-change:transform,opacity;box-shadow:0 26px 40px -18px rgba(27,26,23,.45)}
.hero__fg--a{width:clamp(44px,5vw,78px);aspect-ratio:1;background:#F5B424;left:41%;top:72%}
.hero__fg--b{width:clamp(28px,3vw,46px);aspect-ratio:1;background:#1B1A17;left:6%;top:24%}
@media(max-height:700px) and (max-width:820px){.hero__fg{display:none}.hero__lead{font-size:.95rem;line-height:1.5}.hero__note{font-size:.82rem}.hero h1{font-size:2rem}}
@media(max-width:820px){
  .hero{align-items:flex-start}
  .hero__copy{padding-block:calc(56px + 1.4rem) 0}
  .hero__copy-in{max-width:none}
  .hero h1{font-size:clamp(2.1rem,9.4vw,3.2rem)}
  .hero__lead{font-size:1rem;margin-block-start:1rem}
  .hero__note{font-size:.88rem}
  .hero__grid{width:min(54vw,26vh,300px)}
  .hero__ghost{left:auto;right:-14vw;top:auto;bottom:-8vh;width:62vw}
  .hero__fg--a{left:8%;top:auto;bottom:9vh}
  .hero__fg--b{left:auto;right:10%;bottom:30vh;top:auto}
}

/* ===== 2 · הפער: שני מסלולים ===== */
.gap{display:flex;align-items:center}
.gap__in{display:flex;flex-direction:column;gap:clamp(2.4rem,7vh,4.5rem);padding-block:calc(56px + 1rem) 1rem}
.gap__h{font-size:clamp(1.9rem,4.4vw,3.6rem);line-height:1.12;max-width:22ch}
.gap__b p{margin-block-start:1rem;color:#B8B2A6;font-size:clamp(1.05rem,1.5vw,1.25rem);line-height:1.6;max-width:50ch}
.gap__b{opacity:0}
.tracks{position:relative;display:flex;flex-direction:column;gap:clamp(2rem,5vh,3rem)}
.track__label{font-weight:700;font-size:clamp(1rem,1.4vw,1.15rem);color:#F7F4EF;margin-block-end:.9rem}
.track--b .track__label{color:#B8B2A6}
.rail{position:relative;height:6px;border-radius:999px;background:#3A372F}
.rail__fill{position:absolute;inset:0;border-radius:999px;background:#F5B424;transform-origin:100% 50%;transform:scaleX(0);will-change:transform}
.rail__dot{position:absolute;top:50%;inset-inline-start:calc(var(--at) * 100%);width:14px;height:14px;margin-block-start:-7px;margin-inline-start:-7px;border-radius:50%;background:#3A372F;transition:background .3s var(--ease),transform .3s var(--ease)}
.rail__dot.is-on{background:#F5B424;transform:scale(1.25)}
.mk{position:absolute;top:50%;inset-inline-start:0;width:30px;height:30px;margin-block-start:-15px;margin-inline-start:-15px;border-radius:8px;background:#F5B424;box-shadow:0 10px 24px -8px rgba(0,0,0,.6);will-change:transform;z-index:2}
.mk--b{background:#B8B2A6;inset-inline-start:4%}
.miles{list-style:none;margin:0;padding:0;position:relative;height:3.4rem}
.miles li{position:absolute;top:1.1rem;inset-inline-start:calc(var(--at) * 100%);transform:translateX(50%);width:max-content;max-width:30%;text-align:center;font-weight:700;font-size:clamp(.85rem,1.3vw,1.05rem);line-height:1.3;color:#8F8A80;transition:color .3s var(--ease)}
.miles li.is-on{color:#F7F4EF}
.track__note{margin-block-start:1.2rem;font-weight:700;font-size:clamp(.9rem,1.3vw,1.05rem);color:#B8B2A6}
.band{position:absolute;inset-inline-start:4%;width:86%;background:rgba(245,180,36,.13);border-radius:16px;transform-origin:100% 50%;transform:scaleX(0);opacity:0;z-index:0;pointer-events:none;will-change:transform,opacity}
.band span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:900;color:#F5B424;font-size:clamp(1.1rem,2vw,1.6rem)}
.track{position:relative;z-index:1}
@media(max-width:640px){.miles{height:4.2rem}.miles li{max-width:32%}}

/* ===== 3 · הבחירה: המתג (השיא) ===== */
.choice{display:flex;align-items:center;justify-content:center}
.choice__in{width:100%;max-width:62rem;box-sizing:border-box;padding-inline:var(--pad);padding-block:calc(56px + 1rem) 1rem;display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(1.6rem,4.4vh,2.8rem)}
.choice__h{font-size:clamp(2rem,4.8vw,3.9rem);line-height:1.08;will-change:transform,opacity}
.choice__h--b{opacity:0}
.tg{position:relative;display:grid;grid-template-columns:1fr 1fr;width:min(56rem,100%);background:#FFFFFF;border-radius:999px;padding:8px;box-sizing:border-box;box-shadow:var(--lift);will-change:transform,opacity}
.tg__knob{position:absolute;inset:8px;border-radius:999px;background:#F5B424;z-index:1;clip-path:inset(0 0 0 50% round 999px);will-change:clip-path}
.tg__opt{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;min-height:clamp(4.2rem,9vh,5.6rem);padding:.8rem 2.6rem;font-weight:900;font-size:clamp(1.05rem,1.9vw,1.6rem);line-height:1.2;color:#77736B;transition:color .25s var(--ease)}
.tg[data-on="r"] .tg__opt--r,.tg[data-on="l"] .tg__opt--l,.tg[data-on="both"] .tg__opt{color:#1B1A17}
.tg__seam{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);width:3.4rem;height:3.4rem}
.tg__seam b{position:absolute;inset:0;display:grid;place-items:center;border-radius:999px;background:#1B1A17;color:#F5B424;font-weight:900;font-size:1.15rem;will-change:transform,opacity}
.tg__and{opacity:0;color:#FFFFFF}
.choice__caps{width:100%;max-width:46rem}
.cap{font-size:clamp(1.05rem,1.6vw,1.3rem);line-height:1.6;color:#6E6A62;opacity:0;will-change:opacity}
.choice__stamp{font-weight:900;font-size:clamp(2.2rem,6.4vw,5.4rem);line-height:1.02;opacity:0;will-change:transform,opacity}
@media(max-width:640px){
  .tg{grid-template-columns:1fr;grid-template-rows:1fr 1fr;row-gap:2.6rem;border-radius:32px}
  .tg__knob{border-radius:26px;clip-path:inset(0 0 50% 0 round 26px)}
  .tg__opt{min-height:4.4rem;padding:.8rem 1.2rem;font-size:1.12rem}
  .tg__seam{width:3rem;height:3rem}
}
@media(max-height:700px) and (max-width:640px){
  .choice__h{font-size:1.75rem}.tg__opt{min-height:3.6rem}.choice__stamp{font-size:2.1rem}.choice__in{gap:1.2rem}
}

/* ===== 4 · מה שרק אצלכם (צהוב) ===== */
.ours{padding-block:clamp(5rem,12vw,9rem) clamp(4rem,9vw,7rem);overflow:hidden}
.ours__label{font-weight:700;font-size:1.05rem;margin-block-end:1.2rem}
.verbs{display:flex;flex-direction:column;gap:.1em;font-weight:900;font-size:clamp(3.6rem,13vw,11rem);line-height:.98}
.verbs span{display:block;will-change:transform,opacity}
.ours__slogan{margin-block-start:1.4rem;font-weight:900;font-size:clamp(1.6rem,3.6vw,3rem);will-change:opacity}
.ours__note{margin-block-start:.7rem;font-size:clamp(1rem,1.4vw,1.15rem);line-height:1.6;color:#44413B;max-width:52ch}
.schools{margin-block-start:clamp(4.5rem,10vw,8rem)}
.schools h3{font-size:clamp(1.8rem,3.6vw,3rem)}
.schools__row{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(.6rem,1.4vw,1.2rem);margin-block:2.2rem 2.4rem}
.school{background:#FFFFFF;border-radius:24px;padding:1.3rem 1.2rem;min-height:10.5rem;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;gap:1rem;box-shadow:0 18px 36px -24px rgba(27,26,23,.5);will-change:transform,opacity}
.school b{font-weight:900;font-size:1.15rem}
.school span{font-weight:700;font-size:.95rem;line-height:1.35;color:#44413B}
.school--us{background:#1B1A17;color:#FFFFFF}
.school--us b{color:#F5B424;font-size:1.5rem}
.school--us span{color:#F7F4EF;font-size:1.02rem}
.schools p{max-width:62ch;font-size:clamp(1.02rem,1.4vw,1.18rem);line-height:1.65;color:#1B1A17}
@media(max-width:760px){
  .schools__row{grid-template-columns:1fr;gap:.5rem}
  .school{min-height:0;flex-direction:row;align-items:center;padding:1rem 1.2rem;border-radius:18px}
  .school span{text-align:end}
}

/* ===== 5 · ההוכחות ===== */
.proof{padding-block:clamp(5rem,10vw,8rem)}
.proof h2{font-size:clamp(2rem,4.6vw,3.6rem);max-width:20ch}
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(.7rem,1.4vw,1.1rem);margin-block-start:2.6rem}
.bx{background:#F2F1EE;border-radius:24px;padding:clamp(1.2rem,2.2vw,1.8rem);display:flex;flex-direction:column;gap:.6rem;min-height:9rem;box-sizing:border-box}
.bx b{font-weight:900;font-size:clamp(1.15rem,1.8vw,1.45rem);line-height:1.25}
.bx span{font-size:.98rem;line-height:1.55;color:#6E6A62}
.bx--big{grid-column:span 2;grid-row:span 2;background:#1B1A17;color:#FFFFFF;justify-content:flex-end}
.bx--big b{font-size:clamp(2.2rem,4.4vw,3.8rem);line-height:1.02}
.bx--big span{color:#B8B2A6;font-size:1.1rem}
.bx--five{justify-content:space-between}
.five{display:flex;align-items:flex-end;gap:.5rem;line-height:.8}
.five .num{font-size:clamp(3.6rem,6.4vw,5.6rem);line-height:.8;display:inline-block}
.bx--wide{grid-column:span 2}
.bx--exit{grid-column:1/-1;background:#FFFFFF;box-shadow:var(--lift);flex-direction:row;align-items:center;gap:clamp(1rem,3vw,3rem)}
.bx--exit b{font-size:clamp(1.4rem,2.4vw,2rem);flex:0 0 auto;max-width:12ch}
.bx--exit span{font-size:clamp(1.02rem,1.4vw,1.2rem);color:#44413B}
@media(max-width:900px){.bento{grid-template-columns:1fr 1fr}.bx--big{grid-column:1/-1;grid-row:auto;min-height:12rem}.bx--wide{grid-column:1/-1}}
@media(max-width:560px){.bx--exit{flex-direction:column;align-items:flex-start}.bx{min-height:0}}
.sieve{margin-block-start:clamp(4rem,9vw,6.5rem)}
.sieve h3{font-size:clamp(1.7rem,3.4vw,2.8rem)}
.sieve__cols{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:clamp(1rem,4vw,4rem);margin-block:2rem 1.8rem}
.sieve__col h4{margin:0 0 1rem;font-weight:900;font-size:clamp(1.05rem,1.6vw,1.3rem)}
.sieve__col--no h4{color:#6E6A62}
.sieve__chips{display:flex;flex-direction:column;align-items:flex-start;gap:.6rem}
.chip-s{display:inline-block;border-radius:999px;padding:.7em 1.2em;font-weight:700;font-size:clamp(.95rem,1.4vw,1.12rem);line-height:1.25;background:#1B1A17;color:#FFFFFF;will-change:transform,opacity}
.sieve__col--no .chip-s{background:#F2F1EE;color:#44413B}
.sieve p{max-width:62ch;color:#44413B;line-height:1.65;font-size:clamp(1rem,1.3vw,1.12rem)}
@media(max-width:620px){.sieve__cols{grid-template-columns:1fr}}

/* ===== 6 · המשפטים שלכם ===== */
.words{display:flex;align-items:center}
.words__in{padding-block:calc(56px + 1rem) 1rem}
.words__kicker{font-weight:700;color:#F5B424;font-size:clamp(1rem,1.4vw,1.15rem);margin-block-end:clamp(1.2rem,3vh,2rem)}
.qt{margin:0;will-change:opacity}
.qt figcaption{font-weight:700;color:#B8B2A6;font-size:clamp(1rem,1.5vw,1.25rem);margin-block-end:1rem}
.qt blockquote{margin:0;font-weight:900;font-size:clamp(1.9rem,4.3vw,3.7rem);line-height:1.18;max-width:24ch}
.qt blockquote::before{content:"״";color:#F5B424;margin-inline-end:.08em}
.qt blockquote::after{content:"״";color:#F5B424;margin-inline-start:.04em}
.w{color:#8F8A80;transition:color .18s linear}
.w.is-on{color:#F7F4EF}
.qt__note{margin-block-start:1.4rem;color:#B8B2A6;font-size:clamp(1rem,1.4vw,1.15rem);line-height:1.6;max-width:56ch;opacity:0;will-change:opacity}
.qt--2{opacity:0}
@media(max-width:640px){.qt blockquote{font-size:clamp(1.55rem,7vw,2.2rem)}}
@media(max-height:700px) and (max-width:640px){.qt blockquote{font-size:1.45rem}.qt__note{font-size:.92rem;margin-block-start:.9rem}}

/* שאלות של הורים */
.qa{padding-block:clamp(3rem,7vw,5.5rem) clamp(5rem,10vw,8rem)}
.qa h3{font-size:clamp(1.7rem,3.2vw,2.6rem)}
.qa__intro{margin-block-start:.8rem;color:#B8B2A6;line-height:1.6;max-width:60ch}
.qa__list{margin-block-start:2rem;display:flex;flex-direction:column;gap:.8rem;max-width:56rem}
.qa details{background:#242219;border-radius:24px;padding:0;overflow:hidden}
.qa summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.3rem 1.5rem;font-weight:900;font-size:clamp(1.1rem,1.7vw,1.35rem)}
.qa summary::-webkit-details-marker{display:none}
.qa summary i{flex:0 0 auto;width:2.2rem;height:2.2rem;border-radius:999px;background:#F5B424;color:#1B1A17;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:1.3rem;transition:transform .3s var(--ease)}
.qa details[open] summary i{transform:rotate(45deg)}
.qa details p{padding:0 1.5rem 1.5rem;color:#E9E4DA;line-height:1.7;max-width:66ch}

/* ===== 7 · התוצרים: קיר שנבנה מלמטה ===== */
.wall{display:flex;align-items:center}
.wall__in{padding-block:calc(56px + .8rem) .8rem;display:flex;flex-direction:column;gap:clamp(1.2rem,3.4vh,2.2rem)}
.wall__head h2{font-size:clamp(1.6rem,3.4vw,2.8rem);max-width:28ch;line-height:1.12}
.wall__head .eyebrow{margin-block-end:.6rem}
.wall__stats{margin-block-start:.8rem;display:flex;gap:1.4rem;align-items:baseline;font-weight:700;color:#6E6A62}
.wall__stats b{font-size:clamp(1.6rem,2.6vw,2.2rem);color:#1B1A17;margin-inline-end:.3rem}
.rows{display:flex;flex-direction:column;gap:clamp(.5rem,1.2vh,.8rem)}
.row{display:grid;grid-template-columns:clamp(10rem,17vw,14rem) 1fr;gap:1rem;align-items:center}
.row__label{will-change:opacity}
.row__label b{display:block;font-weight:900;font-size:clamp(1rem,1.5vw,1.2rem)}
.row__label span{display:block;font-weight:700;font-size:.88rem;color:#6E6A62;margin-block-start:.2rem}
.bricks{display:grid;grid-template-columns:repeat(7,1fr);gap:clamp(.35rem,.7vw,.55rem)}
.brick{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:.25rem;min-height:clamp(3.8rem,9vh,5.2rem);padding:.6rem .7rem;box-sizing:border-box;border-radius:14px;text-decoration:none;font-weight:700;font-size:clamp(.78rem,1.05vw,.98rem);line-height:1.2;will-change:transform,opacity;transition:filter .2s var(--ease)}
.brick:hover{filter:brightness(1.08)}
.brick .num{font-size:.8rem;font-weight:600;opacity:.75}
.brick--1{background:#1B1A17;color:#FFFFFF}
.brick--2{background:#FFFFFF;color:#1B1A17;box-shadow:0 2px 3px rgba(27,26,23,.08),0 12px 22px -12px rgba(27,26,23,.35)}
.brick--3{background:#F2F1EE;color:#1B1A17}
.brick--first{background:#F5B424;color:#1B1A17}
.brick__tag{position:absolute;top:-.55rem;inset-inline-start:.5rem;background:#1B1A17;color:#FFFFFF;border-radius:999px;font-size:.66rem;font-weight:900;padding:.15em .55em}
.wall__foot{font-weight:700;color:#6E6A62;font-size:clamp(.95rem,1.3vw,1.1rem);will-change:opacity}
@media(max-width:820px){
  .row{grid-template-columns:1fr;gap:.45rem}

}

/* פירוט התוצרים */
.details{padding-block:clamp(3.5rem,8vw,6rem) clamp(5rem,10vw,8rem)}
.phase{display:grid;grid-template-columns:minmax(14rem,.8fr) 1.6fr;gap:clamp(1.5rem,4vw,4rem);padding-block:clamp(2rem,4vw,3rem)}
.phase + .phase{margin-block-start:.5rem}
.phase__side{align-self:start;position:sticky;top:calc(56px + 1.5rem)}
.phase__n{display:inline-grid;place-items:center;width:3rem;height:3rem;border-radius:12px;background:#1B1A17;color:#F5B424;font-size:1.4rem}
.phase--2 .phase__n{background:#F5B424;color:#1B1A17}
.phase--3 .phase__n{background:#F2F1EE;color:#1B1A17}
.phase__t{margin-block-start:1rem;font-size:clamp(1.5rem,2.6vw,2.2rem)}
.phase__when{margin-block-start:.5rem;font-weight:700;color:#8A6B14}
.phase__why{margin-block-start:1rem;color:#6E6A62;line-height:1.62}
.dl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.6rem}
.dl li{display:grid;grid-template-columns:2.6rem 1fr;gap:.8rem;padding:1.1rem 1.3rem;background:#F2F1EE;border-radius:20px;scroll-margin-top:calc(56px + 1.5rem)}
.dl li:target{background:#FFFFFF;box-shadow:var(--lift)}
.dl .num{font-size:1.2rem;color:#1B1A17;line-height:1.4}
.dl b{display:block;font-weight:900;font-size:1.12rem;line-height:1.35}
.dl span{display:block;color:#6E6A62;line-height:1.55;margin-block-start:.25rem}
.dl .tag{display:inline-block;background:#F5B424;color:#1B1A17;font-weight:900;font-size:.7rem;padding:.12em .55em;border-radius:999px;margin-inline-start:.4rem;vertical-align:middle}
@media(max-width:820px){.phase{grid-template-columns:1fr;gap:1.2rem}.phase__side{position:static}}

/* ===== 8 · החשיפה: גל מבית הספר אל העיר ===== */
.ripple{display:flex;align-items:center}
.ripple__viz{position:absolute;inset:0;z-index:1;pointer-events:none}
.orb,.core{position:absolute;left:var(--cx);top:var(--cy);border-radius:50%;transform:translate(-50%,-50%) scale(0);will-change:transform,opacity}
.ripple__viz{--cx:31%;--cy:54%;--r2:min(74vmin,620px);--r1:min(36vmin,300px)}
.orb--2{width:var(--r2);height:var(--r2);background:#242219}
.orb--1{width:var(--r1);height:var(--r1);background:#2E2B24;box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.orb__lab{position:absolute;left:50%;top:9%;transform:translateX(-50%);white-space:nowrap;font-weight:700;font-size:clamp(.85rem,1.2vw,1rem);color:#B8B2A6}
.orb--1 .orb__lab{top:12%}
.core{width:min(12vmin,104px);height:min(12vmin,104px);border-radius:24%;background:#F5B424;color:#1B1A17;display:grid;place-items:center;text-align:center;font-weight:900;font-size:clamp(.8rem,1.2vw,1rem);line-height:1.1;transform:translate(-50%,-50%);box-shadow:0 18px 40px -14px rgba(245,180,36,.45)}
.chip{position:absolute;left:var(--cx);top:var(--cy);white-space:nowrap;background:#F7F4EF;color:#1B1A17;border-radius:999px;padding:.55em 1em;font-weight:700;font-size:clamp(.8rem,1.15vw,1rem);opacity:0;will-change:transform,opacity}
.ripple__copy{position:relative;z-index:3;display:flex;justify-content:flex-start}
.ripple__text{width:min(32rem,40vw)}
.rc h2{font-size:clamp(1.8rem,3.6vw,3rem);line-height:1.12}
.rc p{margin-block-start:1rem;color:#B8B2A6;line-height:1.6;font-size:clamp(1rem,1.4vw,1.18rem)}
.rc--b{opacity:0}
@media(max-width:820px){
  .ripple{align-items:flex-start}
  .ripple__viz{--cx:50%;--cy:66%;--r2:min(100vw,52vh);--r1:min(50vw,26vh)}
  .ripple__copy{padding-block-start:calc(56px + 1.4rem)}
  .ripple__text{width:100%}
  .rc h2{font-size:clamp(1.5rem,6.6vw,2.1rem)}
  .core{width:min(18vw,74px);height:min(18vw,74px);font-size:.72rem}
  .chip{font-size:.76rem}
}

/* ערוצים */
.chan{padding-block:clamp(2rem,5vw,4rem) clamp(3rem,7vw,5rem)}
.chan h2{font-size:clamp(1.8rem,3.8vw,3rem);max-width:24ch}
.chan__list{position:relative;list-style:none;margin:2.6rem 0 0;padding:0;padding-inline-start:2.6rem;display:flex;flex-direction:column;gap:1rem;max-width:58rem}
.chan__rail{position:absolute;inset-inline-start:.55rem;top:.6rem;bottom:.6rem;width:4px;border-radius:999px;background:#3A372F}
.chan__rail i{position:absolute;inset:0;border-radius:999px;background:#F5B424;transform-origin:50% 0;transform:scaleY(0);will-change:transform}
.chan__item{position:relative;background:#242219;border-radius:24px;padding:clamp(1.3rem,2.4vw,1.9rem)}
.chan__item::before{content:"";position:absolute;inset-inline-start:-2.42rem;top:1.7rem;width:14px;height:14px;border-radius:4px;background:#F5B424}
.chan__when{font-weight:900;color:#F5B424;font-size:.95rem;margin-block-end:.5rem}
.chan__item h3{font-size:clamp(1.25rem,2vw,1.6rem);margin-block-end:.6rem}
.chan__item p{color:#B8B2A6;line-height:1.65}
.chan__item ul{margin:.4rem 0 0;padding-inline-start:1.1rem;color:#B8B2A6;line-height:1.75}

/* משפך */
.funnel{padding-block:clamp(2rem,5vw,3.5rem) clamp(5rem,10vw,8rem);display:flex;flex-direction:column;align-items:center;text-align:center}
.funnel__chans{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;max-width:46rem}
.funnel__chans span{background:#242219;color:#F7F4EF;border-radius:999px;padding:.55em 1.1em;font-weight:700;font-size:.95rem;will-change:transform,opacity}
.funnel__bar{width:4px;height:4.5rem;border-radius:999px;background:#F5B424;margin:1rem 0;transform-origin:50% 0;transform:scaleY(0);will-change:transform}
.funnel__point{background:#F5B424;color:#1B1A17;font-weight:900;border-radius:24px;padding:1.1rem 2rem;font-size:clamp(1.4rem,3vw,2.1rem);will-change:transform,opacity}
.funnel__point small{display:block;font-weight:700;font-size:.5em;color:#4A3A0E;margin-block-start:.35rem}

/* ===== 9 · מתחילים ===== */
.close{padding-block:clamp(5rem,10vw,8rem) clamp(3rem,6vw,4.5rem)}
.tl{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem;margin-block-end:clamp(3rem,7vw,5rem)}
.tl__rail{position:absolute;inset-inline:4%;top:1.05rem;height:4px;border-radius:999px;background:#E9E4DA}
.tl__rail i{position:absolute;inset:0;border-radius:999px;background:#1B1A17;transform-origin:100% 50%;transform:scaleX(0);will-change:transform}
.tl__stop{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.6rem}
.tl__stop i{width:2.3rem;height:2.3rem;border-radius:10px;background:#E9E4DA;transition:background .3s var(--ease),transform .3s var(--ease)}
.tl__stop.is-on i{background:#1B1A17}
.tl__stop--day.is-on i{background:#F5B424;transform:scale(1.25)}
.tl__stop b{font-weight:900;font-size:clamp(.95rem,1.4vw,1.15rem)}

  .tl__stop{flex-direction:row;text-align:start;gap:.9rem}

}

.close__p{margin-block-start:1.3rem;color:#44413B;max-width:56ch;line-height:1.65;font-size:clamp(1.05rem,1.4vw,1.2rem)}

.need li{display:flex;align-items:center;gap:.7rem;background:#F2F1EE;border-radius:16px;padding:.85rem 1rem;font-weight:700;font-size:.98rem;line-height:1.3}
.need li::before{content:"";flex:0 0 auto;width:12px;height:12px;border-radius:3px;background:#1B1A17}

.need--open li::before{background:#F5B424}
@media(max-width:820px){.close__lists{grid-template-columns:1fr}.need{grid-template-columns:1fr}}
.next{margin-block-start:clamp(2.5rem,6vw,4rem);display:flex;align-items:center;gap:clamp(1.2rem,3vw,2.4rem);background:#1B1A17;color:#FFFFFF;border-radius:24px;padding:clamp(1.5rem,3.4vw,2.6rem)}
.next__grid{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:clamp(56px,7vw,84px)}

.next__grid i:nth-child(5){background:#F5B424}
.next small{display:block;font-weight:700;color:#F5B424;font-size:.95rem;margin-block-end:.4rem}
.next p{font-weight:900;font-size:clamp(1.25rem,2.4vw,2rem);line-height:1.25}
.close__foot{margin-block-start:2.4rem;display:flex;align-items:center;gap:.8rem;color:#6E6A62;font-weight:700;font-size:.88rem}
.close__foot img{height:22px;width:auto}
@media(max-width:560px){.next{flex-direction:column;align-items:flex-start}}

   scrollcraft: a scroll-driven interaction runtime
   ----------------------------------------------------------------------------
   Vanilla JS. Zero dependencies. Zero DOM generation.

   The engine does NOT build your page. You author real, semantic HTML and mark
   it up with data-sc-* attributes; the engine reads them and drives them from a
   single scroll value on a single rAF loop. That is deliberate: a runtime that
   generates its own DOM from a config object makes every site it touches look
   identical, which is the failure mode this replaces.

   ---------------------------------------------------------------------------
   ACTS: the unit of scroll time
   ---------------------------------------------------------------------------
     <section data-sc-act="pin" data-sc-span="2.5"> ... </section>

     data-sc-act   scrub | pin | pan | flow   (default: flow)
     data-sc-clip-map="travel" opts a pinned act OUT of full-life clip mapping.
                   By DEFAULT a scrub clip is mapped across the stage's entire
                   on-screen life, not across its pinned travel, because a pinned
                   stage is visible for a viewport BEFORE the pin begins (sliding
                   up into view) and a viewport AFTER it ends (sliding off the
                   top). Mapped to pinned travel, the clip sits on its first
                   frame through the whole entry and its last frame through the
                   whole exit: the reader watches a still photograph while the
                   page moves. Pair it with data-sc-dwell, which moves quickly at
                   the edges and settles in the middle, so the fast motion lands
                   on the two slides and the settle lands inside the pin where
                   the copy is. data-sc-runout is accepted and ignored; it named
                   the old opt-in for the exit half of this.
     data-sc-span  viewport-heights of scroll this act owns. Pinned devices only
                   (scrub/pin/pan). Default 1.5. The engine sets the outer
                   height and sticks the first .sc-stage / [data-sc-stage] child.

     Every act exposes a normalized progress p (0..1):
       pinned  p = (y - top) / (height - vh)
       flow    p = (y + vh - top) / (height + vh)
     and publishes it as --sc-p on the act element, so CSS can read it too.

   ---------------------------------------------------------------------------
   DEVICES: what p drives
   ---------------------------------------------------------------------------
     data-sc-scrub            on <video>. p scrubs currentTime. Blob-loaded, so
                              it seeks without needing HTTP range support.
     data-sc-sequence="a/{i}.webp:120:1"
                              on <canvas>. p scrubs an image sequence
                              (path template : frameCount : startIndex).
     data-sc-pan="0.6"        on a wide rail inside data-sc-act="pan". p drives
                              horizontal travel. Value = extra travel multiplier.
     data-sc-parallax="-0.2"  translateY by rate * act-progress * viewport.
                              Negative = moves up faster than scroll (recedes).
     data-sc-cue="0.1 0.5"    opacity/rise keyed to p. One value = enter+hold.
                              Two = enter..leave. Add a third for the hold point.
     data-sc-kinetic="lines"  lines | words | chars. Splits the element and
                              staggers its reveal across the cue window.
     data-sc-reveal="up"      up | down | left | right | iris. clip-path wipe.
     data-sc-count="0 4200"   number bloom across the cue window. Outside any
                              act it ticks up once on entry instead, over
                              data-sc-count-ms (default 1400).

    // ---- worldflight ------------------------------------------------------

      var t = out3(seg(p, .6 + i * .05, .72 + i * .05));
      c.style.opacity = seg(t, 0, .4);
      c.style.transform = 'translate(-50%,-50%) translate(' + (c.dataset.x * mix(.4, 1, t)) + 'px,' + (c.dataset.y * mix(.4, 1, t)) + 'px) scale(' + mix(.7, 1, t) + ')';
    });
    rcA.style.opacity = 1 - seg(p, .42, .48);
    rcB.style.opacity = seg(p, .5, .58);
    rcB.style.transform = 'translateY(' + ((1 - out3(seg(p, .5, .6))) * 2) + 'vh)';
  }, function(){ placeChips(false); });

  // ----- 8ב · הקו של הערוצים, והמשפך -----
  var chanFill = $('.chan__rail i');
  scene($('.chan__list'), 'through', function(p){ chanFill.style.transform = 'scaleY(' + p + ')'; }, null, { at: .65 });
  var fChans = $$('.funnel__chans span'), fBar = $('.funnel__bar'), fPoint = $('.funnel__point');
  scene($('#s-funnel'), 'view', function(p){
    fChans.forEach(function(c, i){
      var t = out3(seg(p, .1 + i * .05, .4 + i * .05));
      c.style.opacity = seg(t, 0, .4); c.style.transform = 'translateY(' + ((1 - t) * -1.4) + 'rem)';
    });
    fBar.style.transform = 'scaleY(' + sm(seg(p, .5, .72)) + ')';
    var t = seg(p, .7, .9);
    fPoint.style.opacity = seg(t, 0, .3); fPoint.style.transform = 'scale(' + mix(.85, 1, back(t)) + ')';
  }, null, { end: .25 });

  // ----- 9 · לוח הזמנים -----
  var tlFill = $('.tl__rail i'), stops = $$('.tl__stop');
  scene($('.tl'), 'view', function(p){
    var f = sm(seg(p, .15, .85)), vertTl = matchMedia('(max-width:700px)').matches;
    tlFill.style.transform = vertTl ? 'scaleY(' + f + ')' : 'scaleX(' + f + ')';
    stops.forEach(function(s, i){ s.classList.toggle('is-on', f >= i / (stops.length - 1) - .02); });
  }, null, { end: .35 });

  // ===== לולאה אחת =====
  var last = performance.now();
  function frame(now){
    var dt = Math.min(64, now - last); last = now;
    var k = 1 - Math.pow(1 - .2, dt / 16.67);
    var tk = 1 - Math.pow(1 - .08, dt / 16.67);
    var tiltMoved = false;
    if (fine) {
      var nx = tilt.x + (tilt.tx - tilt.x) * tk, ny = tilt.y + (tilt.ty - tilt.y) * tk;
      tiltMoved = Math.abs(nx - tilt.x) + Math.abs(ny - tilt.y) > .002;
      tilt.x = nx; tilt.y = ny;
    }
    var ts = scenes.map(target);
    scenes.forEach(function(s, i){
      var t = ts[i];
      if (s.cur < 0) s.cur = t; else { s.cur += (t - s.cur) * k; if (Math.abs(t - s.cur) < .0004) s.cur = t; }
      var force = s === heroS && tiltMoved;
      if ((s.near || s.shown === -2) && (s.cur !== s.shown || force)) { s.shown = s.cur; s.render(s.cur); }
    });
    requestAnimationFrame(frame);
  }
  function boot(){ measureAll(); requestAnimationFrame(frame); }
  var rt; addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(measureAll, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ measureAll(); });
  boot();
})();

}

(function(){
  var app=document.getElementById('app');
  function fail(){app.innerHTML='<p style="text-align:center;padding:6rem 1rem;color:#6E6A62;font-size:1.1rem">הקישור לא שלם. פתחו את הקישור המלא כפי שנשלח אליכם.</p>'}
  function b64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  var m=location.hash.match(/k=([A-Za-z0-9_-]+)/);
  if(!m||!window.crypto||!crypto.subtle){fail();return}
  var blob=b64u(document.getElementById('payload').textContent.trim());
  crypto.subtle.importKey('raw',b64u(m[1]),'AES-GCM',false,['decrypt'])
    .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:blob.slice(0,12)},k,blob.slice(12))})
    .then(function(buf){app.innerHTML=new TextDecoder().decode(buf);initPage()})
    .catch(fail);
})();
