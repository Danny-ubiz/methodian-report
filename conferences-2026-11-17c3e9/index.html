<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>תוכנית כנסים בחו"ל · דצמבר 2026 עד נובמבר 2027</title>
<meta property="og:title" content="תוכנית כנסים בחו&quot;ל, דצמבר 2026 עד נובמבר 2027">
<meta property="og:description" content="יוביז פרסום">
<style>
:root{--y:#F5B424;--k:#1B1A17;--w:#FFFFFF;--g:#F2F1EE;--a:#F99406;--soft:0 2px 6px rgba(27,26,23,.04),0 16px 40px rgba(27,26,23,.06)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--w);color:var(--k);font-family:'FbJabutinski',system-ui,sans-serif;font-size:17px;line-height:1.55;font-weight:400}
a{color:var(--k)}
.num,.en{font-family:'Poppins','FbJabutinski',sans-serif;font-weight:600}
.num{font-feature-settings:'tnum'}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
section{padding:72px 0}
h1{font-size:56px;line-height:1.1;font-weight:900}
h2{font-size:36px;line-height:1.15;font-weight:900;margin-bottom:8px}
h3{font-size:24px;line-height:1.25;font-weight:700}
.lead{font-size:19px;max-width:720px}
.cap{font-size:14px;line-height:1.4}
.top{padding:32px 0 56px}
.top .logo{height:40px;display:block;margin-bottom:56px}
.kicker{font-size:14px;font-weight:700;letter-spacing:.02em;margin-bottom:16px;display:inline-flex;align-items:center;gap:8px}
.kicker i{width:8px;height:8px;border-radius:50%;background:var(--a);display:inline-block}
.top .for{font-size:24px;font-weight:700;margin-top:8px}
.top .lead{margin-top:24px}
.hero{background:var(--y);padding:64px 0}
.hero h2{margin-bottom:24px}
.dl{display:grid;gap:8px}
.dl a{display:grid;grid-template-columns:120px 1fr auto;gap:16px;align-items:center;background:var(--w);border-radius:16px;padding:16px 24px;text-decoration:none}
.dl .until{font-size:15px;font-weight:700}
.dl .until .num{font-size:19px}
.dl .what{font-size:16px;line-height:1.4}
.dl .what b{font-weight:700}
.dl .go{font-size:14px;font-weight:700;background:var(--g);border-radius:999px;padding:8px 16px;white-space:nowrap}
.trips{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:40px}
.trip{background:var(--w);border-radius:24px;padding:32px;box-shadow:var(--soft);display:flex;flex-direction:column}
.trip .no{width:48px;height:48px;border-radius:50%;background:var(--k);color:var(--w);display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:24px}
.trip .when{font-size:15px;font-weight:700;margin-bottom:4px}
.trip h3{margin-bottom:12px}
.trip p{font-size:16px}
.trip ul{list-style:none;margin-top:16px;display:grid;gap:8px}
.trip li{font-size:15px;line-height:1.4;background:var(--g);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.trip li .ln{display:flex;gap:10px;align-items:baseline;font-weight:700}
.trip li .ln .num{font-size:14px}
.trip li .x{font-size:14px}
.tnote{margin-top:32px}
.trip .also{margin-top:auto;padding-top:16px;font-size:14px}
.grey{background:var(--g)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:32px 0 8px;position:sticky;top:0;z-index:5;background:var(--g);padding:12px 0}
.chip{font:inherit;font-size:15px;font-weight:700;border:0;background:var(--w);color:var(--k);border-radius:999px;padding:8px 18px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--k);color:var(--w)}
.month{margin-top:48px}
.month h3{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.month h3 .cnt{font-size:14px;font-weight:400}
.month.empty{display:none}
.list{display:grid;gap:12px}
.ev{background:var(--w);border-radius:24px;padding:24px;display:grid;grid-template-columns:150px 1fr auto;gap:24px;align-items:start}
.ev[hidden]{display:none}
.ev .date{font-size:17px;font-weight:700;line-height:1.35}
.ev .date .num{font-size:20px}
.ev .date .tbd{font-size:14px;font-weight:400;display:block;margin-top:4px}
.ev .nm{font-size:22px;line-height:1.25;font-weight:700}
.ev .nm .en{font-size:20px}
.ev .where{font-size:15px;margin-top:2px}
.ev .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:13px;font-weight:700;background:var(--g);border-radius:999px;padding:3px 10px}
.tag.pick{background:var(--y)}
.ev .note{font-size:16px;margin-top:12px;max-width:620px}
.ev .price{font-size:15px;margin-top:8px}
.ev .price b{font-weight:700}
.btn{display:inline-block;font-size:15px;font-weight:700;text-decoration:none;background:var(--g);color:var(--k);border-radius:999px;padding:10px 20px;white-space:nowrap}
.ev .btn{margin-top:4px}
.method{padding:56px 0}
.method p{font-size:15px;max-width:820px}
.method p+p{margin-top:12px}
footer{background:var(--k);color:var(--w);padding:40px 0}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:24px}
footer img{height:32px}
footer p{font-size:14px}
.gate{min-height:60vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
@media (max-width:900px){
 .trips{grid-template-columns:1fr}
 .ev{grid-template-columns:120px 1fr}
 .ev .btn{grid-column:2}
}
@media (max-width:640px){
 section{padding:48px 0}
 h1{font-size:38px}
 h2{font-size:28px}
 .top .for{font-size:20px}
 .lead{font-size:17px}
 .hero{padding:48px 0}
 .dl a{grid-template-columns:1fr auto;padding:14px 16px;gap:4px 12px}
 .dl .what{grid-column:1/-1;grid-row:2}
 .trip{padding:24px}
 .filters{margin-top:24px}
 .chip{font-size:14px;padding:7px 14px}
 .month{margin-top:36px}
 .ev{grid-template-columns:1fr;gap:8px;padding:20px}
 .ev .btn{grid-column:auto;justify-self:start;margin-top:8px}
 .ev .nm{font-size:20px}
 footer .wrap{flex-direction:column;align-items:flex-start}
}
</style>
</head>

window.initFilters=function(){
  var chips=document.querySelectorAll('.chip');
  function apply(f){
    chips.forEach(function(c){c.setAttribute('aria-pressed',c.dataset.f===f?'true':'false')});
    document.querySelectorAll('.month').forEach(function(m){
      var shown=0;
      m.querySelectorAll('.ev').forEach(function(ev){
        var ok=f==='all'||(' '+ev.dataset.c+' ').indexOf(' '+f+' ')>-1;
        ev.hidden=!ok; if(ok)shown++;
      });
      var has=m.querySelectorAll('.ev').length>0;
      m.classList.toggle('empty',f!=='all'&&shown===0);
      var cnt=m.querySelector('.cnt'); if(cnt&&has)cnt.innerHTML=shown===1?'כנס אחד':'<span class="num">'+shown+'</span> כנסים';
    });
  }
  chips.forEach(function(c){c.addEventListener('click',function(){apply(c.dataset.f)})});
};

(function(){
  var app=document.getElementById('app');
  function fail(){app.innerHTML='<div class="gate"><p>הקישור לא שלם.<br>פתחו את הקישור המלא כפי שנשלח.</p></div>'}
  function b64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  var m=location.hash.match(/k=([A-Za-z0-9_-]+)/);
  if(!m||!window.crypto||!crypto.subtle){fail();return}
  var blob=b64u(document.getElementById('payload').textContent.trim());
  crypto.subtle.importKey('raw',b64u(m[1]),'AES-GCM',false,['decrypt'])
    .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:blob.slice(0,12)},k,blob.slice(12))})
    .then(function(buf){app.innerHTML=new TextDecoder().decode(buf);window.initFilters()})
    .catch(fail);
})();
</script></body>
