<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F5B424">
<title>תוכנית עבודה · יוביז פרסום</title>
<meta property="og:title" content="תוכנית עבודה">
<meta property="og:description" content="יוביז פרסום">
<style>
:root{--y:#F5B424;--k:#1B1A17;--w:#FFFFFF;--g:#F2F1EE;--a:#F99406;--soft:0 2px 6px rgba(27,26,23,.04),0 16px 40px rgba(27,26,23,.06)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--w);color:var(--k);font-family:'FbJabutinski',system-ui,sans-serif;font-size:17px;line-height:1.55;font-weight:400}
.num,.en{font-family:'Poppins','FbJabutinski',sans-serif;font-weight:600}
.num{font-feature-settings:'tnum'}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
section{padding:72px 0}
h2{font-size:36px;line-height:1.15;font-weight:900;margin-bottom:8px}
h3{font-size:24px;line-height:1.25;font-weight:700}
.lead{font-size:19px;max-width:700px}
.cap{font-size:14px;line-height:1.4}
.grey{background:var(--g)}

/* פתיחה */
.top{padding:32px 0 64px}
.top .ubiz{height:40px;display:block;margin-bottom:56px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:32px}
.doc{font-weight:900}
.doc .kind{display:flex;align-items:center;gap:10px;font-size:20px;line-height:1.3;font-weight:700;margin-bottom:12px}
.doc .kind i{width:14px;height:14px;border-radius:4px;background:var(--y);display:inline-block}
.doc .what{display:block;font-size:56px;line-height:1.1}
.doc .what mark{background:linear-gradient(transparent 58%,var(--y) 58%);color:inherit;padding:0 4px}
.doc .for{display:block;font-size:26px;line-height:1.3;font-weight:700;margin-top:16px}
.client{flex:none;width:200px;padding-top:40px}
.client img{width:100%;display:block}
.top .lead{margin-top:32px}

/* השורה התחתונה */
.hero{background:var(--y);padding:64px 0}
.hero .label{font-size:17px;font-weight:700}
.hero .big{font-size:80px;line-height:1;font-weight:900;margin:16px 0 20px}
.hero .big small{font-size:32px;font-weight:700;margin-inline-start:12px}
.hero .lead{font-size:21px;max-width:760px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:40px}
.tile{background:var(--w);border-radius:24px;padding:24px}
.tile .v{font-size:36px;line-height:1.1;display:block}
.tile .t{font-size:15px;line-height:1.4;margin-top:8px;display:block}

/* למה */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:40px}
.card{background:var(--w);border-radius:24px;padding:32px;box-shadow:var(--soft)}
.card h3{margin-bottom:8px}
.card p{font-size:16px}

/* 20 השמות */
.names{background:var(--w);border-radius:24px;box-shadow:var(--soft);padding:16px;margin-top:40px}
.nm{border-radius:16px}
.nm:nth-child(even){background:var(--g)}
.nm summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:40px 220px 1fr 96px 24px;gap:16px;align-items:center;padding:14px 16px}
.nm summary::-webkit-details-marker{display:none}
.nm summary:focus-visible{outline:3px solid var(--k);outline-offset:2px;border-radius:16px}
.nm .rk{font-size:15px;opacity:.55}
.nm .who{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.nm .who .en{font-size:19px}
.nm .who .h{font-size:17px}
.nm .go{font-family:'FbJabutinski',sans-serif;font-weight:700;font-size:12px;background:var(--k);color:var(--w);border-radius:999px;padding:2px 10px;white-space:nowrap}
.nm .track{height:12px;border-radius:999px;background:transparent;position:relative}
.nm .bar{position:absolute;inset-block:0;right:0;border-radius:999px;background:var(--k);opacity:.16}
.nm.first .bar{background:var(--y);opacity:1}
.nm .v{font-size:19px;text-align:left}
.nm .chev{width:24px;height:24px;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.nm[open] .chev{transform:rotate(180deg)}
.nm .more{padding:4px 72px 24px 16px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.nm .more h4{font-size:15px;font-weight:700;margin-bottom:8px}
.nm .q{display:flex;justify-content:space-between;gap:16px;font-size:15px;padding:4px 0}
.nm .q .en{font-weight:600;font-size:14px}
.nm .q .num{font-size:14px;flex:none}
.nm .side p{font-size:15px;line-height:1.5}
.nm .side p+p{margin-top:8px}
.hint{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:15px}
.hint i{width:8px;height:8px;border-radius:50%;background:var(--a);display:inline-block}

/* מבנה העמוד */
.build{display:grid;grid-template-columns:1fr 1.05fr;gap:48px;margin-top:40px;align-items:start}
.step{display:grid;grid-template-columns:40px 1fr;gap:16px;margin-bottom:24px}
.step .no{width:40px;height:40px;border-radius:50%;background:var(--y);color:var(--k);display:flex;align-items:center;justify-content:center;font-size:17px}
.step h4{font-size:19px;font-weight:700;line-height:1.3;margin-bottom:2px}
.step p{font-size:16px}
.browser{background:var(--w);border-radius:24px;box-shadow:var(--soft);overflow:hidden;position:sticky;top:24px}
.browser .bar{background:var(--g);padding:14px 20px;display:flex;align-items:center;gap:12px}
.browser .dots{display:flex;gap:6px}
.browser .dots i{width:10px;height:10px;border-radius:50%;background:var(--k);opacity:.18}
.browser .url{flex:1;background:var(--w);border-radius:999px;padding:6px 16px;font-size:13px;direction:ltr;text-align:left}
.mock{direction:ltr;text-align:left;padding:32px;font-family:'Poppins',system-ui,sans-serif}
.mock h5{font-size:24px;line-height:1.25;font-weight:600;margin-bottom:20px}
.mock h6{font-size:16px;font-weight:600;margin:18px 0 4px}
.mock p{font-size:14px;line-height:1.6;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
.mock .he{font-family:'FbJabutinski',sans-serif;font-size:16px}
.mock .story{background:var(--g);border-radius:16px;padding:16px;font-style:italic}
.mock .ctas{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:20px}
.mock .btn{background:var(--k);color:var(--w);border-radius:999px;padding:10px 22px;font-size:14px;font-weight:600}
.mock .lnk{font-size:14px;font-weight:600;text-decoration:underline}
.mock .tag{display:inline-block;font-family:'FbJabutinski',sans-serif;direction:rtl;font-size:12px;font-weight:700;background:var(--y);border-radius:999px;padding:1px 10px;margin-left:8px;vertical-align:3px;font-style:normal}
.under{margin-top:16px;font-size:15px}

/* דגשים */
.tips{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:40px}
.tip{background:var(--g);border-radius:24px;padding:28px}
.tip h3{font-size:20px;margin-bottom:8px}
.tip p{font-size:16px}

/* מי עושה מה */
.dark{background:var(--k);color:var(--w)}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:40px}
.plan h3{margin-bottom:24px}
.dark .step .no{width:48px;height:48px;font-size:20px}
.dark .step{grid-template-columns:48px 1fr;margin-bottom:32px}
.ours .no{background:var(--w)}

.method{padding:56px 0}
.method p{font-size:15px;max-width:820px}
.method p+p{margin-top:12px}
footer{background:var(--k);color:var(--w);padding:40px 0}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:24px}
footer img{height:32px}
footer p{font-size:14px}
.gate{min-height:60vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}

@media (max-width:900px){
 .head{flex-direction:column-reverse;gap:24px}
 .client{width:150px;padding-top:0}
 .tiles{grid-template-columns:repeat(2,1fr)}
 .cards,.tips{grid-template-columns:1fr}
 .build,.plan{grid-template-columns:1fr;gap:24px}
 .browser{position:static}
 .nm summary{grid-template-columns:32px 1fr 80px 24px}
 .nm .track{grid-column:2/4;grid-row:2}
 .nm .more{grid-template-columns:1fr;padding:4px 16px 24px 16px}
}
@media (max-width:640px){
 section{padding:48px 0}
 .wrap{padding:0 16px}
 .doc .what{font-size:36px}
 .doc .for{font-size:21px}
 .doc .kind{font-size:17px}
 h2{font-size:30px}
 .hero .big{font-size:56px}
 .hero .big small{display:block;margin:8px 0 0;font-size:24px}
 .hero .lead{font-size:18px}
 .tile{padding:16px}
 .tile .v{font-size:28px}
 .card,.tip{padding:24px}
 .names{padding:8px}
 .nm summary{gap:8px 12px;padding:12px}
 .nm .who .en{font-size:17px}
 .nm .v{font-size:17px}
 .mock{padding:24px 20px}
 .mock h5{font-size:21px}
 footer .wrap{flex-direction:column;align-items:flex-start}
}

.topics{display:grid;gap:24px;margin-top:40px}
.topic{background:var(--w);border-radius:24px;box-shadow:var(--soft);padding:32px;display:grid;grid-template-columns:1.15fr 1fr;gap:40px}
.topic .tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.topic .t{font-family:'FbJabutinski',sans-serif;font-weight:700;font-size:13px;border-radius:999px;padding:3px 12px;background:var(--g)}
.topic .t.go{background:var(--k);color:var(--w)}
.topic .t.y{background:var(--y)}
.topic h3{font-size:28px;font-weight:900;margin-bottom:4px}
.topic .addr{font-size:14px;margin-bottom:16px;display:block}
.topic .big{font-size:44px;line-height:1;display:block}
.topic .bl{font-size:15px;margin:6px 0 20px;display:block}
.topic p{font-size:16px}
.topic p+p{margin-top:10px}
.topic h4{font-size:15px;font-weight:700;margin-bottom:8px}
.topic .q{display:flex;justify-content:space-between;gap:16px;font-size:15px;padding:6px 12px;border-radius:12px}
.topic .q:nth-child(even){background:var(--g)}
.topic .q .num{font-size:14px;flex:none}
.topic .sub{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:4px 0 20px}
.topic .sub div{background:var(--g);border-radius:16px;padding:12px 14px}
.topic .sub .num{font-size:22px;display:block}
.topic .sub span:last-child{font-size:14px}
.topic .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.next{background:var(--g);border-radius:24px;padding:28px 32px;margin-top:24px;display:flex;gap:24px;align-items:center}
.next .num{font-size:36px;flex:none}
.next p{font-size:16px}
@media (max-width:900px){
 .topic{grid-template-columns:1fr;gap:24px;padding:24px}
 .next{flex-direction:column;align-items:flex-start;gap:8px}
}
@media (max-width:640px){
 .topic h3{font-size:24px}
 .topic .big{font-size:36px}
 .topic .sub{gap:8px}
 .topic .sub div{padding:10px}
 .topic .sub .num{font-size:18px}
 .topic .sub span:last-child{font-size:13px}
 .topic .two{grid-template-columns:1fr}
}
</style>
</head>

(function(){
  var app=document.getElementById('app');
  function fail(){app.innerHTML='<div class="gate"><p>הקישור לא שלם.<br>פתחו את הקישור המלא כפי שנשלח אליכם.</p></div>'}
  function b64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  var m=location.hash.match(/k=([A-Za-z0-9_-]+)/);
  if(!m||!window.crypto||!crypto.subtle){fail();return}
  var blob=b64u(document.getElementById('payload').textContent.trim());
  crypto.subtle.importKey('raw',b64u(m[1]),'AES-GCM',false,['decrypt'])
    .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:blob.slice(0,12)},k,blob.slice(12))})
    .then(function(buf){app.innerHTML=new TextDecoder().decode(buf)})
    .catch(fail);
})();
