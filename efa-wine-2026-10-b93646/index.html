<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F5B424">
<title>קמפיין היין · אוקטובר 2026 · יוביז פרסום</title>
<meta property="og:title" content="דוח קמפיין · אוקטובר 2026">
<meta property="og:description" content="יוביז פרסום">
<style>
:root{--y:#F5B424;--k:#1B1A17;--w:#FFFFFF;--g:#F2F1EE;--a:#F99406;--soft:0 2px 6px rgba(27,26,23,.04),0 16px 40px rgba(27,26,23,.06)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--w);color:var(--k);font-family:'FbJabutinski',system-ui,sans-serif;font-size:17px;line-height:1.55;font-weight:400}
.num{font-family:'Poppins','FbJabutinski',sans-serif;font-weight:600;font-feature-settings:'tnum'}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
section{padding:72px 0}
h1{font-size:56px;line-height:1.1;font-weight:900}
h2{font-size:36px;line-height:1.15;font-weight:900;margin-bottom:8px}
h3{font-size:24px;line-height:1.25;font-weight:700}
.lead{font-size:19px;max-width:680px}
.cap{font-size:14px;line-height:1.4}
.top{padding:32px 0 56px}
.top .logo{height:40px;display:block;margin-bottom:56px}
.kicker{font-size:14px;font-weight:700;letter-spacing:.02em;margin-bottom:16px;display:inline-flex;align-items:center;gap:8px}
.kicker i{width:8px;height:8px;border-radius:50%;background:var(--a);display:inline-block}
.top .lead{margin-top:16px}
.hero{background:var(--y);padding:64px 0}
.hero .label{font-size:17px;font-weight:700}
.hero .big{font-size:80px;line-height:1;font-weight:900;margin:16px 0}
.hero .big .num{font-size:80px}
.hero .lead{font-size:21px;max-width:720px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:40px}
.tile{background:var(--w);border-radius:24px;padding:24px}
.tile .v{font-size:36px;line-height:1.1;display:block}
.tile .t{font-size:15px;line-height:1.4;margin-top:8px;display:block}
.grey{background:var(--g)}
.groups{display:grid;gap:24px;margin-top:40px}
.group{background:var(--w);border-radius:24px;padding:32px;box-shadow:var(--soft)}
.group h3{margin-bottom:16px}
.row{display:grid;grid-template-columns:1.1fr .7fr 2fr;gap:16px;align-items:baseline;padding:16px;border-radius:16px}
.group .row:nth-of-type(even){background:var(--g)}
.row .name{font-weight:700}
.row .tag{display:inline-block;font-family:'Poppins',sans-serif;font-weight:600;font-size:12px;background:var(--g);border-radius:999px;padding:2px 10px;margin-inline-start:8px;vertical-align:2px}
.row .val{font-size:24px}
.row .what{font-size:15px;line-height:1.45}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:40px}
.card{background:var(--w);border-radius:24px;padding:32px;box-shadow:var(--soft)}
.card .fig{font-size:44px;line-height:1;display:block;margin-bottom:16px}
.card h3{margin-bottom:8px}
.card p{font-size:16px}
.ads{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-top:40px}
.ad{background:var(--w);border-radius:24px;overflow:hidden;box-shadow:var(--soft);display:flex;flex-direction:column}
.ad img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.ad .body{padding:16px 16px 24px}
.ad .nm{font-weight:700;font-size:17px;line-height:1.3}
.ad .when{font-size:13px;margin-bottom:12px}
.ad .stat{display:flex;justify-content:space-between;font-size:15px;padding:4px 0}
.ad .stat .num{font-size:15px}
.ad .orders{font-size:32px;line-height:1;margin-top:8px;display:block}
.ad .ol{font-size:13px}
.note{margin-top:24px;font-size:15px}
.dark{background:var(--k);color:var(--w)}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:40px}
.plan h3{margin-bottom:24px}
.step{display:grid;grid-template-columns:48px 1fr;gap:16px;margin-bottom:32px}
.step .no{width:48px;height:48px;border-radius:50%;background:var(--y);color:var(--k);display:flex;align-items:center;justify-content:center;font-size:20px}
.step h4{font-size:19px;font-weight:700;line-height:1.3;margin-bottom:4px}
.step p{font-size:16px}
.ask .no{background:var(--w)}
.method{padding:56px 0}
.method p{font-size:15px;max-width:820px}
.method p+p{margin-top:12px}
footer{background:var(--k);color:var(--w);padding:40px 0}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:24px}
footer img{height:32px}
footer p{font-size:14px}
.gate{min-height:60vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
@media (max-width:900px){
 .tiles{grid-template-columns:repeat(2,1fr)}
 .cards{grid-template-columns:1fr}
 .ads{grid-template-columns:repeat(2,1fr)}
 .plan{grid-template-columns:1fr;gap:16px}
}
@media (max-width:640px){
 section{padding:48px 0}
 h1{font-size:40px}
 h2{font-size:30px}
 .hero .big,.hero .big .num{font-size:52px}
 .hero .lead{font-size:18px}
 .tile{padding:16px}
 .tile .v{font-size:28px}
 .group{padding:24px 20px}
 .row{grid-template-columns:1fr auto;gap:4px 16px}
 .row .what{grid-column:1/-1}
 .card{padding:24px}
 .ads{gap:12px}
 .ad .body{padding:12px 12px 16px}
 .ad .nm{font-size:15px}
 .ad .orders{font-size:26px}
 footer .wrap{flex-direction:column;align-items:flex-start}
}
</style>
</head>

(function(){

  function fail(){app.innerHTML='<div class="gate"><p>הקישור לא שלם.<br>פתחו את הקישור המלא כפי שנשלח אליכם.</p></div>'}
  function b64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  var m=location.hash.match(/k=([A-Za-z0-9_-]+)/);

    .then(function(buf){app.innerHTML=new TextDecoder().decode(buf)})
    .catch(fail);
