:root{--ink:#1b1a17;--ink2:#4a463f;--mute:#857f75;--line:#e9e5dc;--bg:#ffffff;--paper:#faf8f3;
--gold:#F5B424;--gold-bar:#E8A417;--gold-deep:#9c6a10;--gold-wash:#fdf1d3;--fc:#A39B8E;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Assistant',system-ui,sans-serif;font-size:18px;line-height:1.6;direction:rtl}
main{max-width:920px;margin:0 auto;padding:28px 40px 56px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.logo{height:34px;width:auto;display:block}
.stamp{font-size:14px;color:var(--mute)}
section{padding:56px 0;border-bottom:1px solid var(--line)}
.kicker{margin:0 0 6px;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--gold-deep)}
h1{margin:0 0 14px;font-size:clamp(46px,9vw,80px);line-height:1.02;font-weight:800;letter-spacing:-.03em}
h1 mark{background:linear-gradient(transparent 62%,var(--gold) 62%,var(--gold) 92%,transparent 92%);color:inherit;padding:0 2px}
h2{margin:0 0 12px;font-size:clamp(28px,4.6vw,38px);line-height:1.15;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
h3{margin:0;font-size:20px;font-weight:800}
.lede{margin:0;font-size:20px;color:var(--ink2)}
.bl{margin:0 0 26px;font-size:19px;color:var(--ink2)}
.hero{padding-top:44px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:36px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.step{display:flex;flex-direction:column;padding:22px 22px 24px;border-inline-start:1px solid var(--line);position:relative}
.step:first-child{border-inline-start:0}
.step .when{font-size:14px;font-weight:700;color:var(--mute)}
.step .val{font-size:clamp(38px,5.4vw,50px);font-weight:800;line-height:1.1;letter-spacing:-.025em;margin:6px 0 6px}
.step .what{font-size:16px;color:var(--ink2);line-height:1.45}
.step.final{background:var(--ink);color:#fff}
.step.final .when{color:#bdb6a8}
.step.final .val{color:var(--gold)}
.step.final .what{color:#e6e1d6}
.meter{margin-top:22px}
.track{height:10px;border-radius:5px;background:var(--gold-wash);overflow:hidden}
.fill{height:100%;background:var(--gold);border-radius:5px}
.meter p{margin:10px 0 0;font-size:17px;color:var(--ink2)}
.meter strong{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:15px;color:var(--ink2);margin:0 0 14px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px}
.sw.act{background:var(--gold-bar)}.sw.fc{background:var(--fc)}
.sw.tgt{width:18px;height:0;border-radius:0;border-top:2px dashed var(--ink)}
.chart{padding:26px 0 0}
.plot{position:relative;height:280px;margin:0 0 34px;direction:ltr}
.grid,.goal{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}
.goal{border-top:2px dashed var(--ink);z-index:2}
.grid b,.goal b{position:absolute;left:0;bottom:3px;font-size:13px;font-weight:600;color:var(--mute);font-variant-numeric:tabular-nums}
.goal b{color:var(--ink)}
.grid b,.goal b{direction:rtl;unicode-bidi:isolate}
.goal em{position:absolute;right:0;bottom:4px;font-style:normal;font-size:14px;font-weight:700;color:var(--ink);direction:rtl}
.today{position:absolute;top:-22px;bottom:0;border-left:1px solid var(--mute);pointer-events:none;z-index:1}
.today span{position:absolute;top:0;left:6px;font-size:13px;font-weight:700;color:var(--mute);white-space:nowrap}
.bars{position:absolute;inset:0;display:flex;align-items:stretch;border-bottom:1px solid var(--ink2)}
.slot{flex:1;position:relative;display:flex;justify-content:center;align-items:flex-end;outline:none;cursor:default}
.slot i{display:block;width:min(24px,calc(100% - 2px));border-radius:4px 4px 0 0;background:var(--gold-bar);transition:filter .12s}
.slot.fc i{background:var(--fc)}
.slot:hover i,.slot:focus-visible i,.slot.on i{filter:brightness(1.12)}
.slot:focus-visible{box-shadow:inset 0 0 0 2px var(--ink)}
.dl{position:absolute;left:50%;transform:translateX(-50%);font-size:13px;font-weight:800;white-space:nowrap;color:var(--ink);font-variant-numeric:tabular-nums;z-index:3;background:var(--bg);padding:0 3px;border-radius:3px}
.slot:last-child .dl{left:auto;right:-2px;transform:none}
.xl{position:absolute;top:calc(100% + 7px);left:0;font-size:13px;color:var(--mute);white-space:nowrap;direction:rtl}
.tip{position:absolute;z-index:5;min-width:130px;background:var(--ink);color:#fff;border-radius:8px;padding:8px 12px;font-size:14px;line-height:1.35;pointer-events:none;direction:rtl;text-align:right}
.tip strong{display:block;font-size:17px;font-weight:800}
.tip span{color:#d8d2c6}
.table{margin-top:4px;font-size:15px}
.table summary{cursor:pointer;color:var(--gold-deep);font-weight:700}
.table table{width:100%;border-collapse:collapse;margin-top:10px}
.table th,.table td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
.table th{font-size:13px;color:var(--mute);font-weight:700}
.table td.n{font-variant-numeric:tabular-nums;font-weight:700}
.yoy{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:30px;border-top:1px solid var(--line)}
.yoy>div{display:flex;flex-direction:column;padding:18px 0 0}
.yoy>div+div{border-inline-start:1px solid var(--line);padding-inline-start:24px}
.yoy .lab{font-size:14px;font-weight:700;color:var(--mute)}
.yoy .big{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.yoy .cmp{font-size:15px;color:var(--ink2)}
.yoy bdi{font-weight:800;color:var(--ink)}
section.dark{background:var(--ink);color:#fff;border:0;margin:0 -40px;padding:56px 40px;border-radius:0}
.dark .kicker{color:var(--gold)}
.dark .bl{color:#ddd7cb}
.chain{list-style:none;margin:30px 0 40px;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:0;counter-reset:c}
.chain li{display:flex;flex-direction:column;padding:4px 18px 4px 18px;border-inline-start:1px solid #3a3731;position:relative}
.chain li:first-child{border-inline-start:0;padding-inline-start:0}
.chain .n{font-size:clamp(32px,4.4vw,42px);font-weight:800;color:var(--gold);line-height:1.1;letter-spacing:-.02em}
.chain .t{font-size:16px;color:#ddd7cb;line-height:1.45;margin-top:6px}
.dark h3{font-size:15px;font-weight:700;letter-spacing:.06em;color:#a9a294;margin-bottom:6px}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:150px 1fr;gap:18px;padding:16px 0;border-top:1px solid #3a3731}
.rows b{font-size:18px;color:#fff}
.rows span{font-size:17px;color:#ddd7cb;line-height:1.5}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:26px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cards article{padding:22px 22px 24px;border-inline-start:1px solid var(--line);display:flex;flex-direction:column}
.cards article:first-child{border-inline-start:0}
.cards h3{font-size:24px;direction:ltr;text-align:right}
.cards .desc{margin:6px 0 16px;font-size:16px;color:var(--ink2);line-height:1.45}
.cards .nums{display:flex;gap:18px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cards .nums div{display:flex;flex-direction:column;flex:1}
.cards .nums .big{font-size:40px;font-weight:800;line-height:1.05;color:var(--ink)}
.cards .nums span:not(.big){font-size:14px;color:var(--mute);line-height:1.35;margin-top:4px}
.cards .goal-line{margin:0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:17px;font-weight:700;line-height:1.45}
.cards .foot{margin:14px 0 0;font-size:15px;color:var(--ink2);line-height:1.5}
.cards .internal{background:var(--paper)}
.timeline{list-style:none;margin:30px 0 0;padding:0;position:relative}
.timeline>li{position:relative;display:grid;grid-template-columns:150px 1fr;gap:18px;padding:0 30px 26px 0}
.timeline>li::before{content:"";position:absolute;right:5px;top:14px;bottom:-12px;width:1px;background:var(--line)}
.timeline>li:last-child::before{display:none}
.timeline>li::after{content:"";position:absolute;right:0;top:8px;width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--bg)}
.timeline>li.key::after{background:var(--ink);width:15px;height:15px;right:-2px;top:6px}
.timeline time{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;padding-top:1px}
.timeline .key time{font-size:19px}
.timeline ul{list-style:none;margin:0;padding:0}
.timeline ul li{font-size:17px;line-height:1.5;padding:1px 0 5px}
.timeline em{unicode-bidi:isolate;font-style:normal;font-size:13px;font-weight:700;color:var(--gold-deep);margin-inline-end:10px;letter-spacing:.02em}
.timeline .key ul li{font-weight:700}
.off{border-bottom:0;padding:40px 0 32px}
.off p:last-child{margin:0;font-size:18px;color:var(--ink2)}
footer{padding-top:22px;border-top:1px solid var(--line);font-size:14px;color:var(--mute)}
footer p{margin:0}
.gate{min-height:60vh;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ink2);font-size:18px}
@media (max-width:760px){
  body{font-size:17px}
  main{padding:18px 16px 44px}
  .logo{height:28px}
  section{padding:42px 0}
  .steps{grid-template-columns:1fr}
  .step{border-inline-start:0;border-top:1px solid var(--line);padding:18px}
  .step:first-child{border-top:0}
  .plot{height:220px}
  .xl,.grid b,.goal b,.dl{font-size:12px}
  .goal em{font-size:13px}
  .yoy{grid-template-columns:1fr}
  .yoy>div+div{border-inline-start:0;padding-inline-start:0;border-top:1px solid var(--line);margin-top:18px}
  section.dark{margin:0 -16px;padding:44px 16px}
  .chain{grid-template-columns:1fr 1fr;gap:22px 0}
  .chain li:nth-child(odd){border-inline-start:0;padding-inline-start:0}
  .chain li:nth-child(even){padding-inline-end:0}
  .rows li{grid-template-columns:1fr;gap:2px}
  .cards{grid-template-columns:1fr}
  .cards article{border-inline-start:0;border-top:1px solid var(--line)}
  .cards article:first-child{border-top:0}
  .timeline>li{grid-template-columns:1fr;gap:4px;padding-right:28px}
}
@media print{section.dark{-webkit-print-color-adjust:exact;print-color-adjust:exact}.tip{display:none}}
</style>
</head>

      var cx=slot.offsetLeft+slot.offsetWidth/2,x=Math.max(0,Math.min(pw-tw,cx-tw/2));
      var y=plot.clientHeight-bar.offsetHeight-tip.offsetHeight-12;
      if(y<0){y=0;var r=slot.offsetLeft+slot.offsetWidth+6;x=(r+tw<=pw)?r:Math.max(0,slot.offsetLeft-tw-6)}
      tip.style.left=x+'px';tip.style.top=y+'px';
    }
    function hide(){tip.hidden=true;if(cur)cur.classList.remove('on');cur=null}
    plot.querySelectorAll('.slot').forEach(function(s){
      s.addEventListener('pointerenter',function(){show(s)});
      s.addEventListener('focus',function(){show(s)});
      s.addEventListener('click',function(){show(s)});
    });
    plot.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse')hide()});
    plot.querySelectorAll('.slot').forEach(function(s){s.addEventListener('blur',hide)});
  });
}

(function(){
  var app=document.getElementById('app');
  function fail(){app.innerHTML='<div class="gate"><p>הקישור לא שלם.<br>פתחו את הקישור המלא כפי שנשלח בוואטסאפ.</p></div>'}
  function b64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  var m=location.hash.match(/k=([A-Za-z0-9_-]+)/);
  if(!m||!window.crypto||!crypto.subtle){fail();return}
  var blob=b64u(document.getElementById('payload').textContent.trim());
  crypto.subtle.importKey('raw',b64u(m[1]),'AES-GCM',false,['decrypt'])
    .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:blob.slice(0,12)},k,blob.slice(12))})
    .then(function(buf){app.innerHTML=new TextDecoder().decode(buf);initTips(app)})
    .catch(fail);
})();
</script><noscript><p style='text-align:center'>הדוח דורש JavaScript.</p></noscript>
