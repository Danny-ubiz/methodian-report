:root {
  --y: #FFB72E; --ys: #FFE7B8; --ink: #141414; --ink2: #232323; --soft: #5C5C5C; --cream: #F7F7F7; --line: #E6E6E6;
  --gold: #8A5A05; --ok: #1C7A3E; --oks: #E3F4E8; --bad: #B23B2E; --bads: #FBE9E7;
  --ease: cubic-bezier(.23, 1, .32, 1); --hh: 56px; --gut: clamp(1rem, 4vw, 2rem);
}
@media (min-width: 768px) { :root { --hh: 64px; } }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--hh) + 1rem); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
body { margin: 0; background: #fff; color: var(--ink); font-family: 'Assistant', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
h1, h2, h3, h4, p, figure, ul, ol, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }
img { max-width: 100%; height: auto; }
button { font: inherit; color: inherit; cursor: pointer; }
::selection { background: var(--y); color: var(--ink); }
:focus-visible { outline: 3px solid var(--y); outline-offset: 3px; border-radius: 8px; }
.rp { overflow-x: clip; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 78rem; margin-inline: auto; padding-inline: var(--gut); }
.y { color: var(--y); }
.pad { display: inline-block; flex: none; width: .62em; height: .62em; background: var(--y); border-radius: 20% / 20%; transform: rotate(12deg); }
.ic { width: 1.1em; height: 1.1em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
bdi { unicode-bidi: isolate; }
[hidden] { display: none !important; }


.s { padding-block: clamp(4.5rem, 10vw, 8rem); position: relative; isolation: isolate; }
.s--cream { background: var(--cream); }
.s--dark { background: var(--ink); color: #fff; }
.sh { max-width: 52rem; margin-bottom: clamp(2.5rem, 5vw, 4rem); }
.h2 { font-size: clamp(2.6rem, 6.4vw, 4.8rem); font-weight: 800; line-height: 1.02; text-wrap: balance; }
.h2 > span { display: block; }
.h3 { font-size: clamp(1.6rem, 2.8vw, 2.15rem); font-weight: 800; line-height: 1.12; text-wrap: balance; }
.h4 { font-size: 1.35rem; font-weight: 800; line-height: 1.2; }
.lede { margin-top: 1.2rem; max-width: 46rem; font-size: clamp(1.1rem, 1.6vw, 1.3rem); line-height: 1.65; color: var(--soft); text-wrap: pretty; }
.s--dark .lede { color: rgba(255, 255, 255, .72); }


.hd { position: fixed; inset: 0 0 auto; z-index: 50; height: var(--hh); background: rgba(255, 255, 255, .92);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }

.an-n { display: grid; place-items: center; flex: none; width: 2rem; height: 2rem; border-radius: 22%; background: var(--y); font-weight: 800; transform: rotate(12deg); }
.an-b { font-size: .96rem; line-height: 1.5; color: var(--soft); }
.an-b b { display: block; color: var(--ink); font-weight: 800; }


.nds { display: grid; gap: .6rem; max-width: 60rem; }
.nd { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr); gap: 1rem; align-items: start; padding: 1rem 1.1rem; border-radius: 14px; background: #fff; border: 1px solid var(--line); }
.nd-w { justify-self: start; padding: .2rem .65rem; border-radius: 999px; background: var(--ink); color: var(--y); font-size: .84rem; font-weight: 800; white-space: nowrap; }
.nd-b { font-size: 1rem; line-height: 1.55; color: var(--soft); }
.nd-b b { display: block; margin-bottom: .1rem; font-size: 1.1rem; color: var(--ink); }
@media (max-width: 560px) { .nd { grid-template-columns: 1fr; gap: .5rem; } }


.s--close { background: #fff; overflow: clip; }
.close-w { display: grid; gap: 2.5rem; align-items: center; }
@media (min-width: 1024px) { .close-w { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4rem; } }
.launch { position: relative; max-width: 32rem; width: 100%; justify-self: center; overflow: visible; }
.launch::before { content: ''; position: absolute; inset: -12px; z-index: -1; background: var(--y); border-radius: 1.4rem; transform: rotate(-3deg); }
.launch .scr-bar { border-radius: 16px 16px 0 0; }
.launch-in { position: relative; padding: 1.4rem; }
.launch-h { font-size: 1.6rem; font-weight: 800; }
.launch-s { margin-top: .2rem; color: var(--soft); }
.cks { margin-top: 1rem; display: grid; gap: .45rem; }
.ck { display: flex; align-items: center; gap: .7rem; padding: .7rem .8rem; border-radius: 12px; border: 1px solid var(--line); cursor: pointer; font-weight: 700; font-size: 1rem; line-height: 1.35;
  transition: background-color .18s var(--ease), border-color .18s var(--ease); }
.ck input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.ck-b { display: grid; place-items: center; flex: none; width: 1.5rem; height: 1.5rem; border-radius: 7px; border: 2px solid #bdbdbd; background: #fff; color: transparent; transition: background-color .18s var(--ease), border-color .18s var(--ease); }
.ck-b .ic { width: 1rem; height: 1rem; stroke-width: 3; }
.ck input:checked + .ck-b { background: var(--ink); border-color: var(--ink); color: var(--y); }
.ck:has(input:checked) { background: var(--cream); }
.ck:has(input:focus-visible) { outline: 3px solid var(--y); outline-offset: 2px; }
.launch-p { margin-top: 1rem; height: 8px; border-radius: 4px; background: var(--cream); overflow: hidden; }
.launch-p i { display: block; height: 100%; width: 100%; background: var(--y); transform-origin: 100% 50%; transform: scaleX(var(--lp, 0)); transition: transform .45s var(--ease); }
.launch-done { margin-top: .45rem; font-size: .88rem; font-weight: 700; color: var(--soft); }
.stamp { position: absolute; left: 1.2rem; bottom: 1.1rem; padding: .35rem .8rem; border: 3px solid var(--ink); border-radius: 10px; background: var(--y); font-weight: 800; font-size: 1.05rem;
  transform: rotate(-8deg) scale(.9); opacity: 0; transition: opacity .3s var(--ease), transform .45s var(--ease); pointer-events: none; }
.launch.done .stamp { opacity: 1; transform: rotate(-8deg); }


.ft { background: var(--cream); border-top: 4px solid var(--y); }
.ft-in { display: grid; gap: 1.25rem; padding-block: 2.25rem; }
.ft-b { display: flex; align-items: center; gap: .8rem; }
.ft-b img { height: 34px; width: auto; }
.ft-b span { display: flex; flex-direction: column; font-size: .9rem; line-height: 1.25; }
.ft-b small { color: var(--gold); }
.ft p { font-size: .88rem; line-height: 1.6; color: var(--soft); max-width: 60rem; }
@media (min-width: 900px) { .ft-in { grid-template-columns: auto minmax(0, 1fr); gap: 3rem; align-items: center; } }


@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
html.mo .rise { animation: rise .7s var(--ease) both; animation-delay: var(--d, 0s); }
html.mo .rv { opacity: 0; transform: translateY(22px); transition: opacity .6s var(--ease) var(--d, 0s), transform .6s var(--ease) var(--d, 0s); }
html.mo .rv.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media print { .hd { position: static; } html.mo .rv, html.mo .tilt { opacity: 1 !important; transform: none !important; } }
