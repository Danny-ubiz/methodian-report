:root {
  --y: #FFB72E; --ink: #141414; --ink2: #1E1E1E; --soft: #5C5C5C; --cream: #F7F7F7; --line: #E6E6E6;
  --gold: #8A5A05; --ease: cubic-bezier(.23, 1, .32, 1); --hh: 56px;
}
@media (min-width: 768px) { :root { --hh: 64px; } }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--hh) + 1rem); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
body { margin: 0; background: #fff; color: var(--ink); font-family: 'Assistant', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
h1, h2, h3, h4, p, figure { margin: 0; }
img { max-width: 100%; }
::selection { background: var(--y); color: var(--ink); }
:focus-visible { outline: 3px solid var(--y); outline-offset: 3px; border-radius: 8px; }
.rp { overflow-x: clip; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 76rem; margin-inline: auto; padding-inline: clamp(1rem, 4vw, 2rem); }
.y { color: var(--y); }
.g { color: var(--gold); }
.pad { display: inline-block; flex: none; width: 1em; height: 1em; background: var(--y); border-radius: 20% / 20%; transform: rotate(12deg); }
.h2 { font-size: clamp(2.6rem, 6.6vw, 4.9rem); font-weight: 800; line-height: 1.02; text-wrap: balance; }
.h2 > span { display: block; }
.h3 { font-size: clamp(1.9rem, 3.6vw, 2.6rem); font-weight: 800; line-height: 1.1; text-wrap: balance; }
.sec-lede { margin-top: 1.1rem; max-width: 44rem; font-size: clamp(1.1rem, 1.6vw, 1.25rem); line-height: 1.65; color: var(--soft); text-wrap: pretty; }

/* ההצמדה מתוך scrollcraft.css של הסקיל, בלי שאר העיצוב שלו */
.sc-act--pinned { position: relative; }
[data-sc-stage].sc-stage { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: clip; }

/* ================================================================ הפס העליון */
.hd { position: fixed; inset: 0 0 auto; z-index: 50; height: var(--hh); background: rgba(255, 255, 255, .9);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.hd-in { height: 100%; max-width: 76rem; margin-inline: auto; padding-inline: clamp(1rem, 4vw, 2rem); display: flex; align-items: center; gap: 1rem; }
.hd-logo { height: 30px; width: auto; }
.hd-t { display: none; margin-inline-start: auto; font-size: .92rem; font-weight: 700; color: var(--soft); }
.hd-go { margin-inline-start: auto; display: inline-flex; align-items: center; gap: .6rem; height: 40px; padding-inline: .75rem .85rem;
  border-radius: 10px; background: var(--ink); color: #fff; text-decoration: none; font-weight: 800; font-size: .95rem;
  transition: transform .16s var(--ease), opacity .4s var(--ease); }
.hd-go:active { transform: translateY(1px); }
.hd-n { font-size: .92rem; color: rgba(255, 255, 255, .7); }
.hd-n b { color: var(--y); }
.hd-l { display: none; }
@media (min-width: 640px) { .hd-l { display: inline; } .hd-n { display: none; } }
@media (min-width: 768px) { .hd-logo { height: 36px; } .hd-t { display: inline; } .hd-t + .hd-go { margin-inline-start: 0; } }
@media (hover: hover) and (pointer: fine) { .hd-go:hover { transform: translateY(-1px); } }
.hd-go.docked { opacity: 0; pointer-events: none; }

/* ================================================================ לוח 50 הסעיפים, בכל גדליו */
.board { display: grid; }
.cell { position: relative; display: grid; place-items: center; border-radius: 22%; font-weight: 800;
  background: var(--off, rgba(255, 255, 255, .08)); color: var(--off-ink, rgba(255, 255, 255, .5));
  transition: background-color .4s var(--ease) var(--dl, 0s), color .4s var(--ease) var(--dl, 0s), box-shadow .2s; }
.cell.on { background: var(--y); color: var(--ink); }
html.mo .cell.pop { animation: pop .5s var(--ease) var(--dl, 0s) backwards; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.22); } 100% { transform: scale(1); } }
.board--mini { grid-template-columns: repeat(10, 4px); gap: 1.5px; }
.board--mini .cell { width: 4px; height: 4px; border-radius: 1px; --off: rgba(255, 255, 255, .22); }
@media (min-width: 640px) { .board--mini { grid-template-columns: repeat(10, 5px); } .board--mini .cell { width: 5px; height: 5px; } }

/* ================================================================ פתיח */
.hero { position: relative; background: #fff; padding-top: var(--hh); }
.hero::before { content: ''; position: absolute; width: 18rem; height: 18rem; inset-inline-start: -6rem; top: -5rem; pointer-events: none;
  background: hsl(39 100% 59% / .14); border-radius: 34% 66% 34% 66% / 66% 34% 66% 34%; transform: rotate(-12deg); }
.hero-copy { position: relative; padding: 2rem clamp(1rem, 4vw, 2rem) 1.5rem; }
.eyebrow { font-size: 1.1rem; font-weight: 800; color: var(--gold); }
.hero-h { margin-top: .35rem; font-size: clamp(3rem, 7.4vw, 5.5rem); font-weight: 800; line-height: 1; }
.hero-h span { display: block; }
.hero-lede { margin-top: 1.25rem; max-width: 34rem; font-size: clamp(1.08rem, 1.5vw, 1.22rem); line-height: 1.65; color: rgba(20, 20, 20, .8); text-wrap: pretty; }
.hero-lede p + p { margin-top: .5rem; }
.hero-nums { list-style: none; margin: 1.75rem 0 0; padding: 0; max-width: 34rem; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.hero-nums li { padding: .9rem .9rem 0 .5rem; border-top: 2px solid var(--ink); }
.hero-nums li + li { border-inline-start: 1px solid var(--line); }
.hero-nums b { display: block; font-size: clamp(2.2rem, 4vw, 3rem); font-weight: 800; line-height: 1; }
.hero-nums span { display: block; margin-top: .4rem; font-size: .92rem; font-weight: 700; line-height: 1.35; color: var(--soft); text-wrap: pretty; }
.hero-stage { display: flex; align-items: center; justify-content: center; padding: 1rem clamp(1rem, 4vw, 2rem) 3rem; }
.hero-stage.sc-stage { padding-block: calc(var(--hh) + .5rem) .75rem; }
@media (min-width: 1024px) {
  .hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); max-width: 80rem; margin-inline: auto; padding-top: 0; }
  .hero-copy { display: flex; align-items: center; padding: calc(var(--hh) + 2rem) 2rem 2rem; }
  html.mo .hero-copy { position: sticky; top: 0; height: 100vh; height: 100svh; padding-top: var(--hh); }
  .hero-stage { padding-top: calc(var(--hh) + 1rem); }
}

.scene { display: flex; flex-direction: column; align-items: center; gap: .9rem; width: 100%; }
.scene figcaption { max-width: 22rem; text-align: center; font-size: .86rem; line-height: 1.45; color: var(--soft); }
.scene-depth { position: relative; width: min(340px, 84vw); }
.lyr { position: absolute; inset: 0; will-change: transform; }
.lyr-far .blob { position: absolute; width: 118%; aspect-ratio: 1; inset-inline-end: -40%; top: 2%;
  background: hsl(39 100% 59% / .24); border-radius: 34% 66% 34% 66% / 66% 34% 66% 34%; transform: rotate(-12deg); }
.lyr-mid .stripes { position: absolute; width: 80%; height: 36%; inset-inline-start: -16%; bottom: 4%; transform: skewY(-5deg);
  background-image: repeating-linear-gradient(-45deg, hsl(39 100% 59% / .6) 0 2px, transparent 2px 12px); }
.lyr-phone { position: relative; perspective: 1100px; }
.lyr-phone::before { content: ''; position: absolute; inset: -9px; background: var(--y); border-radius: 2.6rem; transform: rotate(-3.5deg); }
.phone { position: relative; border-radius: 2.4rem; background: #262626; padding: 6px; transform: rotateY(var(--ry, 0deg)) rotateX(var(--rx, 0deg));
  box-shadow: 0 46px 80px -34px rgba(20, 14, 0, .6), 0 16px 30px -16px rgba(20, 14, 0, .35); }
.ph-head { display: flex; align-items: center; gap: .7rem; padding: .85rem 1rem .7rem; color: #fff; }
.ph-av { width: 2.25rem; height: 2.25rem; flex: none; display: grid; place-items: center; background: var(--y); color: var(--ink); border-radius: 20% / 20%; transform: rotate(12deg); }
.ph-av b { transform: rotate(-12deg); font-weight: 800; }
.ph-who { display: flex; flex-direction: column; line-height: 1.25; }
.ph-who > b { font-size: 1rem; }
.ph-st { display: flex; align-items: center; gap: .35rem; font-size: .74rem; font-weight: 700; color: var(--y); }
.ph-st i { width: 6px; height: 6px; border-radius: 50%; background: var(--y); }
.ph-screen { position: relative; height: clamp(250px, calc(100svh - var(--hh) - 300px), 430px); overflow: hidden; background: var(--cream); border-radius: 1.7rem 1.7rem 0 0; }
.ph-stack { position: absolute; inset-inline: 0; bottom: 0; padding: .9rem .75rem .8rem; display: flex; flex-direction: column; gap: .5rem;
  transform: translateY(var(--sy, 0px)); transition: transform .34s var(--ease); }
.msg-day { align-self: center; background: var(--ink); color: var(--y); font-size: .74rem; font-weight: 800; padding: .22rem .8rem; border-radius: 999px; }
.msg { position: relative; max-width: 88%; border-radius: 1rem; padding: .45rem .75rem .3rem; font-size: .9rem; line-height: 1.5;
  box-shadow: 0 1px 1.5px rgba(0, 0, 0, .12); transition: opacity .26s var(--ease), transform .32s var(--ease); }
.msg--in { align-self: flex-start; background: #fff; border-start-start-radius: .3rem; }
.msg--out { align-self: flex-end; background: #FFF1D2; border-start-end-radius: .3rem; }
.msg-time { display: block; text-align: end; font-size: .66rem; color: var(--soft); margin-top: .1rem; }
html.mo .msg:not(.on) { opacity: 0; transform: translateY(10px) scale(.96); }
.vn { display: flex; align-items: center; gap: .55rem; min-width: 11rem; padding-top: .15rem; }
.vn-play { width: 1.9rem; height: 1.9rem; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--ink); }
.vn-play svg { width: .8rem; height: .8rem; fill: var(--y); }
.vn-wave { flex: 1; display: flex; align-items: center; gap: 2px; height: 1.3rem; }
.vn-wave i { flex: 1; max-width: 3px; height: calc(var(--h) * 100%); background: rgba(20, 20, 20, .45); border-radius: 2px; }
.vn-t { font-size: .74rem; color: var(--soft); }
.ph-comp { display: flex; align-items: center; gap: .5rem; padding: .5rem .55rem .65rem; background: #EAEAEA; border-radius: 0 0 1.95rem 1.95rem; }
.ph-field { position: relative; flex: 1; min-width: 0; height: 2.35rem; display: flex; align-items: center; padding-inline: .9rem;
  border-radius: 999px; background: #fff; font-size: .9rem; overflow: hidden; white-space: nowrap; }
.ph-ph { color: #9A9A9A; }
.ph-typed:empty { display: none; }
.ph-caret { display: none; width: 2px; height: 1.1rem; background: var(--ink); margin-inline-start: 1px; }
.ph-comp.typing .ph-ph { display: none; }
.ph-comp.typing .ph-caret { display: block; animation: caret 1s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }
.ph-rec { position: absolute; inset: 0; display: flex; align-items: center; gap: .5rem; padding-inline: .9rem; background: #fff; opacity: 0; transition: opacity .18s; }
.ph-comp.rec .ph-rec { opacity: 1; }
.ph-dot { width: .55rem; height: .55rem; flex: none; border-radius: 50%; background: #D93D3D; }
.ph-comp.rec .ph-dot { animation: caret 1.1s steps(1) infinite; }
.ph-timer { font-size: .85rem; font-weight: 700; }
.ph-wave { flex: 1; display: flex; align-items: center; gap: 2px; height: 1.2rem; }
.ph-wave i { flex: 1; max-width: 3px; height: calc(var(--h) * 100%); background: var(--ink); border-radius: 2px; transform: scaleY(var(--s, 1)); }
.ph-mic { width: 2.35rem; height: 2.35rem; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--y); transition: transform .2s var(--ease); }
.ph-mic svg { width: 1.1rem; height: 1.1rem; fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
.ph-comp.rec .ph-mic { transform: scale(1.14); }

.lyr-near { pointer-events: none; }
.chip { position: absolute; display: flex; align-items: center; gap: .6rem; width: max-content; max-width: 15rem; padding: .6rem .8rem;
  background: #fff; border-radius: .9rem; font-size: .8rem; line-height: 1.35; color: var(--soft);
  box-shadow: 0 24px 40px -18px rgba(20, 14, 0, .5), 0 4px 10px -4px rgba(20, 14, 0, .15);
  transition: opacity .4s var(--ease), transform .6s var(--ease); }
.chip b { display: block; font-size: .86rem; color: var(--ink); }
.chip-i { width: 2rem; height: 2rem; flex: none; display: grid; place-items: center; border-radius: .6rem; background: var(--ink); }
.chip-i svg { width: 1.1rem; height: 1.1rem; fill: none; stroke: var(--y); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
/* התגיות יושבות רק על המסגרת של הטלפון (הכותרת למעלה ושדה ההודעה למטה), אף פעם לא על ההודעות עצמן */
.chip > span:last-child { text-wrap: pretty; }
.chip--task { inset-inline-end: -.5rem; bottom: -.6rem; --fx: 2.5rem; --fy: -1.5rem; }
.chip--bell { inset-inline-end: -.5rem; top: -.4rem; --fx: 2rem; --fy: 1.5rem; }
html.mo .chip:not(.on) { opacity: 0; transform: translate3d(var(--fx), var(--fy), 0) scale(.82); }
@media (min-width: 1024px) {
  .hero-stage.sc-stage { overflow-x: visible; overflow-y: clip; }
  .scene { align-items: flex-start; padding-inline-start: 1.5rem; }
  .chip { max-width: 16.5rem; font-size: .84rem; }
  .chip--task { inset-inline-end: -6.5rem; --fx: 5rem; }
  .chip--bell { inset-inline-end: -5rem; --fx: 4rem; }
}

/* ================================================================ 01: המבנה */
.s1 { background: var(--cream); padding-block: clamp(4.5rem, 10vw, 7.5rem); }
.tree { position: relative; margin-top: clamp(2.5rem, 6vw, 3.5rem); }
.hub { position: relative; z-index: 1; max-width: 34rem; margin-inline: auto; overflow: hidden; background: var(--ink); color: #fff; border-radius: 1.5rem;
  padding: 1.5rem 1.5rem 1.6rem; text-align: center; box-shadow: 0 30px 70px -40px rgba(0, 0, 0, .7); }
.hub::before { content: ''; position: absolute; width: 8rem; height: 8rem; inset-inline-start: -2.5rem; top: -3rem;
  background: hsl(39 100% 59% / .25); border-radius: 34% 66% 34% 66% / 66% 34% 66% 34%; transform: rotate(-12deg); }
.hub > * { position: relative; }
.hub-k { color: var(--y); font-weight: 800; font-size: .92rem; }
.hub-h { margin-top: .15rem; font-size: 2.1rem; font-weight: 800; }
.hub-d { margin-top: .5rem; color: rgba(255, 255, 255, .76); line-height: 1.6; font-size: 1.08rem; text-wrap: pretty; }
.wires { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 0; }
.wires path { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.wires .w-base { stroke: #DADADA; }
.wires .w-live { stroke: var(--y); }
.pulse { fill: var(--y); stroke: #fff; stroke-width: 3; opacity: 0; }
.workers { position: relative; z-index: 1; list-style: none; margin: 1.6rem 0 0; padding: 0; padding-inline-start: 2.4rem; display: grid; gap: .75rem; }
.wk { position: relative; background: #fff; border: 1px solid var(--line); border-radius: 1rem; padding: 1rem 1.1rem;
  transition: border-color .35s var(--ease), box-shadow .35s var(--ease); }
.wk .pad { display: block; width: 1.3rem; height: 1.3rem; transition: transform .5s var(--ease); }
.wk h3 { margin-top: .5rem; font-size: 1.4rem; font-weight: 800; }
.wk p { margin-top: .3rem; line-height: 1.55; color: var(--soft); font-size: 1.02rem; text-wrap: pretty; }
.wk.on { border-color: var(--y); box-shadow: 0 18px 40px -26px rgba(20, 14, 0, .45); }
.wk.on .pad { transform: rotate(57deg); }
html.mo .wk.ping { animation: ping 1s var(--ease); }
@keyframes ping { 0% { box-shadow: 0 0 0 0 hsl(39 100% 59% / .7); } 100% { box-shadow: 0 0 0 18px hsl(39 100% 59% / 0); } }
@media (min-width: 1024px) {
  .workers { grid-template-columns: repeat(5, minmax(0, 1fr)); margin-top: 4.25rem; padding: 0; }
  .wk { text-align: center; padding: 1.2rem 1rem; }
  .wk .pad { margin-inline: auto; }
}
.rules { margin-top: clamp(4.5rem, 9vw, 6.5rem); display: grid; gap: 1.5rem; }
.rules ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid #D9D9D9; }
.rules li { display: flex; gap: 1.1rem; padding: 1.3rem 0; border-bottom: 1px solid #D9D9D9; }
.rule-n { width: 2.6rem; height: 2.6rem; flex: none; display: grid; place-items: center; background: var(--y); border-radius: 20% / 20%; transform: rotate(12deg); }
.rule-n b { transform: rotate(-12deg); font-weight: 800; font-size: 1.1rem; }
.rule-h { display: block; font-size: 1.32rem; font-weight: 800; line-height: 1.3; }
.rule-d { display: block; margin-top: .3rem; font-size: 1.06rem; line-height: 1.6; color: var(--soft); text-wrap: pretty; }
@media (min-width: 900px) { .rules { grid-template-columns: 19rem minmax(0, 1fr); gap: 3.5rem; align-items: start; } }
.stack { position: relative; overflow: hidden; margin-top: clamp(3rem, 7vw, 4.5rem); background: var(--ink); color: #fff; border-radius: 1.5rem; padding: clamp(1.5rem, 4vw, 2.5rem); }
.stack-blob { position: absolute; width: 10rem; height: 10rem; inset-inline-end: -3rem; bottom: -4rem; background: hsl(39 100% 59% / .2);
  border-radius: 34% 66% 34% 66% / 66% 34% 66% 34%; transform: rotate(-12deg); }
.stack ul { position: relative; list-style: none; margin: 1.2rem 0 0; padding: 0; display: grid; gap: .85rem; }
.stack li { display: flex; gap: .75rem; align-items: flex-start; font-size: 1.1rem; line-height: 1.55; color: rgba(255, 255, 255, .8); }
.stack li .pad { width: .85rem; height: .85rem; margin-top: .42rem; }
.stack li b { color: #fff; }
@media (min-width: 640px) { .stack ul { grid-template-columns: 1fr 1fr; gap: 1rem 2rem; } }

/* ================================================================ 02: סדר העבודה, השיא */
.s2 { background: var(--ink); color: #fff; padding-block: clamp(5rem, 12vw, 8rem) clamp(3.5rem, 8vw, 5rem); }
.s2 .sec-lede { color: rgba(255, 255, 255, .72); }
.s2-body { display: grid; gap: 1rem; margin-top: clamp(2.5rem, 6vw, 4rem); }
.inst { position: sticky; top: calc(var(--hh) + .5rem); z-index: 5; }
.inst-card { position: relative; overflow: hidden; border-radius: 1rem; background: var(--ink2); border: 1px solid rgba(255, 255, 255, .09);
  padding: .65rem .8rem .75rem; box-shadow: 0 20px 40px -22px rgba(0, 0, 0, .9); transition: color .4s var(--ease) .25s; }
.inst-card > * { position: relative; }
.inst-flood { position: absolute !important; inset: 0; background: var(--y); clip-path: circle(0% at var(--fx, 50%) var(--fy, 50%)); transition: clip-path 1s var(--ease); }
.inst-top { display: flex; align-items: baseline; gap: .75rem; }
.inst-k { font-size: .82rem; font-weight: 800; color: rgba(255, 255, 255, .6); transition: color .4s var(--ease) .25s; }
.inst-n { font-weight: 800; font-size: .95rem; }
.inst-n b { font-size: 1.15rem; color: var(--y); transition: color .4s var(--ease) .25s; }
.inst-n span { color: rgba(255, 255, 255, .6); transition: color .4s var(--ease) .25s; }
.inst-wk { margin-inline-start: auto; font-size: .82rem; font-weight: 800; color: rgba(255, 255, 255, .6); }
.inst-wk b { color: #fff; font-size: .95rem; }
.weeks, .board--big, .inst-done { display: none; }
.board--strip { margin-top: .5rem; grid-template-columns: repeat(25, minmax(0, 1fr)); gap: 3px; }
.board--strip .cell { height: 9px; border-radius: 2px; --off: rgba(255, 255, 255, .13); }
.inst-card.full { color: var(--ink); }
.inst-card.full .inst-flood { clip-path: circle(150% at var(--fx, 50%) var(--fy, 50%)); }
.inst-card.full .inst-k, .inst-card.full .inst-n span, .inst-card.full .inst-wk, .inst-card.full .inst-wk b { color: rgba(20, 20, 20, .7); }
.inst-card.full .inst-n b { color: var(--ink); }
.inst-card.full .cell.on { background: var(--ink); color: var(--y); transition-delay: .3s; }
@media (min-width: 1024px) {
  .s2-body { grid-template-columns: minmax(0, 1fr) 26rem; gap: 3rem; align-items: start; }
  .stages { grid-column: 1; grid-row: 1; }
  .inst { grid-column: 2; grid-row: 1; top: calc(var(--hh) + 2rem); }
  .inst-card { border-radius: 1.5rem; padding: 1.4rem 1.4rem 1.5rem; }
  .inst-k { font-size: .95rem; }
  .inst-top { flex-wrap: wrap; row-gap: .2rem; }
  .inst-n { flex-basis: 100%; order: 3; font-size: 1.2rem; }
  .inst-n b { font-size: 3.4rem; line-height: 1; letter-spacing: -.02em; }
  .inst-wk { font-size: .95rem; }
  .inst-wk b { font-size: 1.15rem; }
  .board--strip { display: none; }
  .weeks { display: block; margin-top: 1.1rem; }
  .board--big { display: grid; margin-top: 1rem; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; }
  .board--big .cell { aspect-ratio: 1; font-size: .92rem; cursor: pointer; }
  .board--big .cell.hl { box-shadow: 0 0 0 2px #fff; }
  .inst-done { display: block; margin-top: 1rem; font-weight: 800; font-size: 1.15rem; opacity: 0; transform: translateY(6px);
    transition: opacity .5s var(--ease) .5s, transform .5s var(--ease) .5s; }
  .inst-card.full .inst-done { opacity: 1; transform: none; }
}
.wbands, .wticks { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); }
.wbands { gap: 3px; }
.wb { border-top: 3px solid rgba(255, 255, 255, .22); padding-top: .25rem; font-size: .72rem; font-weight: 800; color: rgba(255, 255, 255, .55); white-space: nowrap; overflow: hidden;
  transition: border-color .3s, color .3s; }
.wb.on { border-color: var(--y); color: #fff; }
.wticks { position: relative; margin-top: .3rem; }
.wt { text-align: center; font-size: .72rem; color: rgba(255, 255, 255, .5); transition: color .25s; }
.wt.on { color: var(--y); }
.wmark { position: absolute; top: -.15rem; right: 0; width: calc(100% / 13); height: 1.35rem; border: 2px solid var(--y); border-radius: .4rem; opacity: 0;
  transition: opacity .3s, transform .35s var(--ease); }
.wmark.on { opacity: 1; }
.inst-card.full .wb, .inst-card.full .wt { color: rgba(20, 20, 20, .6); border-color: var(--ink); }
.inst-card.full .wmark { border-color: var(--ink); }

.stages { display: flex; flex-direction: column; gap: 1.25rem; }
.stage { position: relative; overflow: hidden; border-radius: 1.5rem; background: #fff; color: var(--ink); padding: clamp(1.25rem, 3.5vw, 2.25rem);
  clip-path: inset(0 0 0 var(--wipe, 0%) round 1.5rem); }
.st-num { position: absolute; inset-inline-end: .5rem; top: -.12em; font-size: clamp(5.5rem, 12vw, 9rem); font-weight: 800; line-height: 1; letter-spacing: -.04em;
  color: hsl(39 100% 59% / .3); pointer-events: none; user-select: none; }
.st-head { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: .6rem .8rem; }
.st-lab { display: inline-flex; align-items: center; gap: .5rem; border: 2px solid hsl(39 100% 59% / .5); border-radius: 999px; padding: .28rem .9rem; font-weight: 800; font-size: 1.02rem; }
.st-lab .pad { width: .7rem; height: .7rem; }
.st-wk { font-weight: 700; color: var(--soft); }
.st-h { position: relative; margin-top: .8rem; font-size: clamp(1.9rem, 4vw, 2.75rem); font-weight: 800; line-height: 1.08; text-wrap: balance; }
.st-out { position: relative; margin-top: .6rem; font-size: 1.2rem; font-weight: 700; line-height: 1.5; color: var(--gold); text-wrap: pretty; }
.st-out span { color: var(--ink); }
.systems { list-style: none; margin: 1.3rem 0 0; padding: 0; display: grid; gap: .7rem; }
.sys { position: relative; border-radius: 1.05rem; background: var(--cream); padding: 1rem 1.1rem 1.1rem; box-shadow: inset 0 0 0 2px transparent;
  transition: box-shadow .35s var(--ease), background-color .35s var(--ease); }
.sys.on { background: #fff; box-shadow: inset 0 0 0 2px var(--y); }
.sys.hl { box-shadow: inset 0 0 0 2px var(--ink); }
.sys-tags { display: flex; flex-wrap: wrap; gap: .4rem; }
.have, .ef { display: inline-flex; align-items: center; gap: .35rem; white-space: nowrap; border-radius: 999px; padding: .12rem .65rem; font-size: .8rem; font-weight: 800; }
.have--full { background: var(--ink); color: var(--y); }
.have--full i { width: 6px; height: 6px; border-radius: 50%; background: var(--y); }
.have--part { border: 2px dashed var(--y); background: #fff; color: var(--gold); padding-block: .02rem; }
.ef-easy { background: #E9E9E9; }
.ef-mid { background: hsl(39 100% 59% / .35); }
.ef-hard { background: var(--ink); color: var(--y); }
.sys-h { margin-top: .6rem; font-size: 1.5rem; font-weight: 800; line-height: 1.15; }
.sys-d { margin-top: .4rem; font-size: 1.03rem; line-height: 1.62; color: rgba(20, 20, 20, .8); text-wrap: pretty; }
.sys-k { margin-top: .8rem; font-size: .82rem; font-weight: 800; color: var(--soft); }
.sys-items { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .35rem; }
.it { min-width: 2rem; height: 2rem; padding-inline: .4rem; display: grid; place-items: center; border-radius: .5rem; background: #fff; border: 1px solid var(--line);
  font-weight: 800; font-size: .9rem; transition: background-color .35s var(--ease) var(--dl, 0s), border-color .35s var(--ease) var(--dl, 0s); }
.sys.on .it { background: var(--y); border-color: var(--y); }
.st-why { position: relative; margin-top: 1.2rem; font-size: 1.08rem; line-height: 1.65; color: var(--soft); text-wrap: pretty; }
.st-why b { color: var(--gold); }
.s2-note { margin-top: 2.25rem; text-align: center; color: rgba(255, 255, 255, .66); font-size: 1.08rem; line-height: 1.6; max-width: 48rem; text-wrap: pretty; }

/* ================================================================ 03: מה צריך ממך */
.s3 { background: #fff; padding-block: clamp(4.5rem, 10vw, 7rem); }
.needs { margin-top: 2.5rem; display: grid; gap: 1.6rem; }
.need-g { display: grid; gap: .8rem; border-top: 1px solid var(--line); padding-top: 1.4rem; }
.need-k { display: flex; align-items: center; gap: .65rem; font-weight: 800; color: var(--gold); font-size: 1.08rem; }
.need-dot { width: .8rem; height: .8rem; flex: none; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 4px hsl(39 100% 59% / .45); }
.need-g ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .7rem; }
.need { display: flex; gap: .75rem; align-items: flex-start; background: var(--cream); border-radius: 1rem; padding: 1rem 1.1rem; }
.need .pad { width: 1rem; height: 1rem; margin-top: .35rem; }
.need b { display: block; font-size: 1.22rem; font-weight: 800; }
.need span span { display: block; margin-top: .2rem; color: var(--soft); line-height: 1.55; font-size: 1.03rem; }
html.mo .need-g { opacity: 0; transform: translateY(18px); transition: opacity .55s var(--ease) var(--dl, 0s), transform .55s var(--ease) var(--dl, 0s); }
html.mo .need-g.in { opacity: 1; transform: none; }
@media (min-width: 640px) { .need-g ul { grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); } }
@media (min-width: 900px) { .need-g { grid-template-columns: 13rem minmax(0, 1fr); gap: 2rem; align-items: start; } .need-k { padding-top: .6rem; } }

/* ================================================================ 04: הסיום */
.s4 { position: relative; overflow: hidden; background: var(--ink); color: #fff; padding-block: clamp(5rem, 11vw, 8rem); }
.s4-blob { position: absolute; width: 16rem; height: 16rem; inset-inline-start: -5rem; top: -5rem; background: hsl(39 100% 59% / .12);
  border-radius: 34% 66% 34% 66% / 66% 34% 66% 34%; transform: rotate(-12deg); }
.s4-in { position: relative; display: grid; gap: 3rem; align-items: center; }
.agenda { list-style: none; margin: 2.25rem 0 0; padding: 0; border-top: 1px solid rgba(255, 255, 255, .15); }
.agenda li { display: flex; gap: 1rem; padding: 1.2rem 0; border-bottom: 1px solid rgba(255, 255, 255, .15); }
.ag-n { width: 2.5rem; height: 2.5rem; flex: none; display: grid; place-items: center; background: var(--y); color: var(--ink); border-radius: 20% / 20%; transform: rotate(12deg); }
.ag-n b { transform: rotate(-12deg); font-weight: 800; }
.ag-h { display: block; font-size: 1.35rem; font-weight: 800; color: var(--y); }
.ag-d { display: block; margin-top: .25rem; font-size: 1.08rem; line-height: 1.6; color: rgba(255, 255, 255, .8); text-wrap: pretty; }
.seal { justify-self: center; width: min(100%, 24rem); background: var(--y); color: var(--ink); border-radius: 1.4rem; padding: 1.2rem 1.2rem 1.1rem;
  transform: rotate(-3deg); box-shadow: 0 34px 60px -28px rgba(0, 0, 0, .95); }
.board--seal { grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 5px; }
.board--seal .cell { aspect-ratio: 1; font-size: clamp(.62rem, 2.2vw, .85rem); background: var(--ink); color: var(--y); }
html.mo .board--seal .cell { opacity: 0; transform: scale(.6); transition: opacity .35s var(--ease) var(--dl, 0s), transform .45s var(--ease) var(--dl, 0s); }
html.mo .seal.in .board--seal .cell { opacity: 1; transform: none; }
.seal-c { margin-top: .9rem; text-align: center; font-weight: 800; font-size: 1.05rem; line-height: 1.35; }
@media (min-width: 1024px) { .s4-in { grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); gap: 4rem; } }

/* ================================================================ תחתית */
.ft { position: relative; background: var(--cream); border-top: 4px solid var(--y); }
.ft-in { display: flex; flex-direction: column; align-items: center; gap: 1.2rem; padding-block: 2.5rem; text-align: center; }
.ft-brand { display: flex; flex-direction: column; align-items: center; gap: .75rem; }
.ft-brand img { height: 36px; width: auto; }
.ft-brand > span { display: flex; flex-direction: column; font-size: .9rem; line-height: 1.3; }
.ft-brand b { font-weight: 800; }
.ft-brand > span > span { color: var(--gold); }
.ft p { max-width: 36rem; font-size: .92rem; line-height: 1.6; color: var(--soft); text-wrap: pretty; }
@media (min-width: 640px) { .ft-in { flex-direction: row; justify-content: space-between; text-align: start; } .ft-brand { flex-direction: row; } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

   scrollcraft: a scroll-driven interaction runtime
   ----------------------------------------------------------------------------
   Vanilla JS. Zero dependencies. Zero DOM generation.

   The engine does NOT build your page. You author real, semantic HTML and mark
   it up with data-sc-* attributes; the engine reads them and drives them from a
   single scroll value on a single rAF loop. That is deliberate: a runtime that
   generates its own DOM from a config object makes every site it touches look
   identical, which is the failure mode this replaces.

   ---------------------------------------------------------------------------
   ACTS: the unit of scroll time
   ---------------------------------------------------------------------------
     <section data-sc-act="pin" data-sc-span="2.5"> ... </section>

     data-sc-act   scrub | pin | pan | flow   (default: flow)
     data-sc-clip-map="travel" opts a pinned act OUT of full-life clip mapping.
                   By DEFAULT a scrub clip is mapped across the stage's entire
                   on-screen life, not across its pinned travel, because a pinned
                   stage is visible for a viewport BEFORE the pin begins (sliding
                   up into view) and a viewport AFTER it ends (sliding off the
                   top). Mapped to pinned travel, the clip sits on its first
                   frame through the whole entry and its last frame through the
                   whole exit: the reader watches a still photograph while the
                   page moves. Pair it with data-sc-dwell, which moves quickly at
                   the edges and settles in the middle, so the fast motion lands
                   on the two slides and the settle lands inside the pin where
                   the copy is. data-sc-runout is accepted and ignored; it named
                   the old opt-in for the exit half of this.
     data-sc-span  viewport-heights of scroll this act owns. Pinned devices only
                   (scrub/pin/pan). Default 1.5. The engine sets the outer
                   height and sticks the first .sc-stage / [data-sc-stage] child.

     Every act exposes a normalized progress p (0..1):
       pinned  p = (y - top) / (height - vh)
       flow    p = (y + vh - top) / (height + vh)
     and publishes it as --sc-p on the act element, so CSS can read it too.

   ---------------------------------------------------------------------------
   DEVICES: what p drives
   ---------------------------------------------------------------------------
     data-sc-scrub            on <video>. p scrubs currentTime. Blob-loaded, so
                              it seeks without needing HTTP range support.
     data-sc-sequence="a/{i}.webp:120:1"
                              on <canvas>. p scrubs an image sequence
                              (path template : frameCount : startIndex).
     data-sc-pan="0.6"        on a wide rail inside data-sc-act="pan". p drives
                              horizontal travel. Value = extra travel multiplier.
     data-sc-parallax="-0.2"  translateY by rate * act-progress * viewport.
                              Negative = moves up faster than scroll (recedes).
     data-sc-cue="0.1 0.5"    opacity/rise keyed to p. One value = enter+hold.
                              Two = enter..leave. Add a third for the hold point.
     data-sc-kinetic="lines"  lines | words | chars. Splits the element and
                              staggers its reveal across the cue window.
     data-sc-reveal="up"      up | down | left | right | iris. clip-path wipe.
     data-sc-count="0 4200"   number bloom across the cue window. Outside any
                              act it ticks up once on entry instead, over
                              data-sc-count-ms (default 1400).
     data-sc-in               flow-section reveal, fires once on entry via
                              IntersectionObserver (cheaper, and content that
                              re-hides on scroll-up is a defect, not an effect).
                              data-sc-stagger="60" on the parent staggers kids.
     data-sc-drift="#07090c"  page background interpolates toward this colour
                              while the act is on screen.

   ---------------------------------------------------------------------------
   WORLDFLIGHT: the page mode for one continuous flight
   ---------------------------------------------------------------------------
     <div data-sc-mode="worldflight" data-sc-seam="0.12">
       <div data-sc-world>
         <div data-sc-segment data-sc-w="1.4" data-sc-linger="0.3"
              data-sc-waypoint="Approach">
           <img class="sc-world__poster" src="p1.webp" alt="">
           <video data-sc-src="leg1.mp4" data-sc-src-mobile="leg1-m.mp4"></video>
         </div>
         ... more segments, in flight order ...
       </div>
       <div data-sc-world-copy>
         <div class="sc-world__scrim sc-scrim sc-scrim--band"></div>
         <div data-sc-copy data-sc-window="hero"> ... </div>
         <div data-sc-copy data-sc-window="0.34 0.56"> ... </div>
         <div data-sc-copy data-sc-window="finale"> ... </div>
       </div>
       <div data-sc-spacer aria-hidden="true"></div>
     </div>

   Acts cut the page into pinned blocks, which is the right shape for a page of
   chapters and the wrong shape for one continuous camera move: the reader hits
   the end of an act, the stage unsticks, a static page slides past, and the next
   act starts the whole thing again. Worldflight removes the seams by removing
   the blocks. There is ONE fixed stage for the entire page. The only element in
   document flow is a spacer, whose height the engine sets to the sum of the
   segment weights plus one viewport so the last flight can finish. Scroll drives
   the film timeline and the overlay opacity. Nothing else moves.

     data-sc-w        viewport-heights this segment owns. Default 1.3.
     data-sc-linger   dwell remap for this leg only (see lingerEase). Max 0.6.
     data-sc-seam     crossfade band, in viewport-heights of scroll. Default 0.12.
     data-sc-waypoint label published on --sc-seg / the sc:waypoint event, so a
                      page can draw its own route rail. The engine draws none.
     data-sc-window   on a copy block: "hero" | "finale" | "from to [in [out]]"
                      as fractions of the WHOLE track.

   Every clip stays mounted for the life of the page. Segments crossfade by
   opacity over the seam band; nothing ever swaps a src, because a src swap is a
   black frame and a black frame is the cut this mode exists to avoid.

   ---------------------------------------------------------------------------
   POINTER: interactivity that isn't scroll
   ---------------------------------------------------------------------------
     data-sc-tilt="8"         3D tilt toward the pointer, spring-damped, degrees.
     data-sc-magnet="0.35"    element drifts toward the pointer inside its bounds.
     data-sc-spotlight        publishes --sc-mx/--sc-my (0..1) for a light that
                              follows the pointer across the surface.
   All three are gated to (hover: hover) and (pointer: fine) and disabled under
   prefers-reduced-motion. Touch never fires them.

   ---------------------------------------------------------------------------
   REDUCED MOTION
   ---------------------------------------------------------------------------
   Fewer and gentler, not zero. Cues still fade (comprehension survives), but
   translation collapses, video clips are never fetched (the poster holds), and
   pointer devices are inert. A worldflight still tells its whole story: the
   posters cross-dissolve through the same seams and the same copy windows.

   ---------------------------------------------------------------------------
   THE PLAYHEAD
   ---------------------------------------------------------------------------
   Every scrub clip on the page, act or worldflight, is driven by one smoothed
   playhead. Scroll only ever writes a TARGET; a standalone rAF loop walks the
   current time toward it at a fixed fraction per frame (data-sc-lerp, default
   0.18; 1.0 under reduced motion, which is no smoothing at all). Writes are
   gated by a deadband and skipped while the decoder is still seeking. Without
   the smoothing a trackpad flick reads as a stutter, because wheel events do
   not arrive at a constant rate and a 1:1 write reproduces every gap in them.
   ========================================================================== */

  'use strict';

  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var fineMQ = matchMedia('(hover: hover) and (pointer: fine)');
  var smallMQ = matchMedia('(max-width: 860px)');
  var coarse = matchMedia('(hover: none) and (pointer: coarse)').matches;
  var isMobile = function () { return coarse || smallMQ.matches; };

  var clamp = function (x, a, b) { return x < a ? a : x > b ? b : x; };
  var clamp01 = function (x) { return clamp(x, 0, 1); };
  var smooth = function (x) { x = clamp01(x); return x * x * (3 - 2 * x); };
  var lerp = function (a, b, t) { return a + (b - a) * t; };

  // Monotone dwell remap. Settles the camera mid-act (where the copy peaks) and
  // moves quicker at the edges. f(0)=0 and f(1)=1 always, so seam frames between
  // consecutive clips are untouched and the chain stays invisible.
  function dwell(x, L) {
    if (!L) return x;
    L = clamp01(L);
    var c = x - 0.5;
    return (1 - L) * x + L * (4 * c * c * c + 0.5);
  }

  // derivative at the midpoint gets low enough that the camera visibly stops
  // dead mid-leg, which reads as a stall rather than a hold. The endpoints are

          // act is fine because by then the reader has touched the screen and

          // briefly blank is a smaller fault than one that never shows its clip.

(function(){
  var app=document.getElementById('app');
  function fail(){app.innerHTML='<p style="text-align:center;padding:6rem 1rem;color:#5C5C5C;font-size:1.1rem">הקישור לא שלם. פתחו את הקישור המלא כפי שנשלח אליכם.</p>'}
  function b64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}

    .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:blob.slice(0,12)},k,blob.slice(12))})

})();
