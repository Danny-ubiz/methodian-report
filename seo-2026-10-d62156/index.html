/* ארבעת הרגעים בגלילה. כל רגע בנוי פעמיים:
   בלי מחלקת on (בלי JavaScript, או עם תנועה מופחתת) הוא תוכן רגיל, גלוי ונייח.
   עם המחלקה (m1-on וכן הלאה) moments.js מצמיד אותו דרך המנוע של הסקיל ומניע אותו לפי הגלילה. */

/* ההצמדה מתוך scrollcraft.css של הסקיל, בלי שאר העיצוב שלו */
.sc-act--pinned { position: relative; }
[data-sc-stage].sc-stage { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: clip; }

/* ================================================================ רגע 1: החיפוש */
.m1 { --side: max(1.25rem, calc((100% - 74rem) / 2)); --vw: min(46rem, 57%); }
.m1-stage { position: relative; }

/* הגילוי: דן והכותרת */
.m1-reveal { position: relative; max-width: 72rem; margin: 0 auto; padding: 2.5rem 1.25rem 0; display: grid; gap: 1.75rem; }
@media (min-width: 1024px) { .m1-reveal { grid-template-columns: minmax(0, .78fr) minmax(0, 1fr); align-items: center; gap: 3.5rem; padding-top: 3.5rem; } }
.m1-portrait { position: relative; overflow: hidden; border-radius: 1.25rem; aspect-ratio: 4 / 3.5; background: #F7F7F7; box-shadow: 0 30px 80px -30px rgba(0,0,0,.8); }
.m1-portrait img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 16%; }
.m1-badges { position: absolute; left: .75rem; top: .75rem; z-index: 2; display: flex; flex-direction: column; align-items: flex-end; gap: .4rem; margin: 0; padding: 0; list-style: none; }
.m1-badges li { border-radius: 999px; background: rgba(255,255,255,.96); color: #141414; padding: .25rem .8rem; font-size: .8rem; font-weight: 800; box-shadow: 0 6px 18px -8px rgba(0,0,0,.45); }
@media (min-width: 640px) { .m1-badges { left: 1rem; top: 1rem; gap: .5rem; } .m1-badges li { font-size: .9rem; padding: .3rem .9rem; } }
.m1-h { margin: 0; line-height: 1.04; }
.m1-hl { display: block; font-size: clamp(1.6rem, 4.2vw, 2.7rem); font-weight: 700; }
.m1-hl:last-child { font-weight: 800; }
.m1-hl-big { font-size: clamp(3rem, 8.4vw, 5.6rem); font-weight: 800; color: #FFB72E; padding-block: .04em; }
.m1-miss { margin: 1.5rem 0 0; display: flex; align-items: center; gap: .9rem; max-width: 34rem; border: 2px dashed #FFB72E; border-radius: .9rem; padding: .8rem 1rem;
  background-image: repeating-linear-gradient(-45deg, hsl(39 100% 59% / .12) 0 6px, transparent 6px 12px); }
.m1-miss-q { flex: none; display: grid; place-items: center; width: 2.2rem; height: 2.2rem; border-radius: 999px; background: #FFB72E; color: #141414; font-weight: 800; font-size: 1.2rem; }
.m1-miss-d { display: block; text-align: right; font-size: .85rem; color: rgba(255,255,255,.72); }
.m1-miss-t { display: block; font-weight: 800; font-size: 1.05rem; line-height: 1.3; }
.m1-slot { display: none; }

/* דף התוצאות */
.m1-view { position: relative; max-width: 46rem; margin: 2.75rem auto 0; padding: 0 1.25rem 3.5rem; }
.m1-qwrap { position: relative; z-index: 3; }
.m1-kick { display: none; }

  .m3-on .m3-step { grid-area: 1 / 1; opacity: 0; font-size: .92rem; line-height: 1.45; }
  .m3-on .m3-step.on { opacity: 1; }
  .m3-on .m3-body { font-size: .8rem; line-height: 1.5; padding: .7rem .85rem .2rem; }
  .m3-on .m3-dpo, .m3-on .m3-cap { display: none; }
  .m3-on .m3-head { padding: .6rem .85rem; gap: .4rem; }
  .m3-on .m3-qq { font-size: .85rem; padding: .25rem .7rem; }
  .m3-on .m3-tag > span { font-size: .72rem; }
  .m3-on .m3-miss { margin: .2rem .85rem .75rem; padding: .45rem .7rem; }
  .m3-on .m3-miss span { font-size: .8rem; }
}

/* ================================================================ רגע 4: ציר הזמן */
.m4 { --side: max(1.25rem, calc((100% - 74rem) / 2)); --mw: 22.5rem; position: relative; }
.m4-stage { position: relative; }
.m4-in { max-width: 72rem; margin: 0 auto; padding: 2rem 1.25rem 1rem; }
.m4-head { margin-bottom: 1.8rem; }
.m4-k { margin: .9rem 0 0; max-width: 52ch; font-size: 1.1rem; line-height: 1.6; color: #5C5C5C; }
.m4-view { overflow-x: auto; padding-bottom: .6rem; }
.m4-rail { position: relative; display: grid; grid-template-columns: repeat(6, var(--mw)); row-gap: .7rem; width: max-content; padding-block: .2rem;
  background-image: repeating-linear-gradient(to left, #E6E6E6 0 1px, transparent 1px var(--mw)); }
.m4-mh { grid-row: 1; padding: .2rem .9rem; font-size: 1.2rem; font-weight: 800; color: #9A9A9A; transition: color .35s ease; }
.m4-mh.lit { color: #141414; }
.m4-flag { grid-row: 2; justify-self: end; align-self: start; width: calc(100% - 1.4rem); margin: 0 .6rem; padding: .55rem .8rem; border-radius: .8rem; background: #141414; color: #fff; font-size: .95rem; font-weight: 700; line-height: 1.35; }
.m4-flag b { display: block; font-size: .74rem; font-weight: 800; color: #FFB72E; }
.m4-flag-big { background: #FFB72E; color: #141414; }
.m4-flag-big b { color: #8A5A05; }
.m4-bar { position: relative; overflow: hidden; margin: 0 .35rem; padding: .55rem .85rem .6rem; border-radius: .8rem; background: #F2F2F2; }
.m4-bar > i { position: absolute; inset: 0; background: #FFB72E; transform-origin: right; transform: scaleX(var(--f, 1)); }
.m4-bt { position: relative; display: block; max-width: min(100%, 30rem); will-change: transform; }
.m4-bt b { display: block; font-size: 1.08rem; font-weight: 800; }
.m4-bt span { display: block; margin-top: .15rem; font-size: .92rem; line-height: 1.4; color: #333; }
.m4-gs { position: relative; }
.m4-bar-g > i { background: #FFE7B8; }
.m4-bar-soft > i { background: #FFE7B8; }
.m4-bar-en > i { background: hsl(39 100% 59% / .55); }
.m4-gs { display: grid !important; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .6rem; margin-top: .5rem !important; }
.m4-gcell { display: flex; flex-direction: column; gap: .35rem; }
.m4-g { display: flex; align-items: center; gap: .45rem; padding: .3rem .5rem; border-radius: .6rem; background: #fff; font-size: .86rem; font-weight: 800; line-height: 1.25; color: #141414; box-shadow: 0 8px 18px -12px rgba(0,0,0,.45); }
.m4-g { font-size: .9rem; }
.m4-g em { flex: none; display: grid; place-items: center; width: 1.45rem; height: 1.45rem; font-style: normal; font-size: .8rem; background: #FFB72E; border-radius: 20% / 20%; }
.m4-rep { grid-row: 7; justify-self: end; display: inline-flex; align-items: center; gap: .45rem; margin: 0 .7rem; font-size: .82rem; font-weight: 800; color: #5C5C5C; }
.m4-rep i { width: .75rem; height: .75rem; background: #FFB72E; border-radius: 20% / 20%; transform: rotate(12deg); }
.m4-ph { display: none; }

.m4-on .m4-in { position: absolute; inset: calc(var(--hh, 64px) + 3vh) 0 3vh; max-width: none; margin: 0; padding: 0; display: flex; flex-direction: column; justify-content: center; }
.m4-on .m4-head { padding-inline: var(--side); margin-bottom: 4vh; }
.m4-on .m4-h { font-size: clamp(2.2rem, 3.8vw, 3.4rem); }
.m4-on .m4-view { overflow: visible; padding: 0; }
.m4-on .m4-rail { margin-inline-start: var(--side); will-change: transform; }
.m4-on .m4-ph { display: block; position: absolute; top: -.3rem; bottom: -.3rem; right: 0; width: 3px; margin-right: -1.5px; border-radius: 3px; background: #141414; z-index: 3; will-change: transform; }
.m4-on .m4-ph::before { content: ''; position: absolute; top: -.35rem; left: 50%; width: .8rem; height: .8rem; margin-left: -.4rem; border-radius: 999px; background: #FFB72E; box-shadow: 0 0 0 3px #fff; }
.m4-on .m4-flag, .m4-on .m4-g, .m4-on .m4-rep { opacity: 0; transform: translateY(-12px) scale(.94); transition: opacity .35s ease, transform .5s cubic-bezier(.34,1.56,.64,1); }
.m4-on .m4-flag.lit, .m4-on .m4-g.lit, .m4-on .m4-rep.lit { opacity: 1; transform: none; }
@media (max-width: 1023.98px) {
  .m4 { --mw: 16.5rem; }
  .m4-on .m4-h { font-size: 1.75rem; text-wrap: balance; }
  .m4-on .m4-h span { display: inline; }
  .m4-on .m4-k { font-size: .9rem; line-height: 1.45; margin-top: .45rem; }
  .m4-on .m4-head { margin-bottom: 1.4rem; }
  .m4-mh { font-size: 1rem; }
  .m4-flag { font-size: .8rem; }
  .m4-bt { max-width: min(100%, 15rem); }
  .m4-bt b { font-size: .9rem; }
  .m4-bt span { font-size: .78rem; }
  .m4-g { font-size: .76rem; padding: .25rem .4rem; }
  .m4-gs { gap: .4rem; }
  .m4-rep { font-size: .74rem; }
}

/* מסכים נמוכים: מחשב נייד וטלפון קטן */
.m4-on .m4-in { justify-content: safe center; }
@media (max-height: 820px) {
  .m4-on .m4-k { display: none; }
  .m4-on .m4-h span { display: inline; }
  .m4-on .m4-h { font-size: clamp(1.6rem, 3vw, 2.5rem); }
  .m4-on .m4-head { margin-bottom: 2.2vh; }
  .m4-on .m4-rail { row-gap: .5rem; }
}
@media (max-width: 1023.98px) and (max-height: 720px) {
  .m2-on .m2-src { display: none; }
  .m2-on .m2-in { bottom: .8rem; }
  .m3-on .m3-h span { display: none; }
  .m3-on .m3-h { font-size: 1.3rem; }
  .m3-on .m3-step { font-size: .84rem; }
  .m3-on .m3-sub, .m3-on .m3-skip { display: none; }
  .m3-on .m3-body { font-size: .74rem; line-height: 1.45; }
  .m3-on .m3-head { padding: .45rem .75rem; }
  .m3-on .m3-c { font-size: .66rem; }
}
@media (max-width: 1023.98px) and (max-height: 720px) {
  .m4-on .m4-h { font-size: 1.45rem; }
  .m4-on .m4-bt span { display: none; }
  .m4-on .m4-flag { padding: .4rem .6rem; }
  .m4-on .m4-head { margin-bottom: .9rem; }
}

   scrollcraft: a scroll-driven interaction runtime
   ----------------------------------------------------------------------------
   Vanilla JS. Zero dependencies. Zero DOM generation.

   The engine does NOT build your page. You author real, semantic HTML and mark
   it up with data-sc-* attributes; the engine reads them and drives them from a
   single scroll value on a single rAF loop. That is deliberate: a runtime that
   generates its own DOM from a config object makes every site it touches look
   identical, which is the failure mode this replaces.

   ---------------------------------------------------------------------------
   ACTS: the unit of scroll time
   ---------------------------------------------------------------------------
     <section data-sc-act="pin" data-sc-span="2.5"> ... </section>

     data-sc-act   scrub | pin | pan | flow   (default: flow)
     data-sc-clip-map="travel" opts a pinned act OUT of full-life clip mapping.
                   By DEFAULT a scrub clip is mapped across the stage's entire
                   on-screen life, not across its pinned travel, because a pinned
                   stage is visible for a viewport BEFORE the pin begins (sliding
                   up into view) and a viewport AFTER it ends (sliding off the
                   top). Mapped to pinned travel, the clip sits on its first
                   frame through the whole entry and its last frame through the
                   whole exit: the reader watches a still photograph while the
                   page moves. Pair it with data-sc-dwell, which moves quickly at
                   the edges and settles in the middle, so the fast motion lands
                   on the two slides and the settle lands inside the pin where
                   the copy is. data-sc-runout is accepted and ignored; it named
                   the old opt-in for the exit half of this.
     data-sc-span  viewport-heights of scroll this act owns. Pinned devices only
                   (scrub/pin/pan). Default 1.5. The engine sets the outer
                   height and sticks the first .sc-stage / [data-sc-stage] child.

     Every act exposes a normalized progress p (0..1):
       pinned  p = (y - top) / (height - vh)
       flow    p = (y + vh - top) / (height + vh)
     and publishes it as --sc-p on the act element, so CSS can read it too.

   ---------------------------------------------------------------------------
   DEVICES: what p drives
   ---------------------------------------------------------------------------
     data-sc-scrub            on <video>. p scrubs currentTime. Blob-loaded, so
                              it seeks without needing HTTP range support.
     data-sc-sequence="a/{i}.webp:120:1"
                              on <canvas>. p scrubs an image sequence
                              (path template : frameCount : startIndex).
     data-sc-pan="0.6"        on a wide rail inside data-sc-act="pan". p drives
                              horizontal travel. Value = extra travel multiplier.
     data-sc-parallax="-0.2"  translateY by rate * act-progress * viewport.
                              Negative = moves up faster than scroll (recedes).
     data-sc-cue="0.1 0.5"    opacity/rise keyed to p. One value = enter+hold.
                              Two = enter..leave. Add a third for the hold point.
     data-sc-kinetic="lines"  lines | words | chars. Splits the element and
                              staggers its reveal across the cue window.
     data-sc-reveal="up"      up | down | left | right | iris. clip-path wipe.
     data-sc-count="0 4200"   number bloom across the cue window. Outside any
                              act it ticks up once on entry instead, over
                              data-sc-count-ms (default 1400).
     data-sc-in               flow-section reveal, fires once on entry via
                              IntersectionObserver (cheaper, and content that
                              re-hides on scroll-up is a defect, not an effect).
                              data-sc-stagger="60" on the parent staggers kids.
     data-sc-drift="#07090c"  page background interpolates toward this colour
                              while the act is on screen.

   ---------------------------------------------------------------------------
   WORLDFLIGHT: the page mode for one continuous flight
   ---------------------------------------------------------------------------
     <div data-sc-mode="worldflight" data-sc-seam="0.12">
       <div data-sc-world>
         <div data-sc-segment data-sc-w="1.4" data-sc-linger="0.3"
              data-sc-waypoint="Approach">
           <img class="sc-world__poster" src="p1.webp" alt="">
           <video data-sc-src="leg1.mp4" data-sc-src-mobile="leg1-m.mp4"></video>
         </div>
         ... more segments, in flight order ...
       </div>
       <div data-sc-world-copy>
         <div class="sc-world__scrim sc-scrim sc-scrim--band"></div>
         <div data-sc-copy data-sc-window="hero"> ... </div>
         <div data-sc-copy data-sc-window="0.34 0.56"> ... </div>
         <div data-sc-copy data-sc-window="finale"> ... </div>
       </div>
       <div data-sc-spacer aria-hidden="true"></div>
     </div>

   chapters and the wrong shape for one continuous camera move: the reader hits
   the end of an act, the stage unsticks, a static page slides past, and the next
   act starts the whole thing again. Worldflight removes the seams by removing
   the blocks. There is ONE fixed stage for the entire page. The only element in
   document flow is a spacer, whose height the engine sets to the sum of the
   segment weights plus one viewport so the last flight can finish. Scroll drives
   the film timeline and the overlay opacity. Nothing else moves.

     data-sc-w        viewport-heights this segment owns. Default 1.3.
     data-sc-linger   dwell remap for this leg only (see lingerEase). Max 0.6.
     data-sc-seam     crossfade band, in viewport-heights of scroll. Default 0.12.
     data-sc-waypoint label published on --sc-seg / the sc:waypoint event, so a
                      page can draw its own route rail. The engine draws none.
     data-sc-window   on a copy block: "hero" | "finale" | "from to [in [out]]"
                      as fractions of the WHOLE track.

   Every clip stays mounted for the life of the page. Segments crossfade by
   opacity over the seam band; nothing ever swaps a src, because a src swap is a
   black frame and a black frame is the cut this mode exists to avoid.

   ---------------------------------------------------------------------------
   POINTER: interactivity that isn't scroll
   ---------------------------------------------------------------------------
     data-sc-tilt="8"         3D tilt toward the pointer, spring-damped, degrees.
     data-sc-magnet="0.35"    element drifts toward the pointer inside its bounds.
     data-sc-spotlight        publishes --sc-mx/--sc-my (0..1) for a light that
                              follows the pointer across the surface.
   All three are gated to (hover: hover) and (pointer: fine) and disabled under
   prefers-reduced-motion. Touch never fires them.

   ---------------------------------------------------------------------------
   REDUCED MOTION
   ---------------------------------------------------------------------------
   Fewer and gentler, not zero. Cues still fade (comprehension survives), but
   translation collapses, video clips are never fetched (the poster holds), and
   pointer devices are inert. A worldflight still tells its whole story: the
   posters cross-dissolve through the same seams and the same copy windows.

   ---------------------------------------------------------------------------
   THE PLAYHEAD
   ---------------------------------------------------------------------------
   Every scrub clip on the page, act or worldflight, is driven by one smoothed
   playhead. Scroll only ever writes a TARGET; a standalone rAF loop walks the
   current time toward it at a fixed fraction per frame (data-sc-lerp, default
   0.18; 1.0 under reduced motion, which is no smoothing at all). Writes are
   gated by a deadband and skipped while the decoder is still seeking. Without
   the smoothing a trackpad flick reads as a stutter, because wheel events do
   not arrive at a constant rate and a 1:1 write reproduces every gap in them.
   ========================================================================== */

  // consecutive clips are untouched and the chain stays invisible.
  function dwell(x, L) {

    L = clamp01(L);
    var c = x - 0.5;
    return (1 - L) * x + L * (4 * c * c * c + 0.5);

  // leg are still exactly the frames the seam law matched, and the chain between
  // legs stays invisible no matter how much dwell a leg asks for.

    L = clamp(L, 0, 0.6);
    var c = x - 0.5;
    return (1 - L) * x + L * (4 * c * c * c + 0.5);

   עם תנועה מופחתת לא קורה כלום, וכל רגע נשאר תוכן רגיל ונייח. אחרת כל רגע מוסיף לעצמו מחלקת on,
   התכונות הניטרליות data-m-* הופכות לתכונות של המנוע (data-sc-*), והמנוע מצמיד את הבמה.
   את מה שקורה על הבמה מניע הקוד כאן, לפי התקדמות הגלילה בתוך הרגע (0 עד 1). */
var M = {
  clamp: function (x, a, b) { return x < a ? a : x > b ? b : x; },
  seg: function (p, a, b) { return M.clamp((p - a) / (b - a), 0, 1); },
  lerp: function (a, b, t) { return a + (b - a) * t; },
  out: function (t) { return 1 - Math.pow(1 - t, 3); },
  inOut: function (t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; },
  sine: function (t) { return -(Math.cos(Math.PI * t) - 1) / 2; },
  back: function (t) { var c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  // ההתקדמות בתוך רגע מוצמד: 0 כשהבמה נצמדת, 1 כשהיא משתחררת

  fmt: function (n) { return Math.round(n).toLocaleString('en-US'); }

function initMoments(reduce) {
  if (reduce || !window.ScrollCraft) return;
  var head = document.querySelector('header');
  var setHH = function () { document.documentElement.style.setProperty('--hh', (head ? head.offsetHeight : 64) + 'px'); };
  setHH();
  var mods = [momentSearch(), momentDemand(), momentAnswer(), momentPlan()].filter(Boolean);
  if (!mods.length) return;
  [].forEach.call(document.querySelectorAll('[data-m-act]'), function (el) {
    el.setAttribute('data-sc-act', el.getAttribute('data-m-act'));
    el.setAttribute('data-sc-span', el.getAttribute('data-m-span'));
    var st = el.querySelector('[data-m-stage]');
    if (st) st.setAttribute('data-sc-stage', '');

  var engine = ScrollCraft.mount(document);
  var queued = false;
  // מעדכנים רק רגע שקרוב למסך, ועוד פעם אחת כשהוא יוצא ממנו כדי שיינעל על ההתחלה או על הסוף

    queued = false;
    mods.forEach(function (m) {
      var r = m.el.getBoundingClientRect(), near = r.bottom > -innerHeight * .5 && r.top < innerHeight * 1.5;
      if (all === true || near || m.near) m.update();

  addEventListener('resize', function () {
    // בטלפון שורת הכתובת משנה את הגובה תוך כדי גלילה, ואז אין צורך לפרוס מחדש
    if (innerWidth === lastW && Math.abs(innerHeight - lastH) < 140) return;
    lastW = innerWidth; lastH = innerHeight;
    relayout();
  });
  relayout();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
  addEventListener('load', relayout);
}

/* רגע 1: שורת החיפוש מקלידה, התוצאות עולות, הדף נוטה לאחור וצולל עד תוצאה 100,
   ובסוף המצלמה מתרחקת: התוצאות מתכווצות לכרטיס, ונכנסים דן, הדירוגים והכותרת. */
function momentSearch() {
  var sec = document.getElementById('m1');

  var stage = q('.m1-stage'), view = q('.m1-view'), qwrap = q('.m1-qwrap'), kick = q('.m1-kick'), vol = q('.m1-vol');
  var depth = q('.m1-depth'), sheet = q('.m1-sheet'), endEl = q('.m1-end'), slot = q('.m1-slot');
  var hud = q('.m1-hud'), nEl = q('[data-m1-n]'), oEl = q('[data-m1-o]'), qEl = q('[data-m1-q]');
  var portrait = q('.m1-portrait'), lines = qa('.m1-hl'), badges = qa('.m1-badges li'), miss = q('.m1-miss');
  var rows = qa('.m1-row'), L = null, lastN = -1, lastDone = null;

  var full = qEl.textContent, typer = null;
  function finishTyping() { if (typer) { clearInterval(typer); typer = null; } qEl.textContent = full; vol.style.opacity = '1'; }
  if (M.prog(sec) < .02 && sec.getBoundingClientRect().top >= 0) {
    qEl.textContent = ''; vol.style.opacity = '0';
    var i = 0;
    setTimeout(function () {
      if (qEl.textContent === full) return;

    }, 500);
  }

  function layout() {
    view.style.transform = ''; qwrap.style.transform = ''; sheet.style.transform = '';
    var sr = stage.getBoundingClientRect(), vr = view.getBoundingClientRect(), qr = qwrap.getBoundingClientRect();
    var dh = depth.clientHeight, wide = innerWidth >= 1024, hh = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hh')) || 64;
    L = { dh: dh, scan: Math.round(dh * (wide ? .42 : .38)) };
    L.rows = rows.map(function (r) { return r.offsetTop + r.offsetHeight / 2; });
    L.ranks = rows.map(function (r) { return +r.getAttribute('data-r'); });
    L.firm = rows.map(function (r) { return r.hasAttribute('data-firm'); });
    L.r10 = L.rows[9];
    L.end = endEl.offsetTop + endEl.offsetHeight / 2;
    L.endH = endEl.offsetHeight;

    // היעד של ההתרחקות: המשבצת בעמודת הכותרת. בטלפון אין משבצת, והתוצאות פשוט מתרחקות ונעלמות

    kick.style.opacity = (1 - M.seg(p, .03, .08)).toFixed(3);

    // איזו נקודה בדף התוצאות יושבת על קו הסריקה

    var e6 = M.inOut(M.seg(p, .8, .92));

    var tilt = 54 * (M.inOut(M.seg(p, .32, .47)) - M.inOut(M.seg(p, .62, .76)));
    sheet.style.transformOrigin = '50% ' + f.toFixed(1) + 'px';
    sheet.style.transform = 'translate3d(0,' + (L.scan - f).toFixed(1) + 'px,0) rotateX(' + tilt.toFixed(2) + 'deg)';

    var lit = M.seg(p, .13, .22) * (1 - M.seg(p, .76, .82));

    var n = 0;
    for (var i = 0; i < L.rows.length; i++) if (L.rows[i] <= f + 2) n = L.ranks[i];

      for (var k = 0; k < rows.length; k++) if (L.firm[k]) rows[k].classList.toggle('seen', L.rows[k] <= f + 2);

    if (L.slot) {

      view.style.transform = 'translate3d(' + (L.pdx * e6).toFixed(1) + 'px,' + (L.pdy * e6).toFixed(1) + 'px,0) rotate(' + (-2.2 * e6).toFixed(3) + 'deg) scale(' + (1 + (L.ps - 1) * e6).toFixed(4) + ')';

      var g = M.inOut(M.seg(p, .78, .84));
      view.style.opacity = (1 - g).toFixed(3);
      view.style.transform = 'translate3d(0,' + (-60 * g).toFixed(1) + 'px,0) scale(' + (1 - .3 * g).toFixed(4) + ')';
    }
    view.style.setProperty('--card', e6.toFixed(3));

    var a = M.out(M.seg(p, .81, .9));
    show(portrait, a, 'translate3d(' + (7 * (1 - a)).toFixed(2) + '%,0,0) scale(' + (1.05 - .05 * a).toFixed(4) + ')');
    lines.forEach(function (el, j) {
      var b = M.out(M.seg(p, .84 + j * .025, .9 + j * .025));
      show(el, b, 'translate3d(0,' + (30 * (1 - b)).toFixed(1) + 'px,0)');
    });
    badges.forEach(function (el, j) {
      var b = M.seg(p, .88 + j * .02, .92 + j * .02);
      show(el, b, 'scale(' + (.6 + .4 * M.back(b)).toFixed(4) + ')');
    });

    show(miss, c, 'translate3d(0,' + (18 * (1 - c)).toFixed(1) + 'px,0)');
  }

  return { el: sec, layout: layout, update: update };
}

/* רגע 2: נקודה לכל חיפוש חודשי. שדה אחיד, אחר כך עשרה גושים לפי נושא, שלושת הנושאים שבחוץ נושרים,
   GDPR ו-HIPAA זזים הצידה, וחמשת הנושאים של המדריכים זורמים לחמישה עמודים. הכול על canvas אחד. */
function momentDemand() {

  sec.classList.add('m2-on');
  var data = JSON.parse(sec.getAttribute('data-m2'));
  var field = sec.querySelector('.m2-field'), box = sec.querySelector('.m2-labels'), steps = [].slice.call(sec.querySelectorAll('.m2-step'));
  var ctx = canvas.getContext('2d');

  // מחולל מספרים קבוע, כדי שהשדה ייראה אותו דבר בכל טעינה
  var seed = 1314;
  var rnd = function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  var kind = new Uint8Array(N), delay = new Float32Array(N), perm = new Uint32Array(N);
  data.forEach(function (d) { for (var j = 0; j < d.v; j++) kind[d.start + j] = d.k === 'new' ? 0 : d.k === 'fix' ? 1 : 2; });
  for (var i = 0; i < N; i++) { delay[i] = rnd(); perm[i] = i; }

  var lbBlocks = [], lbBars = [], lbFix = null;

  // רשת שממלאת מלבן, מימין לשמאל. bottom: מלמטה למעלה, כמו עמודה בגרף
  function grid(n, x, y, w, h, s, bottom) {

    else { cols = Math.max(1, Math.round(Math.sqrt(n * w / h))); rows = Math.ceil(n / cols); s = Math.min(w / cols, h / rows); }

      var c = j % cols, rr = Math.floor(j / cols);

        var lw = el.offsetWidth, lh = el.offsetHeight;

    // ד. GDPR ו-HIPAA זזים הצידה: בצד שמאל במחשב, ופס עליון בטלפון
    var fixes = data.filter(function (d) { return d.k === 'fix'; }), fsum = fixes.reduce(function (a, d) { return a + d.v; }, 0);
    var fx, fy, fw, fh, fg;
    if (wide) { fw = W * .2; fg = grid(fsum, 0, eTop, fw, eh, s, true); fx = 0; fh = fg.h; fy = eBot - fh; }
    else { fw = W; fg = grid(fsum, 0, 26, fw, H * .3 - 40, 0, false); fx = 0; fy = 26; fh = fg.h; }
    var n0 = 0;
    fixes.forEach(function (d) { for (var q = 0; q < d.v; q++) fg.at(n0 + q, D, (d.start + q) * 2); n0 += d.v; });
    lbFix = label('m2-lb m2-lb-fix', 'כבר כתבתם: GDPR ו-HIPAA<span class="num">' + M.fmt(fsum) + '</span>');
    if (wide) place(lbFix, Math.max(0, fx + fw - lbFix.offsetWidth), fy - lbFix.offsetHeight - 8);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    var T1 = M.seg(p, .1, .34), Tc = M.seg(p, .16, .3), Tf = M.seg(p, .56, .68), Te = M.seg(p, .68, .9);
    var s0 = M.lerp(dA, dB, M.inOut(T1)), sN = M.lerp(s0, dE, M.inOut(Te)), sF = M.lerp(s0, dE, M.inOut(Tf));
    var pN = new Path2D(), pF = new Path2D(), pO = [], NB = 8;
    for (var b = 0; b < NB; b++) pO.push(new Path2D());
    for (var i = 0, k = 0; i < N; i++, k += 2) {
      var d = delay[i], x = A[k], y = A[k + 1];
      if (T1 > 0) {
        var tb = T1 >= 1 ? 1 : M.inOut(M.clamp((T1 - d * .45) / .55, 0, 1));
        x += (B[k] - x) * tb; y += (B[k + 1] - y) * tb;
      }
      var kd = kind[i];
      if (kd === 2) {
        var tf = M.seg(p, .38 + d * .12, .48 + d * .12);
        if (tf >= 1) continue;
        y += tf * tf * H * 1.1; x += (d - .5) * tf * 40;
        pO[Math.min(NB - 1, Math.floor((1 - tf) * NB))].rect(x - s0 / 2, y - s0 / 2, s0, s0);
      } else if (kd === 1) {
        if (Tf > 0) { var tt = Tf >= 1 ? 1 : M.inOut(M.clamp((Tf - d * .4) / .6, 0, 1)); x += (D[k] - x) * tt; y += (D[k + 1] - y) * tt; }
        pF.rect(x - sF / 2, y - sF / 2, sF, sF);
      } else {
        if (Te > 0) { var te = Te >= 1 ? 1 : M.inOut(M.clamp((Te - d * .45) / .55, 0, 1)); x += (E[k] - x) * te; y += (E[k + 1] - y) * te; }
        pN.rect(x - sN / 2, y - sN / 2, sN, sN);
      }
    }
    var c = M.inOut(Tc);
    ctx.fillStyle = mix(COL.base, COL.out, c);
    for (b = 0; b < NB; b++) { ctx.globalAlpha = (b + .5) / NB; ctx.fill(pO[b]); }
    ctx.globalAlpha = 1;
    ctx.fillStyle = mix(COL.base, COL.fix, c); ctx.fill(pF);
    ctx.fillStyle = mix(COL.base, COL.neu, c); ctx.fill(pN);
  }

  function update(force) {
    if (!W) return;
    var p = M.prog(sec);
    if (!force && Math.abs(p - lastP) < .0004) return;
    lastP = p;
    draw(p);
    var inB = M.seg(p, .26, .32);
    lbBlocks.forEach(function (o) {
      var out = o.k === 'out' ? M.seg(p, .37, .42) : o.k === 'fix' ? M.seg(p, .55, .59) : M.seg(p, .66, .7);
      o.el.style.opacity = (inB * (1 - out)).toFixed(3);
    });
    if (lbFix) lbFix.style.opacity = M.seg(p, .64, .7).toFixed(3);
    lbBars.forEach(function (el, j) {
      var a = M.out(M.seg(p, .8 + j * .015, .86 + j * .015));
      el.style.opacity = a.toFixed(3);
      el.style.translate = '0 ' + (10 * (1 - a)).toFixed(1) + 'px';
    });
    var st = p < .36 ? 0 : p < .56 ? 1 : p < .68 ? 2 : 3;
    if (st !== lastStep) { lastStep = st; steps.forEach(function (el, j) { el.classList.toggle('on', j === st); }); }
  }

  return { el: sec, layout: layout, update: function () { update(false); } };
}

/* רגע 3: הסיכום של גוגל נכתב מילה אחר מילה, המקורות מופיעים כשהטקסט מגיע אליהם, שני המקורות של דן נדלקים,
   ובסוף, תחת התווית "המחשה של המטרה", המקור הראשון מתחלף ב-or-hof.com */
function momentAnswer() {
  var sec = document.getElementById('m3');
  if (!sec) return null;
  sec.classList.add('m3-on');
  var body = sec.querySelector('.m3-body'), steps = [].slice.call(sec.querySelectorAll('.m3-step')), tagB = sec.querySelector('.m3-tag-b');
  // מפרקים את הטקסט למילים, כדי שיופיעו אחת אחת. המקורות נשארים יחידה אחת
  var items = [];
  (function walk(node) {
    [].slice.call(node.childNodes).forEach(function (n) {
      if (n.nodeType === 3) {
        var parts = n.textContent.split(/(\s+)/), frag = document.createDocumentFragment();
        parts.forEach(function (w) {
          if (!w) return;
          if (/^\s+$/.test(w)) { frag.appendChild(document.createTextNode(w)); return; }
          var sp = document.createElement('span'); sp.className = 'm3-w'; sp.textContent = w; frag.appendChild(sp); items.push(sp);
        });
        n.parentNode.replaceChild(frag, n);
      } else if (n.nodeType === 1) {
        if (n.classList.contains('m3-c')) items.push(n);
        else if (n.classList.contains('m3-cites')) walk(n);
        else if (!(n.classList.contains('m3-dpo') && getComputedStyle(n).display === 'none')) walk(n);
      }
    });
  })(body);
  var shown = -1, state = '';
  function update() {
    var p = M.prog(sec);
    var k = Math.round(items.length * M.seg(p, .02, .42));
    if (k !== shown) {
      for (var i = 0; i < items.length; i++) items[i].classList.toggle('v', i < k);
      shown = k;
    }
    var st = p < .43 ? 0 : p < .6 ? 1 : p < .76 ? 2 : 3;
    var s = String(st);
    if (s !== state) {
      state = s;
      sec.classList.toggle('dan', st >= 1);
      sec.classList.toggle('miss', st >= 2);
      sec.classList.toggle('goal', st >= 3);
      tagB.setAttribute('aria-hidden', st >= 3 ? 'false' : 'true');
      steps.forEach(function (el, j) { el.classList.toggle('on', j === st); });
    }
  }
  return { el: sec, layout: function () {}, update: update };
}

/* רגע 4: ציר הזמן נע ימינה (עברית), סמן הזמן עובר על החודשים, הפסים מתמלאים מימין,
   המדריכים נוחתים בחודש שלהם ואבני הדרך ננעצות בסוף החודש */
function momentPlan() {
  var sec = document.getElementById('m4');
  if (!sec) return null;
  sec.classList.add('m4-on');
  var rail = sec.querySelector('.m4-rail'), ph = sec.querySelector('.m4-ph');
  var bars = [].slice.call(sec.querySelectorAll('.m4-bar')).map(function (el) { return { el: el, t: el.querySelector('.m4-bt'), a: +el.getAttribute('data-from'), b: +el.getAttribute('data-to') }; });
  var pts = [].slice.call(sec.querySelectorAll('[data-at]')).map(function (el) { return { el: el, at: +el.getAttribute('data-at'), on: null }; });
  var over = 0, W = 0, right0 = 0, side = 20;
  function layout() {
    rail.style.transform = '';
    bars.forEach(function (b) { b.t.style.transform = ''; });
    var r = rail.getBoundingClientRect();
    // לכל פס: איפה הקצה הימני של הטקסט ביחס לקצה של המסילה, וכמה מקום יש לו לזוז בתוך הפס
    bars.forEach(function (b) {
      var br = b.el.getBoundingClientRect(), tr = b.t.getBoundingClientRect();
      b.off = r.right - tr.right; b.room = Math.max(0, tr.left - br.left - 12);
    });
    side = parseFloat(getComputedStyle(rail).marginRight) || 20;
    W = r.width; right0 = r.right;
    // כמה המסילה צריכה לזוז ימינה כדי שהקצה השמאלי שלה יגיע לשוליים
    over = Math.max(0, side - r.left);
  }
  function update() {
    var p = M.prog(sec);
    // קודם הקו עובר על החודשים שעל המסך ומצייר אותם, ואחר כך נעצר בשוליים והמסילה זזה מתחתיו
    var sweep = M.inOut(M.seg(p, .02, .24)), tx = over * M.seg(p, .26, .94);
    var xl = M.lerp(right0, side, sweep), d = right0 + tx - xl, m = d / (W / 6);
    rail.style.transform = 'translate3d(' + tx.toFixed(1) + 'px,0,0)';
    ph.style.transform = 'translate3d(' + (-d).toFixed(1) + 'px,0,0)';
    var edge = innerWidth - side;
    bars.forEach(function (b) {
      b.el.style.setProperty('--f', M.clamp((m - b.a) / (b.b - b.a), 0, 1).toFixed(3));
      // כשתחילת הפס כבר מחוץ למסך, הטקסט גולש שמאלה בתוכו ונשאר גלוי
      var push = M.clamp(right0 + tx - b.off - edge, 0, b.room);
      b.t.style.transform = push ? 'translate3d(' + (-push).toFixed(1) + 'px,0,0)' : '';
    });
    pts.forEach(function (o) { var on = m >= o.at; if (on !== o.on) { o.on = on; o.el.classList.toggle('lit', on); } });
  }
  return { el: sec, layout: layout, update: update };
}

(function(){
  var app=document.getElementById('app');
  function fail(){app.innerHTML='<p style="text-align:center;padding:6rem 1rem;color:#5C5C5C;font-size:1.1rem">הקישור לא שלם. פתחו את הקישור המלא כפי שנשלח אליכם.</p>'}
  function b64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  var m=location.hash.match(/k=([A-Za-z0-9_-]+)/);
  if(!m||!window.crypto||!crypto.subtle){fail();return}
  var blob=b64u(document.getElementById('payload').textContent.trim());
  crypto.subtle.importKey('raw',b64u(m[1]),'AES-GCM',false,['decrypt'])
    .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:blob.slice(0,12)},k,blob.slice(12))})
    .then(function(buf){app.innerHTML=new TextDecoder().decode(buf);initPage()})
    .catch(fail);
})();
