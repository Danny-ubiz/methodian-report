wxErTJcR4y_4Tn4HXWR31ntmeboyGWlkSC0Ua3eSNBVKCNlJbbwotLNoZUyWPkRZdVvBZslLQKw-QJ44cimbSIh-lVH3QJRNMjDq1YLf3kWIAc57q9-9h_4qV1R1ZdzQZ9MhLvfZzbYIZ8f7b</script><script>/* התנהגות העמוד: תזוזה בגלילה, מצגת תמונות בפתיח, מספרים שרצים, וגרף החודשים עם חלונית בריחוף */
function initPage() {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) document.documentElement.classList.add('motion');
  var fmt = function (n) { return n.toLocaleString('en-US'); };

  function countUp(el) {
    var to = +el.getAttribute('data-count');
    if (reduce) { el.textContent = fmt(to); return; }
    var start = performance.now(), dur = 1300;
    (function tick(now) {
      var t = Math.min(1, (now - start) / dur), eased = 1 - Math.pow(1 - t, 3);
      el.textContent = fmt(Math.round(to * eased));
      if (t < 1) requestAnimationFrame(tick);
    })(start);
  }

  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        e.target.classList.add('in');
        if (e.target.hasAttribute('data-count')) countUp(e.target);
        io.unobserve(e.target);
      });
    }, { threshold: 0.15 });
    document.querySelectorAll('.rv, [data-count]').forEach(function (el) { io.observe(el); });
  }

  var box = document.querySelector('[data-slides]');
  if (box && !reduce) {
    var slides = box.querySelectorAll('.slide'), dots = box.querySelectorAll('[data-dots] span'), i = 0;
    var ON = 'block h-1.5 w-6 rounded-full bg-primary transition-all duration-500';
    var OFF = 'block h-1.5 w-1.5 rounded-full bg-white/60 transition-all duration-500';
    setInterval(function () {
      slides[i].classList.remove('on'); dots[i].className = OFF;
      i = (i + 1) % slides.length;
      slides[i].classList.add('on'); dots[i].className = ON;
    }, 4500);
  }

  var chart = document.querySelector('[data-chart]');
  if (chart) {
    var tip = chart.querySelector('[data-tip]');
    chart.querySelectorAll('.bar').forEach(function (b) {
      var bar = b.querySelector('i');
      function show() {
        tip.textContent = b.getAttribute('aria-label');
        tip.hidden = false;
        var cr = chart.getBoundingClientRect(), r = bar.getBoundingClientRect();
        var x = Math.min(Math.max(r.left - cr.left + r.width / 2, 80), cr.width - 80);
        tip.style.left = x + 'px';
        tip.style.top = Math.max(r.top - cr.top - 10, 36) + 'px';
      }
      function hide() { tip.hidden = true; }
      b.addEventListener('pointerenter', show); b.addEventListener('pointerleave', hide);
      b.addEventListener('focus', show); b.addEventListener('blur', hide);
    });
  }

  // תנועת החתימה: הגלילה סורקת את דף התוצאות של גוגל שורה אחרי שורה, עד המשבצת הריקה של אור-חוף
  var scan = document.querySelector('[data-scan]');
  if (scan && !reduce) {
    var track = scan.querySelector('.scan-track'), stage = scan.querySelector('.scan-stage');
    var cols = scan.querySelectorAll('[data-scan-col]'), rows = [].slice.call(scan.querySelectorAll('.serp-row'));
    var nEl = scan.querySelector('[data-scan-n]'), fEl = scan.querySelector('[data-scan-f]');
    var head = document.querySelector('header'), last = -1, queued = false;
    var setNum = function (el, v) { if (el && el.textContent !== v) { el.textContent = v; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); } };
    scan.classList.add('scan-on');
    function layout() {
      var hh = head ? head.offsetHeight : 64, tall = 0;
      [].forEach.call(cols, function (c) { tall = Math.max(tall, c.offsetHeight); });
      scan.classList.toggle('scan-pin', innerWidth >= 1024 && tall + 48 <= innerHeight - hh);
      stage.style.top = hh + 'px';
      last = -1; update();
    }
    function update() {
      queued = false;
      var k = 0;
      if (scan.classList.contains('scan-pin')) {
        var hh = head ? head.offsetHeight : 64, r = track.getBoundingClientRect();
        var p = Math.min(1, Math.max(0, (hh - r.top) / Math.max(1, r.height - (innerHeight - hh))));
        k = Math.min(rows.length, Math.floor(p * (rows.length + 1.5)));
      } else {
        rows.forEach(function (row, i) { if (row.getBoundingClientRect().top < innerHeight * 0.72) k = i + 1; });
      }
      if (k === last) return;
      last = k;
      var firms = 0;
      rows.forEach(function (row, i) {
        row.classList.toggle('seen', i < k);
        row.classList.toggle('now', i === k - 1);
        if (i < k && row.hasAttribute('data-firm')) firms++;
      });
      scan.classList.toggle('scan-done', k >= rows.length);
      setNum(nEl, k >= rows.length ? '100' : String(k));
      setNum(fEl, String(firms));
    }
    addEventListener('scroll', function () { if (!queued) { queued = true; requestAnimationFrame(update); } }, { passive: true });
    addEventListener('resize', layout);
    layout();
  }
}

(function(){
  var app=document.getElementById('app');
  function fail(){app.innerHTML='<p style="text-align:center;padding:6rem 1rem;color:#5C5C5C;font-size:1.1rem">הקישור לא שלם. פתחו את הקישור המלא כפי שנשלח אליכם.</p>'}
  function b64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  var m=location.hash.match(/k=([A-Za-z0-9_-]+)/);
  if(!m||!window.crypto||!crypto.subtle){fail();return}
  var blob=b64u(document.getElementById('payload').textContent.trim());
  crypto.subtle.importKey('raw',b64u(m[1]),'AES-GCM',false,['decrypt'])
    .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:blob.slice(0,12)},k,blob.slice(12))})
    .then(function(buf){app.innerHTML=new TextDecoder().decode(buf);initPage()})
    .catch(fail);
})();
