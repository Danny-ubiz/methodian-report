<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FFFFFF">
<title>תוכנית עבודה</title>
<meta property="og:title" content="תוכנית עבודה">
<meta property="og:description" content="יוביז פרסום">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F5B424'/%3E%3C/svg%3E">
<style>/* עמוד תוכנית עבודה לאתר חדש. ה-CSS יושב מחוץ לחלק המוצפן, ולכן אין בו שם לקוח.
   מיתוג UBIZ לפי references/design/brands/BRANDS.md: צהוב, שחור, לבן, אפור בהיר ודגש כתום אחד.
   אין מסגרות. מפרידים בגוון רקע ובצל רך. פינות כרטיס 24, כפתורים עגולים, רווחים בכפולות של 8.
   הצבעים של הלקוח מופיעים רק בתוך ההדמיה של האתר שלהם (המחלקות ms ו-mp). */
:root{
  --y:#F5B424;--k:#1B1A17;--w:#FFFFFF;--g:#F2F1EE;--a:#F99406;
  --k70:rgb(27 26 23 / .72);--k50:rgb(27 26 23 / .5);--k10:rgb(27 26 23 / .08);
  --w70:rgb(255 255 255 / .72);--w12:rgb(255 255 255 / .1);
  --sh:0 12px 40px rgb(27 26 23 / .08);--sh2:0 24px 64px rgb(27 26 23 / .16);
  --r:24px;
  --hd:64px;
}
*{box-sizing:border-box}
html{scroll-behavior:auto;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--w);color:var(--k);font-family:'FbJabutinski',system-ui,sans-serif;font-size:17px;line-height:1.55;font-weight:400;overflow-x:hidden}
img{max-width:100%;display:block}
h1,h2,h3,h4,h5,p,ul,ol,figure{margin:0;padding:0}
ul,ol{list-style:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;padding:0;cursor:pointer;border:none}
main{overflow-x:clip}
button,a{-webkit-tap-highlight-color:transparent}
.wrap{max-width:1200px;margin-inline:auto;padding-inline:24px}
.cap{font-size:14px;line-height:1.4;color:var(--k70);margin-top:16px}
.cap.center{text-align:center}

/* ---------------- כפתורים ---------------- */
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;font-weight:900;font-size:16px;line-height:1;padding:16px 28px;transition:transform .2s ease}
.btn:hover{transform:translateY(-2px)}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.btn-y{background:var(--y);color:var(--k)}
.btn-k{background:var(--k);color:var(--w)}
.btn-sm{font-size:14px;padding:12px 20px}

/* ---------------- הכותרת העליונה ---------------- */
.hd{position:sticky;top:0;z-index:50;padding-top:env(safe-area-inset-top,0px);background:rgb(255 255 255 / .94);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);transition:box-shadow .3s}
.hd.sc{box-shadow:0 8px 24px rgb(27 26 23 / .06)}
.hd-in{height:var(--hd);display:flex;align-items:center;gap:24px}
.hd-logo img{height:32px;width:auto}
.tabs{display:flex;gap:4px;margin-inline-start:auto;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-size:15px;font-weight:700;color:var(--k70);padding:8px 14px;border-radius:999px;white-space:nowrap;transition:background .25s,color .25s}
.tab:hover{color:var(--k)}
.tab.on{background:var(--g);color:var(--k)}
.hd .btn{flex:none}
.hd-p{position:absolute;inset-inline:0;bottom:0;height:3px;background:var(--y);transform-origin:right;transform:scaleX(0)}

/* ---------------- הופעה בגלילה ---------------- */
.mo .rv{opacity:0;transform:translateY(32px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--d,0) * 90ms)}
.mo .rv.in{opacity:1;transform:none}

/* ---------------- פתיח ---------------- */
.hero{position:relative;padding-block:56px 64px;overflow:hidden}
.blob{position:absolute;border-radius:50%;background:rgb(245 180 36 / .14);pointer-events:none;will-change:transform}
.b1{width:520px;height:520px;top:-200px;left:-160px}
.b2{width:360px;height:360px;bottom:-120px;right:-120px}
.hero .wrap{position:relative}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:32px;margin-bottom:48px}
.ttl{display:flex;flex-direction:column;gap:4px}
.ttl .k{display:inline-flex;align-items:center;gap:8px;font-size:18px;font-weight:700;margin-bottom:8px}
.ttl .k i{width:14px;height:14px;border-radius:4px;background:var(--y)}
.ttl .l1,.ttl .l2{font-size:56px;line-height:1.1;font-weight:900}
.ttl .l2 em{font-style:normal;position:relative;z-index:0;white-space:nowrap}
.ttl .l2 em::before{content:"";position:absolute;z-index:-1;inset-inline:-6px;bottom:4px;height:42%;background:var(--y);border-radius:8px;transform-origin:right;transform:scaleX(1)}
.mo .ttl .l2 em::before{transform:scaleX(0);transition:transform 1s cubic-bezier(.7,0,.2,1) .5s}
.mo .ttl.in .l2 em::before{transform:scaleX(1)}
.ttl .l3{font-size:28px;line-height:1.25;font-weight:700;margin-top:8px}
.logo-card{flex:none;background:var(--w);border-radius:var(--r);box-shadow:var(--sh);padding:24px 32px}
.logo-card img{height:76px;width:auto}
.hero-body{display:grid;grid-template-columns:5fr 7fr;gap:48px;align-items:start}
.get{background:var(--g);border-radius:var(--r);padding:32px}
.get-lead{font-size:21px;line-height:1.4;font-weight:700;margin-bottom:24px}
.get h3{font-size:14px;font-weight:700;color:var(--k70);margin-bottom:12px}
.get .btn{margin-top:32px}

/* רשימות */
.bl li{position:relative;padding-inline-start:28px;margin-bottom:14px;font-size:17px;line-height:1.5}
.bl li::before{content:"";position:absolute;inset-inline-start:0;top:.48em;width:12px;height:12px;border-radius:4px;background:var(--y)}
.bl li:last-child{margin-bottom:0}
.bl-row{display:flex;flex-wrap:wrap;gap:12px 40px}
.bl-row li{margin:0}
.bl-k li{color:var(--w70)}
.bl-k2 li::before{background:var(--k)}

/* ---------------- ההדמיה בפתיח: מחשב, טלפון ושלוש שפות ---------------- */
.hv{position:relative}
.dev{position:relative;padding-bottom:40px;padding-inline-end:56px}
.br{background:var(--k);border-radius:16px;box-shadow:var(--sh2);overflow:hidden}
.br-bar{height:32px;display:flex;align-items:center;gap:6px;padding-inline:14px;direction:ltr}
.br-bar i{width:9px;height:9px;border-radius:50%;background:#8A8C93}
.br-url{margin:0 auto;font-family:'Poppins',system-ui,sans-serif;font-weight:600;font-size:11px;color:var(--w70);background:var(--w12);border-radius:999px;padding:3px 40px}
.br-vp{position:relative;aspect-ratio:960/600;container-type:inline-size;overflow:hidden;background:var(--w)}
.ph{position:absolute;left:0;bottom:0;width:27%;background:var(--k);border-radius:28px;padding:7px;box-shadow:var(--sh2);transition:left .9s cubic-bezier(.6,0,.2,1)}
.hv[data-dir=ltr] .ph{left:73%}
.ph-vp{position:relative;aspect-ratio:360/740;container-type:inline-size;overflow:hidden;border-radius:22px;background:var(--w)}
.langs{display:flex;gap:8px;margin-top:24px;flex-wrap:wrap}
.lb{position:relative;overflow:hidden;background:var(--g);border-radius:999px;padding:10px 20px;font-weight:700;font-size:16px;transition:background .3s}
.lb[lang=en] span{font-family:'Poppins',system-ui,sans-serif;font-weight:600;font-size:15px}
.lb span{position:relative;z-index:1}
.lb.on{background:var(--y)}
.lb .fill{position:absolute;inset-inline-start:0;bottom:0;height:3px;width:100%;background:var(--k);transform-origin:right;transform:scaleX(0)}
.langs.auto.run .lb.on .fill,.hv.auto.run .lb.on .fill{animation:lFill 3.8s linear forwards}
@keyframes lFill{to{transform:scaleX(1)}}

/* האתר של הלקוח. כל המידות ביחידה של פיקסל עיצוב: --u במחשב ברוחב 960, --q בטלפון ברוחב 360 */
.ms,.mp{--rust:#A83902;--ink:#2B2420;--cream:#FAF5EF;position:absolute;inset:0;background:var(--cream);color:var(--ink);font-family:'FbJabutinski',system-ui,sans-serif;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility 0s .7s}
.ms.on,.mp.on{opacity:1;visibility:visible;transition:opacity .7s ease,visibility 0s}
.ms[lang=en],.mp[lang=en]{font-family:system-ui,sans-serif}
.ms{--u:calc(100cqw / 960)}
.ms-hd{height:calc(var(--u)*64);display:flex;align-items:center;gap:calc(var(--u)*24);padding-inline:calc(var(--u)*32);background:var(--w);box-shadow:0 1px 0 rgb(43 36 32 / .06)}
.ms-logo{height:calc(var(--u)*34);width:auto}
.ms-nav{display:flex;gap:calc(var(--u)*20);font-size:calc(var(--u)*14);font-weight:700;margin-inline-start:auto}
.ms-nav span.on{color:var(--rust)}
.ms-sw{display:flex;gap:calc(var(--u)*6);font-size:calc(var(--u)*12);font-weight:700}
.ms-sw i{font-style:normal;padding:calc(var(--u)*3) calc(var(--u)*7);border-radius:calc(var(--u)*6);color:rgb(43 36 32 / .55)}
.ms-sw i.on{background:var(--ink);color:var(--w)}
.ms-don{background:var(--rust);color:var(--w);border-radius:999px;padding:calc(var(--u)*9) calc(var(--u)*20);font-size:calc(var(--u)*13);font-weight:700}
.ms-hero{position:relative;height:calc(var(--u)*300);overflow:hidden}
.ms-hero img,.mp-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 35%}
.ms-hero::after,.mp-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to left,rgb(43 36 32 / .9) 0%,rgb(43 36 32 / .55) 45%,rgb(43 36 32 / .05) 100%)}
.ms[dir=ltr] .ms-hero::after{background:linear-gradient(to right,rgb(43 36 32 / .9) 0%,rgb(43 36 32 / .55) 45%,rgb(43 36 32 / .05) 100%)}
.ms-hero-in{position:absolute;z-index:1;inset-block:0;inset-inline-start:calc(var(--u)*40);width:calc(var(--u)*470);display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*22);color:var(--w)}
.ms-hero-in h4{font-size:calc(var(--u)*36);line-height:1.15;font-weight:900}
.ms[lang=en] .ms-hero-in h4{font-weight:800;letter-spacing:-.01em}
.ms-btns{display:flex;gap:calc(var(--u)*10)}
.ms-b1,.ms-b2{border-radius:999px;font-weight:700;font-size:calc(var(--u)*13);padding:calc(var(--u)*10) calc(var(--u)*20);white-space:nowrap}
.ms-b1{background:var(--rust);color:var(--w)}
.ms-b2{background:var(--w);color:var(--ink)}
.ms-news{padding:calc(var(--u)*24) calc(var(--u)*32)}
.ms-nh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:calc(var(--u)*14)}
.ms-nh b{font-size:calc(var(--u)*21);font-weight:900}
.ms-nh span{font-size:calc(var(--u)*13);font-weight:700;color:var(--rust)}
.ms-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*18)}
.ms-card{position:relative;background:var(--w);border-radius:calc(var(--u)*14);overflow:hidden;box-shadow:0 calc(var(--u)*6) calc(var(--u)*18) rgb(43 36 32 / .08)}
.ms-card img{width:100%;aspect-ratio:16/10;object-fit:cover}
.ms-tag{position:absolute;top:calc(var(--u)*10);inset-inline-start:calc(var(--u)*10);background:var(--w);color:var(--rust);font-size:calc(var(--u)*11);font-weight:700;border-radius:999px;padding:calc(var(--u)*3) calc(var(--u)*10)}
.ms-card p{font-size:calc(var(--u)*14);line-height:1.35;font-weight:700;padding:calc(var(--u)*12) calc(var(--u)*14) calc(var(--u)*16);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mp{--u:calc(100cqw / 330)}
.mp-hd{height:calc(var(--u)*56);margin-top:calc(var(--u)*20);display:flex;align-items:center;gap:calc(var(--u)*10);padding-inline:calc(var(--u)*16);background:var(--w)}
.mp-hd img{height:calc(var(--u)*34);width:auto}
.mp-sw{margin-inline-start:auto;background:var(--ink);color:var(--w);font-size:calc(var(--u)*12);font-weight:700;border-radius:calc(var(--u)*6);padding:calc(var(--u)*3) calc(var(--u)*8)}
.mp-menu{display:flex;flex-direction:column;gap:calc(var(--u)*4)}
.mp-menu i{display:block;width:calc(var(--u)*20);height:calc(var(--u)*2.5);border-radius:2px;background:var(--ink)}
.mp-hero{position:relative;height:calc(var(--u)*300);overflow:hidden}
.mp-hero::after{background:linear-gradient(to top,rgb(43 36 32 / .92) 0%,rgb(43 36 32 / .5) 55%,rgb(43 36 32 / .05) 100%)}
.mp-hero-in{position:absolute;z-index:1;inset-inline:calc(var(--u)*18);bottom:calc(var(--u)*22);display:flex;flex-direction:column;align-items:flex-start;gap:calc(var(--u)*14);color:var(--w)}
.mp-hero-in h4{font-size:calc(var(--u)*25);line-height:1.15;font-weight:900}
.mp .ms-b1{font-size:calc(var(--u)*13);padding:calc(var(--u)*9) calc(var(--u)*18)}
.mp-news{padding:calc(var(--u)*20) calc(var(--u)*16)}
.mp-news>b{display:block;font-size:calc(var(--u)*19);font-weight:900;margin-bottom:calc(var(--u)*12)}
.mp .ms-card{border-radius:calc(var(--u)*14)}
.mp .ms-tag{font-size:calc(var(--u)*11);top:calc(var(--u)*10);inset-inline-start:calc(var(--u)*10);padding:calc(var(--u)*3) calc(var(--u)*10)}
.mp .ms-card p{font-size:calc(var(--u)*14);padding:calc(var(--u)*10) calc(var(--u)*12) calc(var(--u)*14)}

/* ---------------- סעיפים ---------------- */
.sec{padding-block:112px;position:relative}
.sec-g{background:var(--g)}
.sec-k{background:var(--k);color:var(--w)}
.sec-y{background:var(--y);color:var(--k)}
.sh{max-width:760px;margin-bottom:48px}
.no{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:14px;background:var(--y);color:var(--k);font-family:'Poppins',system-ui,sans-serif;font-weight:600;font-size:17px;margin-bottom:20px}
.no-k{background:var(--k);color:var(--y)}
.sh h2,.next h2{font-size:36px;line-height:1.15;font-weight:900}
.sub{font-size:21px;line-height:1.35;font-weight:700;color:var(--k70);margin-top:12px}
.sec-k .sub{color:var(--w70)}
.split{display:grid;grid-template-columns:5fr 7fr;gap:64px;align-items:center}
.split-r{grid-template-columns:7fr 5fr}
.h3{font-size:24px;line-height:1.25;font-weight:700;margin:80px 0 24px}

/* 01 שלוש השפות */
.tri-row{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.tri-line{position:absolute;inset-inline:16%;top:72px;height:4px;border-radius:4px;background:var(--y);transform-origin:right}
.mo .tri .tri-line{transform:scaleX(0);transition:transform 1.1s cubic-bezier(.7,0,.2,1) .35s}
.mo .tri.in .tri-line{transform:scaleX(1)}
.tri-c{position:relative;background:var(--w);border-radius:20px;box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column}
.mo .tri .tri-c{opacity:0;transform:translateY(24px);transition:opacity .6s,transform .6s;transition-delay:calc(var(--d) * 160ms + .2s)}
.mo .tri.in .tri-c{opacity:1;transform:none}
.tri-img{position:relative}
.tri-img img{width:100%;aspect-ratio:16/10;object-fit:cover}
.tri-img b{position:absolute;top:12px;inset-inline-start:12px;background:var(--y);color:var(--k);border-radius:999px;font-size:14px;font-weight:700;padding:4px 12px}
.tri-img b[lang=en]{font-family:'Poppins',system-ui,sans-serif;font-weight:600;font-size:13px}
.tri-t{font-size:15px;line-height:1.4;font-weight:700;padding:14px 16px 8px;flex:1}
.tri-t[lang=en]{font-family:system-ui,sans-serif;font-size:14px}
.tri-u{display:block;font-family:'Poppins',system-ui,sans-serif;font-weight:600;font-size:10.5px;color:var(--k50);padding:0 16px 14px;overflow-wrap:anywhere}

/* 02 מבנה האתר */
.tree{position:relative;margin-top:56px;display:flex;flex-direction:column;align-items:center}
.tree-root{position:relative;z-index:1;background:var(--k);color:var(--w);font-weight:900;font-size:18px;border-radius:999px;padding:12px 36px}
.tree-bar{display:block;width:4px;height:32px;background:var(--y)}
.tree-cols{width:100%;display:grid;grid-template-columns:repeat(6,1fr);gap:16px;position:relative;padding-top:32px}
.tree-cols::before{content:"";position:absolute;top:0;inset-inline:8.3%;height:4px;border-radius:4px;background:var(--y);transform-origin:center}
.mo .tree .tree-cols::before{transform:scaleX(0);transition:transform .9s cubic-bezier(.7,0,.2,1) .2s}
.mo .tree.in .tree-cols::before{transform:scaleX(1)}
.tc{position:relative;background:var(--w);border-radius:20px;padding:20px 18px;box-shadow:var(--sh)}
.tc::before{content:"";position:absolute;top:-32px;inset-inline-start:calc(50% - 2px);width:4px;height:32px;background:var(--y)}
.mo .tree .tc{opacity:0;transform:translateY(20px);transition:opacity .55s,transform .55s;transition-delay:calc(var(--d) * 110ms + .6s)}
.mo .tree.in .tc{opacity:1;transform:none}
.tc h4{font-size:18px;font-weight:900;margin-bottom:10px}
.tc li{font-size:14px;line-height:1.4;padding:5px 0;color:var(--k70)}

/* 03 עדכון תוכן: רשימת שלבים ומסך ניהול שמתחלפים לבד */
.ed{display:grid;grid-template-columns:5fr 7fr;gap:48px;align-items:center;margin-bottom:56px}
.sp-list{display:flex;flex-direction:column;gap:8px}
.sp-i{position:relative;display:flex;gap:16px;align-items:flex-start;padding:18px 20px;border-radius:20px;cursor:pointer;transition:background .3s;overflow:hidden}
.sp-i:hover{background:var(--w12)}
.sp-i.on{background:var(--w12)}
.sp-n{flex:none;width:36px;height:36px;border-radius:50%;background:var(--w12);color:var(--w);display:flex;align-items:center;justify-content:center;font-family:'Poppins',system-ui,sans-serif;font-weight:600;font-size:15px;transition:background .3s,color .3s}
.sp-i.on .sp-n{background:var(--y);color:var(--k)}
.sp-i b{display:block;font-size:19px;font-weight:700;margin-bottom:2px}
.sp-i div>span{display:block;font-size:15px;line-height:1.45;color:var(--w70)}
.sp-bar{position:absolute;inset-inline:20px;bottom:0;height:3px;border-radius:3px;background:var(--w12);opacity:0}
.sp-bar i{display:block;height:100%;background:var(--y);border-radius:3px;transform-origin:right;transform:scaleX(0)}
.ed.auto .sp-i.on .sp-bar{opacity:1}
.ed.auto.run .sp-i.on .sp-bar i{animation:spFill 5s linear forwards}
@keyframes spFill{to{transform:scaleX(1)}}
.scr{background:var(--w);color:var(--k);border-radius:20px;overflow:hidden;box-shadow:0 32px 80px rgb(0 0 0 / .32)}
.scr-bar{height:44px;display:flex;align-items:center;gap:12px;padding-inline:20px;background:var(--g);font-size:14px}
.scr-bar span{color:var(--k70)}
.scr-body{display:grid;grid-template-columns:140px 1fr;min-height:400px}
.scr-side{background:var(--k);color:var(--w70);padding:16px 10px;display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700}
.scr-side span{padding:9px 14px;border-radius:12px}
.scr-side span.on{background:var(--y);color:var(--k)}
.scr-main{position:relative;padding:28px}
.ad-p{position:absolute;inset:28px;opacity:0;visibility:hidden;transform:translateY(12px);transition:opacity .45s,transform .45s,visibility 0s .45s}
.scr[data-s="0"] .ad-p0,.scr[data-s="1"] .ad-p1,.scr[data-s="2"] .ad-p2,.scr[data-s="3"] .ad-p3{opacity:1;visibility:visible;transform:none;transition:opacity .45s .1s,transform .45s .1s,visibility 0s}
.ad-p h5{font-size:22px;font-weight:900;margin-bottom:20px}
.ad-tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ad-tile{display:flex;align-items:center;gap:12px;background:var(--g);border-radius:16px;padding:22px 18px;font-weight:700;font-size:17px;transition:background .3s,transform .3s}
.ad-tile i{font-style:normal;width:36px;height:36px;border-radius:10px;background:var(--w);display:flex;align-items:center;justify-content:center;font-size:17px}
.scr[data-s="0"] .ad-tile.pick{animation:pick 5s ease forwards}
@keyframes pick{0%,30%{background:var(--g);transform:none}42%{background:var(--y);transform:scale(.96)}52%,100%{background:var(--y);transform:none}}
.ad-p label{display:block;font-size:13px;font-weight:700;color:var(--k70);margin:0 0 6px}
.ad-f{background:var(--g);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:15px;min-height:46px}
.ad-type span{display:inline-block;white-space:nowrap;overflow:hidden;max-width:100%;vertical-align:bottom}
.scr[data-s="1"] .ad-type span{animation:type 2.4s steps(48,end) .3s both}
@keyframes type{from{max-width:0}to{max-width:100%}}
.ad-two{display:grid;grid-template-columns:1fr 1.3fr;gap:16px}
.ad-img{padding:6px}
.ad-img img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:8px}
.ad-chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px}
.ad-chip{background:var(--w);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.scr[data-s="1"] .ad-chip{animation:pop .5s ease both 2.8s}
.scr[data-s="1"] .ad-two>div:last-child .ad-f:last-child .ad-chip{animation-delay:3.4s}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.ad-tr{display:flex;align-items:center;gap:12px;background:var(--g);border-radius:14px;padding:16px 18px;margin-bottom:10px;font-size:16px}
.ad-tr b[lang=en]{font-family:system-ui,sans-serif}
.ad-tr .sw{margin-inline-start:auto;display:grid;justify-items:end}
.ad-tr .sw>span{grid-area:1/1}
.ad-tr .ok,.ad-tr .add{font-size:13px;font-weight:700;border-radius:999px;padding:5px 12px;white-space:nowrap}
.ad-tr .ok{background:var(--k);color:var(--w)}
.ad-tr .add{background:var(--y);color:var(--k)}
.mo .ad-tr-new .ok{opacity:0}
.mo .scr[data-s="2"] .ad-tr-new .add{animation:addGone 3.2s ease forwards}
.mo .scr[data-s="2"] .ad-tr-new .ok{animation:okIn 3.2s ease forwards}
.ad-tr-new .add{opacity:0}
.mo .ad-tr-new .add{opacity:1}
@keyframes addGone{0%,55%{opacity:1;transform:none}68%,100%{opacity:0;transform:scale(.9)}}
@keyframes okIn{0%,62%{opacity:0;transform:scale(.8)}75%,100%{opacity:1;transform:none}}
.ad-toast{display:inline-flex;align-items:center;gap:10px;background:var(--k);color:var(--w);border-radius:999px;padding:10px 20px 10px 14px;font-weight:700;font-size:16px;margin-bottom:24px}
.ad-toast i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--y);color:var(--k);display:flex;align-items:center;justify-content:center;font-size:14px}
.ad-live{max-width:300px}
.ad-where{display:block;font-size:13px;font-weight:700;color:var(--k70);margin-bottom:8px}
.ad-live .ms-card{--u:1px;--rust:#A83902;--ink:#2B2420;color:var(--ink)}
.scr[data-s="3"] .ad-toast{animation:pop .5s ease both .2s}
.scr[data-s="3"] .ad-live{animation:rise .7s cubic-bezier(.2,.7,.2,1) both .7s}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

/* 04 הארכיון והכתובות */
.urs{display:flex;flex-direction:column;gap:16px}
.ur{display:grid;grid-template-columns:1fr;gap:8px;background:var(--g);border-radius:20px;padding:20px 24px}
.ur-l{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ur-tag{flex:none;font-size:13px;font-weight:700;background:var(--w);border-radius:999px;padding:4px 12px}
.ur-tag-y{background:var(--y)}
code{font-family:'Poppins',ui-monospace,monospace;font-weight:600;font-size:14px;overflow-wrap:anywhere}
.ur-old{position:relative;color:var(--k50)}
.ur-old::after{content:"";position:absolute;inset-inline:0;top:50%;height:2px;background:var(--k50);transform-origin:left;transform:scaleX(1)}
.ur-ar{width:22px;height:22px;fill:none;stroke:var(--k);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;margin-inline-start:4px}
.ur-new{color:var(--k)}
.ur-new span{display:inline-block}
.mo .urs .ur{opacity:0;transform:translateY(24px);transition:opacity .6s,transform .6s;transition-delay:calc(var(--d) * 220ms)}
.mo .urs.in .ur{opacity:1;transform:none}
.mo .urs .ur-old::after{transform:scaleX(0);transition:transform .5s ease;transition-delay:calc(var(--d) * 220ms + .6s)}
.mo .urs.in .ur-old::after{transform:scaleX(1)}
.mo .urs .ur-new span{clip-path:inset(0 100% 0 0);transition:clip-path 1s steps(24,end);transition-delay:calc(var(--d) * 220ms + 1s)}
.mo .urs.in .ur-new span{clip-path:inset(0 0 0 0)}

/* 05 טכנולוגיה */
.stack{position:relative;height:300px;display:flex;flex-direction:column;justify-content:center;gap:12px;padding-inline:8px}
.sl{border-radius:20px;padding:22px 28px;display:flex;align-items:baseline;justify-content:space-between;gap:16px;box-shadow:var(--sh)}
.sl b{font-size:20px;font-weight:900}
.sl span{font-size:14px;color:var(--k70)}
.sl1{background:var(--k);color:var(--w)}
.sl1 span{color:var(--w70)}
.sl2{background:var(--y)}
.sl2 span{color:var(--k)}
.sl3{background:var(--w)}
.mo .stack .sl{opacity:0;transition:opacity .6s,transform .8s cubic-bezier(.2,.7,.2,1)}
.mo .stack .sl1{transform:translateY(40px);transition-delay:.15s}
.mo .stack .sl2{transform:translateY(-30px) scale(.96);transition-delay:.45s}
.mo .stack .sl3{transform:translateY(-70px) scale(.92);transition-delay:.75s}
.mo .stack.in .sl{opacity:1;transform:none}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.tile{background:var(--g);border-radius:var(--r);padding:24px 20px;display:flex;flex-direction:column;gap:16px}
.tile svg{width:40px;height:40px;padding:8px;border-radius:12px;background:var(--y);fill:none;stroke:var(--k);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-size:17px;line-height:1.35;font-weight:700}

/* 06 מענק גוגל */
.checks{background:var(--w);border-radius:var(--r);box-shadow:var(--sh);padding:16px 40px;max-width:880px}
.checks li{display:flex;gap:20px;align-items:flex-start;padding:24px 0;box-shadow:0 -1px 0 var(--k10)}
.checks li:first-child{box-shadow:none}
.ck{flex:none;width:40px;height:40px;border-radius:50%;background:var(--y);display:flex;align-items:center;justify-content:center}
.ck svg{width:22px;height:22px;fill:none;stroke:var(--k);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:0}
.checks b{display:block;font-size:20px;line-height:1.3;font-weight:700;margin-bottom:4px}
.checks li span{font-size:15px;line-height:1.45;color:var(--k70)}
.mo .checks .ck{background:var(--g);transition:background .4s;transition-delay:calc(var(--d) * 450ms + .3s)}
.mo .checks .ck svg{stroke-dashoffset:24;transition:stroke-dashoffset .45s ease;transition-delay:calc(var(--d) * 450ms + .55s)}
.mo .checks.in .ck{background:var(--y)}
.mo .checks.in .ck svg{stroke-dashoffset:0}

/* 07 שלבים: קו שמתמלא עם הגלילה */
.tl{position:relative;max-width:960px;margin-inline:auto;display:flex;flex-direction:column;gap:24px;--p:1}
.mo .tl{--p:0}
.tl-line{position:absolute;top:24px;bottom:24px;inset-inline-start:calc(50% - 2px);width:4px;border-radius:4px;background:var(--g)}
.tl-line i{display:block;width:100%;height:100%;border-radius:4px;background:var(--y);transform-origin:top;transform:scaleY(var(--p))}
.tl-s{position:relative;display:grid;grid-template-columns:1fr 56px 1fr;align-items:center}
.tl-dot{grid-column:2;justify-self:center;width:48px;height:48px;border-radius:50%;background:var(--g);color:var(--k);display:flex;align-items:center;justify-content:center;font-family:'Poppins',system-ui,sans-serif;font-weight:600;font-size:17px;position:relative;z-index:1;transition:background .4s,transform .4s}
.tl-c{background:var(--w);border-radius:20px;box-shadow:var(--sh);padding:22px 26px;transition:opacity .5s,transform .5s}
.tl-s:nth-child(odd) .tl-c{grid-column:1;grid-row:1}
.tl-s:nth-child(even) .tl-c{grid-column:3;grid-row:1}
.tl-c b{display:block;font-size:20px;font-weight:900;margin-bottom:4px}
.tl-c span{font-size:15px;line-height:1.45;color:var(--k70)}
.tl-s.on .tl-dot,.tl:not(.js) .tl-dot{background:var(--y);transform:scale(1.08)}
.mo .tl.js .tl-s .tl-c{opacity:.35;transform:translateY(12px)}
.mo .tl.js .tl-s.on .tl-c{opacity:1;transform:none}
.tl-end{text-align:center;font-size:19px;font-weight:700;margin-top:40px}

/* 08 מה צריך */
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.card{background:var(--w);border-radius:var(--r);box-shadow:var(--sh);padding:32px 36px}
.card-soft{background:var(--w);box-shadow:none}
.card h3{font-size:24px;line-height:1.25;font-weight:700;margin-bottom:20px}
.card-soft .bl li::before{background:var(--k)}

/* 09 הצעד הבא */
.sec-y{padding-block:96px}
.next{display:grid;grid-template-columns:6fr 5fr;gap:48px;align-items:center}
.next .bl li{font-size:19px;font-weight:700}
.ft{padding-block:32px calc(32px + env(safe-area-inset-bottom,0px))}
.ft-in{display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:14px;color:var(--k70)}
.ft img{height:28px;width:auto}

}

}

   בלי הצמדות לגלילה: העמוד תמיד זז כשגוללים. ההדמיות מתחלפות לבד רק כשהן במסך, ולחיצה עוצרת את ההחלפה.
   בתנועה מופחתת הכול גלוי מיד, בלי החלפה לבד. */
function initPage() {
  var D = document, root = D.documentElement;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $ = function (s, r) { return (r || D).querySelector(s); };
  var $$ = function (s, r) { return [].slice.call((r || D).querySelectorAll(s)); };
  if (!reduce) root.classList.add('mo');

  // כל תמונה נטענת פעם אחת, והעותקים מקבלים את אותו מקור
  $$('img[data-i]').forEach(function (im) {
    var s = $('img[data-k="' + im.getAttribute('data-i') + '"]');
    if (s) im.src = s.src;
  });

  function watch(el, cb, threshold) {
    if (!('IntersectionObserver' in window)) { cb(true); return; }
    new IntersectionObserver(function (es) { es.forEach(function (x) { cb(x.isIntersecting); }); }, { threshold: threshold }).observe(el);
  }

  /* ---------- מעבר בתוך העמוד, בלי לשנות את הכתובת, כי המפתח יושב בה ---------- */
  function goTo(id) {
    var el = D.getElementById(id); if (!el) return;
    var y = el.getBoundingClientRect().top + scrollY - (id === 'top' ? 200 : 64);
    scrollTo({ top: Math.max(0, y), behavior: reduce ? 'auto' : 'smooth' });
  }
  $$('[data-go]').forEach(function (a) {
    a.addEventListener('click', function (ev) { ev.preventDefault(); goTo(a.getAttribute('data-go')); });
  });

  /* ---------- הפס העליון: התקדמות, הסעיף הנוכחי וצל ---------- */
  var hd = $('#hd'), hdP = $('#hdP'), spies = $$('[data-spy]'), tabs = {}, cur = null;
  $$('.tab').forEach(function (t) { tabs[t.getAttribute('data-tab')] = t; });
  var blobs = $$('[data-px]');
  var tl = $('.tl'), tlSteps = tl ? $$('.tl-s', tl) : [];
  if (tl && !reduce) tl.classList.add('js');

  function frame() {
    ticking = false;
    var max = Math.max(1, root.scrollHeight - innerHeight);
    if (hdP) hdP.style.transform = 'scaleX(' + Math.min(1, scrollY / max).toFixed(4) + ')';
    if (hd) hd.classList.toggle('sc', scrollY > 8);
    var on = null;
    spies.forEach(function (s) { if (s.getBoundingClientRect().top <= innerHeight * 0.4) on = s.getAttribute('data-spy'); });
    if (scrollY >= max - 4 && spies.length) on = spies[spies.length - 1].getAttribute('data-spy');
    if (on !== cur) {
      if (cur && tabs[cur]) tabs[cur].classList.remove('on');
      if (on && tabs[on]) tabs[on].classList.add('on');
      cur = on;
    }
    if (reduce) return;
    if (scrollY < innerHeight * 1.5) blobs.forEach(function (b) {
      b.style.transform = 'translateY(' + (scrollY * parseFloat(b.getAttribute('data-px'))).toFixed(1) + 'px)';
    });
    if (tl) {
      var r = tl.getBoundingClientRect(), mid = innerHeight * 0.62;
      var p = Math.min(1, Math.max(0, (mid - r.top) / r.height));
      tl.style.setProperty('--p', p.toFixed(4));
      tlSteps.forEach(function (s) { s.classList.toggle('on', s.getBoundingClientRect().top + 24 < mid); });
    }
  }
  var ticking = false;
  addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(frame); } }, { passive: true });
  addEventListener('resize', frame);
  frame();

  /* ---------- מחליף שפות בהדמיה של האתר ---------- */
  $$('[data-langs]').forEach(function (box) {
    var btns = $$('[data-lb]', box), pages = $$('[data-lp]', box), n = btns.length, i = 0;
    function set(k) {
      i = (k + n) % n;
      btns.forEach(function (b, j) { b.classList.toggle('on', j === i); });
      pages.forEach(function (p) {
        var hit = +p.getAttribute('data-lp') === i;
        p.classList.toggle('on', hit);
        p.setAttribute('aria-hidden', hit && p.classList.contains('ms') ? 'false' : 'true');
        if (hit && p.classList.contains('ms')) box.setAttribute('data-dir', p.getAttribute('dir'));
      });
    }
    btns.forEach(function (b, j) { b.addEventListener('click', function () { box.classList.remove('auto'); set(j); }); });
    if (reduce) return;
    box.classList.add('auto');
    box.addEventListener('animationend', function (ev) {
      if (ev.animationName === 'lFill' && box.classList.contains('auto')) set(i + 1);
    });
    watch(box, function (seen) { box.classList.toggle('run', seen); }, 0.3);
  });

  /* ---------- שלבי העלאת התוכן: הרשימה והמסך מתחלפים יחד ---------- */
  $$('[data-sp]').forEach(function (box) {
    var items = $$('[data-sp-item]', box), scr = $('[data-s]', box), N = items.length, i = 0;
    function go(k) {
      i = (k + N) % N;
      items.forEach(function (el, j) { el.classList.toggle('on', j === i); });
      if (scr) {
        scr.removeAttribute('data-s');
        void scr.offsetWidth; // מאפס את האנימציות של המסך, כדי שיתחילו מההתחלה גם כשחוזרים לאותו שלב
        scr.setAttribute('data-s', i);
      }
    }
    items.forEach(function (el, j) { el.addEventListener('click', function () { box.classList.remove('auto'); go(j); }); });
    if (reduce) return;
    box.classList.add('auto');
    box.addEventListener('animationend', function (ev) {
      if (ev.animationName === 'spFill' && box.classList.contains('auto')) go(i + 1);
    });
    watch(box, function (seen) { box.classList.toggle('run', seen); }, 0.35);
  });

  /* ---------- הופעה עדינה ---------- */
  var rvs = $$('.rv');
  if (reduce || !('IntersectionObserver' in window)) { rvs.forEach(function (el) { el.classList.add('in'); }); return; }
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (x) { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } });
  }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
  rvs.forEach(function (el) { io.observe(el); });
}


(function(){
  var app=document.getElementById('app');
  function fail(){app.innerHTML='<p style="text-align:center;padding:6rem 1rem;color:#1B1A17;font-size:1.1rem">הקישור לא שלם. פתחו את הקישור המלא כפי שנשלח אליכם.</p>'}
  function b64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  var m=location.hash.match(/k=([A-Za-z0-9_-]+)/);
  if(!m||!window.crypto||!crypto.subtle){fail();return}
  var blob=b64u(document.getElementById('payload').textContent.trim());
  crypto.subtle.importKey('raw',b64u(m[1]),'AES-GCM',false,['decrypt'])
    .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:blob.slice(0,12)},k,blob.slice(12))})
    .then(function(buf){app.innerHTML=new TextDecoder().decode(buf);initPage()})
    .catch(fail);
})();
