<style>/* עמוד מסמך בעמודה אחת: קריאה רציפה, טבלאות ותרשימים בגלילה משלהם */
:root {
  --bg: #f4f5f1;
  --surface: #ffffff;
  --ink: #1d221e;
  --muted: #5a635b;
  --line: #d8dcd3;
  --accent: #8a1f30;      /* הכומתה האדומה */
  --hl-bg: #fff0a3;       /* הצהוב של המצגת */
  --hl-ink: #3a3200;
  --tbd-bg: #f9e4e7;
  --tbd-ink: #8a1f30;
  --font-display: "Assistant", "Segoe UI", Arial, sans-serif;
  --font-body: "Assistant", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131714; --surface: #1b201c; --ink: #e6eae4; --muted: #9ba49b; --line: #2f3631;
    --accent: #e57c89; --hl-bg: #574a0a; --hl-ink: #fff2b3; --tbd-bg: #3b1b21; --tbd-ink: #f4a9b3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131714; --surface: #1b201c; --ink: #e6eae4; --muted: #9ba49b; --line: #2f3631;
  --accent: #e57c89; --hl-bg: #574a0a; --hl-ink: #fff2b3; --tbd-bg: #3b1b21; --tbd-ink: #f4a9b3;
  color-scheme: dark;
}

body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.7; }
.doc { max-width: 52rem; margin: 0 auto; padding-inline: 16px; padding-block: 2.5rem 4rem; display: grid; gap: 1.5rem; }
.doc > * { min-width: 0; }

.masthead { border-bottom: 3px solid var(--accent); padding-bottom: 1.25rem; }
.masthead h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.7rem, 4.5vw, 2.4rem); line-height: 1.25; margin: 0 0 .75rem; text-wrap: balance; }
.masthead p { margin: .35rem 0; color: var(--muted); max-width: 65ch; }
.masthead p:first-of-type { color: var(--ink); }

.toc { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 1rem 1.25rem; }
.toc ol { margin: 0; padding-inline-start: 1.4rem; columns: 2 14rem; column-gap: 2rem; font-size: 15.5px; }
.toc li { break-inside: avoid; padding-block: .1rem; }
.toc a { color: var(--ink); text-decoration: none; }
.toc a:hover, .toc a:focus-visible { color: var(--accent); text-decoration: underline; }
.toc li::marker { color: var(--accent); font-variant-numeric: tabular-nums; }

article { display: block; }
article > p, article > ul, article > ol { max-width: 65ch; }
h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.55rem; line-height: 1.3; margin: 2.75rem 0 .75rem; color: var(--accent); text-wrap: balance; scroll-margin-top: 1rem; }
h3 { font-size: 1.15rem; font-weight: 700; margin: 2rem 0 .5rem; text-wrap: balance; display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
p { margin: .6rem 0; }
ul, ol { padding-inline-start: 1.4rem; margin: .6rem 0; }
li { margin: .25rem 0; }
strong { font-weight: 700; }
hr { border: 0; border-top: 1px solid var(--line); margin: 2.5rem 0 1rem; }
a { color: var(--accent); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.table-wrap { overflow-x: auto; margin: 1rem 0; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 15.5px; line-height: 1.55; }
th, td { text-align: start; vertical-align: top; padding: .6rem .8rem; border-bottom: 1px solid var(--line); }
th { font-weight: 700; color: var(--muted); font-size: 14.5px; background: var(--bg); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td:first-child { font-variant-numeric: tabular-nums; }

.diagram { overflow-x: auto; margin: 1.25rem 0; padding: 1rem; border: 1px dashed var(--line); border-radius: 6px; background: var(--surface); }
.diagram pre { margin: 0; text-align: center; }
.diagram .nodeLabel, .diagram .edgeLabel, .diagram foreignObject div { direction: rtl; unicode-bidi: plaintext; }

.chip-yellow { font-size: 13px; font-weight: 600; background: var(--hl-bg); color: var(--hl-ink); padding: .1rem .55rem; border-radius: 3px; }
.hl { background: var(--hl-bg); color: var(--hl-ink); padding: 0 .25rem; border-radius: 2px; }
mark.tbd { background: var(--tbd-bg); color: var(--tbd-ink); font-weight: 700; padding: 0 .3rem; border-radius: 3px; }

@media (max-width: 480px) {
  body { font-size: 16px; }
  .toc ol { columns: 1; }
}

.gate { text-align: center; color: var(--muted); padding-block: 4rem; }</style>

<script>
(function(){
  var app=document.getElementById('app');
  function fail(){app.innerHTML='<p class="gate">הקישור לא שלם. פתחו את הקישור המלא כפי שנשלח אליכם.</p>'}
  function b64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  var m=location.hash.match(/k=([A-Za-z0-9_-]+)/);
  if(!m||!window.crypto||!crypto.subtle){fail();return}
  var blob=b64u(document.getElementById('payload').textContent.trim());
  crypto.subtle.importKey('raw',b64u(m[1]),'AES-GCM',false,['decrypt'])
    .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:blob.slice(0,12)},k,blob.slice(12))})
    .then(function(buf){
      app.innerHTML=new TextDecoder().decode(buf);
      // קישורי תוכן העניינים גוללים בלי לדרוס את המפתח שבקישור
      app.querySelectorAll('a[href^="#s"]').forEach(function(a){a.addEventListener('click',function(e){
        var t=document.getElementById(a.getAttribute('href').slice(1));if(t){e.preventDefault();t.scrollIntoView({behavior:'smooth'})}})});
      if(window.mermaid){mermaid.initialize({startOnLoad:false,theme:'neutral'});mermaid.run({querySelector:'.mermaid'})}
    })
    .catch(fail);
})();
</script>
