:root{
  --ground:#FFFDF8;
  --cream:#FAF3E2;
  --cream-deep:#F6EBD2;
  --ink:#221F19;
  --ink-mid:#4A4437;
  --ink-soft:#6B6250;
  --gold:#F5B424;
  --gold-soft:#FBE3A8;
  --gold-deep:#9C6A10;
  --line:#EADFC6;
  --card:#FFFFFF;
  --ok:#2E7D32;
  --warn:#B23B2E;
  --marker:#FFE45C;
  --font:'Assistant',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  color-scheme:light;
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased}
.doc{overflow-x:clip}
.doc :where(h1,h2,h3,h4){margin:0;line-height:1.2;letter-spacing:-.015em;font-weight:800;text-wrap:balance}
.doc :where(p){margin:0}
.doc :where(p,li){text-wrap:pretty}
.doc [id]{scroll-margin-top:84px}
.wrap{max-width:1080px;margin-inline:auto;padding-inline:22px}
a{color:var(--gold-deep)}
a:focus-visible,button:focus-visible{outline:3px solid var(--gold-deep);outline-offset:3px;border-radius:6px}
b,strong{font-weight:700}

/* כותרת עליונה */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(255,253,248,.93);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px}
.hdr img{height:32px;width:auto;display:block}
.hdr .side{display:flex;align-items:center;gap:14px;font-size:.92rem;font-weight:600;color:var(--ink-soft)}
.btn{display:inline-block;background:linear-gradient(180deg,#F9C63F,#F0AC12);color:var(--ink);font-weight:700;font-size:.95rem;text-decoration:none;padding:9px 20px;border-radius:999px;transition:filter .16s ease,transform .16s ease}
.btn:hover{filter:brightness(1.05);transform:translateY(-1px)}

/* פתיח */
.hero{padding-block:64px 58px;border-bottom:1px solid var(--line);
  background:
    radial-gradient(900px 480px at 88% -12%, rgba(245,180,36,.30), transparent 62%),
    radial-gradient(720px 460px at -12% 112%, rgba(245,180,36,.14), transparent 58%),
    linear-gradient(180deg,#FFF7E4,var(--ground) 80%)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:48px;align-items:start}
.label{font-size:.8rem;font-weight:700;letter-spacing:.12em;color:var(--gold-deep);display:flex;align-items:center;gap:10px;margin-bottom:16px}
.label::before{content:"";width:26px;height:3px;border-radius:2px;background:var(--gold)}
.hero h1{font-size:clamp(2rem,5vw,3.05rem);line-height:1.15}
.hl{background:linear-gradient(transparent 60%,rgba(245,180,36,.55) 60%);border-radius:3px;padding-inline:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero .sub{margin-top:26px;font-size:1.15rem;color:var(--ink-mid);max-width:54ch}
.facts{list-style:none;padding:0;margin:30px 0 0;display:grid;gap:8px;font-size:.96rem;color:var(--ink-soft)}
.facts b{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:24px;padding-top:20px;border-top:1px solid var(--line);font-size:.93rem;color:var(--ink-mid)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.goal{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px 24px;position:relative;overflow:hidden}
.goal::before{content:"";position:absolute;top:0;inset-inline:0;height:5px;background:linear-gradient(90deg,var(--gold),#F9CE5B,var(--gold))}
.goal h2{font-size:1.3rem;margin-bottom:16px}
.goal .scope{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-size:.93rem;color:var(--ink-soft)}

/* סימונים */
.tbd{display:inline-block;border:1px dashed var(--gold-deep);color:var(--gold-deep);background:#FFF8E6;font-weight:700;font-size:.8em;line-height:1.5;border-radius:999px;padding:0 9px;white-space:nowrap;vertical-align:.08em}
.ychip{display:inline-block;background:var(--marker);color:#3A3200;font-weight:700;font-size:.78rem;line-height:1.6;border-radius:4px;padding:0 8px;white-space:nowrap;letter-spacing:.02em}
mark.y{background:linear-gradient(transparent 12%,var(--marker) 12%,var(--marker) 88%,transparent 88%);color:inherit;padding-inline:2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.xref{color:var(--gold-deep);font-weight:700;text-decoration:none;border-bottom:1px dotted currentColor;white-space:nowrap}
.xref:hover{color:var(--ink)}

/* תוכן העניינים */
.toc{background:var(--card);border-bottom:1px solid var(--line);padding-block:20px}
.toc .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.toc .t{font-size:.8rem;font-weight:700;letter-spacing:.12em;color:var(--ink-soft)}
.toc ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.toc a{display:inline-flex;align-items:baseline;gap:6px;padding:5px 13px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--ink-mid);font-weight:600;font-size:.92rem;background:var(--ground);transition:border-color .15s ease,color .15s ease}
.toc a b{color:var(--gold-deep);font-variant-numeric:tabular-nums}
.toc a:hover{border-color:var(--gold);color:var(--ink)}

/* סקשנים */
.sec{padding-block:84px}
.sec+.sec{border-top:1px solid var(--line)}
.sec.panel{background:linear-gradient(180deg,var(--cream),var(--cream-deep));border-top:0}
.sec-head{display:flex;align-items:flex-end;gap:18px;margin-bottom:26px}
.sec-num{font-size:clamp(3.4rem,8vw,5.4rem);font-weight:800;line-height:.78;color:var(--gold-soft);font-variant-numeric:tabular-nums;letter-spacing:-.04em;flex:0 0 auto}
.panel .sec-num{color:#F2D07E}
.sec h2{font-size:clamp(1.6rem,4vw,2.35rem)}
.lede{font-size:1.1rem;color:var(--ink-mid);max-width:64ch}
.lede+.lede{margin-top:14px}
.punch{margin-top:30px;font-size:1.18rem;font-weight:800;max-width:62ch}

.dia{list-style:none;padding:0;margin:0;display:grid;gap:11px}
.dia li{position:relative;padding-inline-start:28px}
.dia li::before{content:"";position:absolute;inset-inline-start:2px;top:.6em;width:10px;height:10px;border-radius:2px;background:linear-gradient(135deg,#F9C63F,#E8A50D);transform:rotate(45deg)}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.card.top{border-top:4px solid var(--gold)}
.card.muted{background:var(--cream);border:1px dashed rgba(107,98,80,.42)}
.card h3{font-size:1.2rem;margin-bottom:10px}
.card p{color:var(--ink-mid);font-size:.99rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.group-t{font-size:.8rem;font-weight:700;letter-spacing:.12em;color:var(--ink-soft);margin:34px 0 12px}
.split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:44px;align-items:start}

/* מטרה */
.replace h3{font-size:1.15rem;margin-bottom:14px}

/* שלבי התהליך */
.stages{list-style:none;padding:0;margin:36px 0 0;display:grid;gap:14px;position:relative}
.stages::before{content:"";position:absolute;inset-inline-start:21px;top:24px;bottom:24px;width:2px;border-radius:2px;background:linear-gradient(180deg,var(--gold),var(--line))}
.stage{display:grid;grid-template-columns:44px minmax(0,1fr);gap:18px;position:relative}
.stage .n{width:44px;height:44px;border-radius:50%;background:var(--card);border:2px solid var(--gold);display:grid;place-items:center;font-weight:800;font-size:1.05rem;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.stage.auto .n{background:var(--gold)}
.stage .body{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px 18px;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:10px 26px}
.stage h3{grid-column:1/-1;font-size:1.16rem;display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px}
.stage .k{display:block;font-size:.74rem;font-weight:700;letter-spacing:.12em;color:var(--ink-soft);margin-bottom:3px}
.stage .sys .k{color:var(--gold-deep)}
.stage .today,.stage .sys{font-size:.98rem;color:var(--ink-mid)}
.stage .sys{font-weight:600;color:var(--ink)}
.stage.later .body{background:var(--cream);border-style:dashed}
.stage.later .n{border-color:var(--line);color:var(--ink-soft)}
.dark{margin-top:40px;border-radius:18px;padding:30px 32px;position:relative;overflow:hidden;color:#FAF3E2;
  background:radial-gradient(620px 300px at 92% 0%,rgba(245,180,36,.26),transparent 60%),#221F19}
.dark::before{content:"";position:absolute;top:0;inset-inline:0;height:4px;background:linear-gradient(90deg,var(--gold),#F9CE5B,var(--gold))}
.dark h3{color:var(--gold);font-size:1.3rem;margin-bottom:10px}
.dark p{color:rgba(250,243,226,.9);max-width:68ch;font-size:1.06rem}

/* תתי סעיפים */
.subsec{margin-top:70px}
.subsec.first{margin-top:10px}
.sub-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;margin-bottom:18px}
.sub-num{font-weight:800;font-size:.95rem;background:var(--gold);color:var(--ink);border-radius:8px;padding:1px 10px;font-variant-numeric:tabular-nums}
.subsec h3{font-size:clamp(1.3rem,3vw,1.62rem)}
.subsec h4{font-size:1.06rem;margin:28px 0 12px}
.txt>p{max-width:66ch;color:var(--ink-mid)}
.txt>p+p,.txt>p+.dia,.txt>.dia+p{margin-top:14px}
.lead{font-weight:700;color:var(--ink)}

/* מסך דוגמה */
.mock{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.mock .mh,.dash .mh{background:#221F19;color:#FAF3E2;padding:13px 18px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.mock .mh b,.dash .mh b{font-size:1rem}
.mock .mh span,.dash .mh span{font-size:.8rem;opacity:.75}
.mock .row{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;padding:11px 18px;border-bottom:1px solid var(--line);font-size:.93rem}
.mock .row span{color:var(--ink-soft)}
.mock .mf{padding:12px 18px;background:var(--cream);font-size:.88rem;font-weight:600;color:var(--ink-mid)}
.cap{font-size:.84rem;color:var(--ink-soft);text-align:center;margin-top:10px}

/* שדות הטופס */
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.tags span{background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-size:.9rem;font-weight:600;color:var(--ink-mid)}
.card .note{margin-top:14px;font-size:.9rem;color:var(--ink-soft)}
.rules{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 30px;counter-reset:r}
.rules li{counter-increment:r;position:relative;padding-inline-start:44px;font-size:.98rem;color:var(--ink-mid)}
.rules li::before{content:counter(r);position:absolute;inset-inline-start:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--ink);font-weight:800;font-size:.9rem;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.rules li b{color:var(--ink)}
.ask{margin-top:24px;background:#FFF8E6;border:1px dashed var(--gold-deep);border-radius:12px;padding:14px 18px;font-size:.98rem;color:var(--ink-mid);max-width:72ch}
.ask .tbd{margin-inline-end:8px}

/* אימות הקבוצה */
.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.res{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.res h5{margin:0 0 6px;font-size:1.02rem;font-weight:800;line-height:1.3;display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}
.res p{font-size:.95rem;color:var(--ink-mid)}
.st{font-size:.74rem;font-weight:700;border-radius:999px;padding:1px 10px;letter-spacing:.02em}
.st.ok{background:rgba(46,125,50,.1);color:var(--ok)}
.st.chk{background:var(--gold-soft);color:var(--gold-deep)}
.st.who{background:var(--cream-deep);color:var(--ink-mid)}
.st.act{background:rgba(178,59,46,.09);color:var(--warn)}
.cond{margin-top:22px;background:var(--gold-soft);border:1px solid rgba(156,106,16,.3);border-radius:12px;padding:14px 18px;font-size:.98rem;max-width:72ch}
.after-res{margin-top:16px;color:var(--ink-mid);max-width:66ch}

/* טבלאות */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.tbl table{border-collapse:collapse;width:100%;font-size:.96rem;line-height:1.55}
.tbl th{font-size:.76rem;letter-spacing:.11em;font-weight:700;color:var(--ink-soft);text-align:start;padding:12px 16px;background:var(--cream);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top;text-align:start;color:var(--ink-mid)}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{color:var(--ink);font-weight:600}
.tbl tr.key td{background:rgba(245,180,36,.13)}
.fld{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.8rem;font-weight:500;background:var(--cream);border:1px solid var(--line);border-radius:6px;padding:0 7px;margin:2px 0 2px 4px;color:var(--ink)}

/* סדר השיוך */
.flow{list-style:none;padding:0;margin:0;counter-reset:f;max-width:66ch}
.flow li{counter-increment:f;position:relative;padding-inline-start:52px;padding-bottom:18px;color:var(--ink-mid);min-height:34px}
.flow li::before{content:counter(f);position:absolute;inset-inline-start:0;top:-2px;width:34px;height:34px;border-radius:50%;border:2px solid var(--gold);background:var(--card);display:grid;place-items:center;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;z-index:1}
.flow li:not(:last-child)::after{content:"";position:absolute;inset-inline-start:16px;top:32px;bottom:0;width:2px;background:var(--line)}
.flow li:last-child{padding-bottom:0}
.flow li:last-child::before{background:var(--ink);border-color:var(--ink);color:#FAF3E2}
.aside{margin-top:26px;background:var(--cream);border-radius:14px;padding:18px 22px;color:var(--ink-mid);max-width:72ch}

/* חישוב התקופה */
.fields4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0 26px}
.fields4 span{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:12px;padding:12px 10px;text-align:center;font-weight:700;font-size:.98rem}
.calc h5{margin:0 0 8px;font-size:1.15rem;font-weight:800}
.calc .how{color:var(--ink-mid);font-size:.97rem}
.calc .ex{margin-top:14px;background:var(--gold-soft);border-radius:10px;padding:10px 14px;font-size:.93rem;font-weight:600;color:var(--ink)}
.calc .ex .k{display:block;font-size:.72rem;letter-spacing:.12em;color:var(--gold-deep);font-weight:700}
.round{margin-top:16px;max-width:70ch;color:var(--ink-mid)}
.statement{margin-top:40px;font-size:clamp(1.25rem,2.6vw,1.5rem);font-weight:800;line-height:1.35;max-width:40ch}
.statement+p{margin-top:12px;max-width:68ch;color:var(--ink-mid)}
.mheads{display:grid;grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);margin-top:26px;font-size:.76rem;font-weight:700;letter-spacing:.12em}
.mheads span{padding-inline:16px}
.mheads .a{color:var(--ink-soft)}
.mheads .b{color:var(--gold-deep);grid-column:3}
.mirror{display:grid;gap:10px;margin-top:10px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);align-items:stretch}
.mrow .was{background:var(--cream);border:1px solid rgba(107,98,80,.28);border-radius:12px;padding:12px 16px;color:var(--ink-mid);font-size:.97rem;display:flex;align-items:center}
.mrow .arr{display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:1.45rem;font-weight:800}
.mrow .now{background:var(--card);border:1px solid rgba(156,106,16,.32);border-radius:12px;padding:12px 16px;font-weight:600;font-size:.97rem;display:flex;align-items:center}
.mcap{margin-top:12px;font-size:.88rem;color:var(--ink-soft)}

/* תזכורות */
.ladder{list-style:none;padding:0;margin:4px 0 0;display:grid;gap:0;max-width:860px}
.ladder .step{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px;align-items:stretch}
.ladder .q{background:#221F19;color:#FFF7E4;border-radius:12px;padding:14px 18px;font-weight:700;display:flex;align-items:center}
.ladder .outs{display:grid;gap:8px}
.ladder .o{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 16px;font-size:.96rem;color:var(--ink-mid);display:flex;align-items:center;gap:10px}
.yn{flex:0 0 auto;font-size:.82rem;font-weight:700;letter-spacing:.08em;border-radius:6px;padding:1px 9px;background:var(--gold);color:var(--ink)}
.yn.no{background:var(--cream-deep);color:var(--ink-mid)}
.ladder .next{display:flex;align-items:center;gap:10px;padding:6px 18px;font-size:.84rem;font-weight:700;color:var(--gold-deep)}
.ladder .next::before{content:"";width:2px;height:24px;background:var(--gold);border-radius:2px}
.how-list{margin-top:36px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 34px}
.how-list li{font-size:.98rem;color:var(--ink-mid)}
.how-list li b{color:var(--ink)}

/* מסך הפלוגה */
.dash{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.dtiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:16px}
.dtile{background:var(--cream);border-radius:12px;padding:12px 8px 10px;text-align:center}
.dtile b{display:block;font-size:clamp(1.05rem,2.6vw,1.4rem);font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.dtile span{display:block;font-size:.74rem;color:var(--ink-soft);margin-top:3px;line-height:1.35}
.dtile.gold{background:var(--gold-soft)}
.dtile.gold b{color:var(--gold-deep)}
.dlists{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 14px}
.dlists span{font-size:.8rem;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--ink-mid);display:inline-flex;gap:6px;align-items:baseline}
.dlists span i{font-style:normal;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.dlists span.on{background:#221F19;border-color:#221F19;color:#FAF3E2}
.dlists span.on i{color:var(--gold)}
.dfoot{display:flex;justify-content:space-between;gap:10px;padding:11px 16px;background:var(--cream);font-size:.84rem;font-weight:600;color:var(--ink-mid);border-top:1px solid var(--line)}
.dfoot .x{color:var(--gold-deep)}

/* מבנה הנתונים */
.entities{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:30px}
.ent{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.ent h3{font-size:1.08rem;margin-bottom:6px}
.ent p{font-size:.94rem;color:var(--ink-mid)}
.ent.core{grid-column:1/-1;background:var(--gold-soft);border:1px solid rgba(156,106,16,.35);padding:22px 24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 30px;align-items:start}
.ent.core h3{font-size:1.3rem}
.ent.core .tags{margin-top:0}
.ent.core .tags span{background:rgba(255,255,255,.75);border-color:rgba(156,106,16,.3)}
.ent.core .tags span.later{background:transparent;border-style:dashed}

/* חיבורים */
.ints{margin-top:28px;border-top:2px solid var(--gold)}
.int{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1fr) minmax(0,1.3fr);gap:6px 26px;padding:18px 0;border-bottom:1px solid var(--line)}
.int h3{font-size:1.1rem}
.int .k{display:block;font-size:.72rem;font-weight:700;letter-spacing:.12em;color:var(--ink-soft);margin-bottom:2px}
.int .need .k{color:var(--gold-deep)}
.int p{font-size:.97rem;color:var(--ink-mid)}
.risk{margin-top:30px;background:var(--card);border:1px solid rgba(178,59,46,.32);border-radius:14px;padding:18px 22px;max-width:76ch}
.risk h3{font-size:1.08rem;color:var(--warn);margin-bottom:6px}
.risk p{color:var(--ink-mid)}

/* פרטיות ומחוץ לשלב הראשון */
.privacy,.later-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.later-grid .wide{grid-column:1/-1}
.privacy .card h3,.later-grid .card h3{font-size:1.08rem;margin-bottom:6px}

/* שלבים */
.phases .body{grid-template-columns:1fr}
.pilot{margin-top:28px;background:var(--gold-soft);border:1px solid rgba(156,106,16,.32);border-radius:14px;padding:18px 22px;max-width:76ch}
.pilot small{display:block;margin-top:4px;font-size:.88rem;color:var(--gold-deep);font-weight:700}

/* פלטפורמה */
.cmp th:not(:first-child){color:var(--ink);font-size:.9rem;letter-spacing:0}
.cmp td:first-child{width:34%}
.both{margin-top:18px;font-weight:700}

/* שאלות פתוחות */
.band{color:#FAF3E2;padding-block:84px;position:relative;
  background:
    radial-gradient(700px 380px at 85% 0%,rgba(245,180,36,.28),transparent 60%),
    radial-gradient(500px 300px at 5% 100%,rgba(245,180,36,.12),transparent 55%),
    #221F19}
.band::before{content:"";position:absolute;top:0;inset-inline:0;height:5px;background:linear-gradient(90deg,var(--gold),#F9CE5B,var(--gold))}
.band .sec-num{color:rgba(245,180,36,.4)}
.band h2{color:#FFF7E4}
.band h2 .gld{color:var(--gold)}
.band .lede{color:rgba(250,243,226,.82)}
.qs{list-style:none;padding:0;margin:38px 0 0;columns:2 22rem;column-gap:44px;counter-reset:q}
.qs li{counter-increment:q;break-inside:avoid;position:relative;padding-inline-start:48px;margin-bottom:22px;color:rgba(250,243,226,.86);font-size:1rem;line-height:1.65}
.qs li::before{content:counter(q);position:absolute;inset-inline-start:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--gold);color:var(--ink);font-weight:800;font-size:.92rem;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.qs li b{color:#FFF7E4}
.qs li:target::before{outline:3px solid #FFF7E4;outline-offset:2px}

/* סיום */
.ftr{background:var(--cream);border-top:1px solid var(--line);padding-block:34px 46px;color:var(--ink-soft);font-size:.92rem}
.ftr .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 34px}
.ftr img{height:30px;width:auto;display:block}
.ftr p{max-width:70ch}
.gate{text-align:center;color:var(--ink-soft);padding-block:6rem}

@media (max-width:900px){
  .hero-grid,.split{grid-template-columns:1fr;gap:34px}
  .grid3{grid-template-columns:1fr}
  .entities{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ent.core{grid-template-columns:1fr}
  .int{grid-template-columns:1fr 1fr}
  .int h3{grid-column:1/-1}
}
@media (max-width:640px){
  body{font-size:16px}
  .sec,.band{padding-block:58px}
  .hero{padding-block:44px 40px}
  .hdr .side .t{display:none}
  .grid2,.rules,.results,.how-list,.privacy,.later-grid,.entities{grid-template-columns:1fr}
  .stage .body,.phases .body{grid-template-columns:1fr}
  .fields4,.dtiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .int{grid-template-columns:1fr}
  .mheads{display:none}
  .mrow{grid-template-columns:1fr;gap:4px}
  .mrow .arr{transform:rotate(-90deg);height:26px}
  .ladder .step{grid-template-columns:1fr;gap:8px}
  .dark{padding:24px 22px}
  /* טבלאות בטלפון: כל שורה כרטיס, עם תווית לכל תא */
  .tbl.stack{border:0;background:transparent;overflow:visible}
  .tbl.stack table,.tbl.stack tbody,.tbl.stack tr,.tbl.stack td{display:block;width:auto}
  .tbl.stack thead{display:none}
  .tbl.stack tr{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .tbl.stack tr.key{background:#FEF3D6;border-color:rgba(156,106,16,.35)}
  .tbl.stack td{padding:3px 0;border:0;background:transparent}
  .tbl.stack tr.key td{background:transparent}
  .tbl.stack td[data-h]{margin-top:6px}
  .tbl.stack td[data-h]::before{content:attr(data-h);display:block;font-size:.72rem;font-weight:700;letter-spacing:.1em;color:var(--gold-deep)}
  .cmp td:first-child{width:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

<script>
(function(){
  var app=document.getElementById('app');
  function fail(){app.innerHTML='<p class="gate">הקישור לא שלם. פתחו את הקישור המלא כפי שנשלח אליכם.</p>'}
  function b64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  var m=location.hash.match(/k=([A-Za-z0-9_-]+)/);
  if(!m||!window.crypto||!crypto.subtle){fail();return}
  var blob=b64u(document.getElementById('payload').textContent.trim());
  crypto.subtle.importKey('raw',b64u(m[1]),'AES-GCM',false,['decrypt'])
    .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:blob.slice(0,12)},k,blob.slice(12))})
    .then(function(buf){
      app.innerHTML=new TextDecoder().decode(buf);
      // קישורים פנימיים גוללים בלי לדרוס את המפתח שבקישור
      app.querySelectorAll('a[href^="#"]').forEach(function(a){a.addEventListener('click',function(e){
        var t=document.getElementById(a.getAttribute('href').slice(1));
        if(t){e.preventDefault();t.scrollIntoView({behavior:'smooth',block:'start'})}})});
    })
    .catch(fail);
})();
</script>
