function initPage(root) {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) document.documentElement.classList.add('motion');
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      var el = e.target;
      el.classList.add('in');
      if (el.hasAttribute('data-seq')) el.classList.add('play');
      if (el.hasAttribute('data-count')) countUp(el);
      io.unobserve(el);
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -6% 0px' });
  root.querySelectorAll('.rv, [data-seq], [data-count]').forEach(function (el) { io.observe(el); });

  function countUp(el) {
    var to = +el.getAttribute('data-count');
    if (reduce) { el.textContent = to.toLocaleString('en-US'); return; }
    var start = performance.now(), dur = 1100;
    (function tick(now) {
      var t = Math.min(1, (now - start) / dur), eased = 1 - Math.pow(1 - t, 3);
      el.textContent = Math.round(to * eased).toLocaleString('en-US');
      if (t < 1) requestAnimationFrame(tick);
    })(start);
  }

  var box = root.querySelector('[data-slides]');
  if (box && !reduce) {
    var slides = box.querySelectorAll('.slide'), dots = box.querySelectorAll('[data-dots] span'), i = 0;
    var ON = 'block h-1.5 w-6 rounded-full bg-primary transition-all duration-500';
    var OFF = 'block h-1.5 w-1.5 rounded-full bg-white/60 transition-all duration-500';
    setInterval(function () {
      slides[i].classList.remove('on'); dots[i].className = OFF;
      i = (i + 1) % slides.length;
      slides[i].classList.add('on'); dots[i].className = ON;
    }, 4500);
  }

  /* סעיף 4 בלשוניות: שלב אחד בכל פעם, ופס שמראה איפה נמצאים */
  var tabsBox = root.querySelector('[data-tabs]'), bar = root.querySelector('[data-tabs-bar]');
  var list = root.querySelector('[role="tablist"]'), fill = root.querySelector('[data-tabs-fill]');
  var tabs = [].slice.call(root.querySelectorAll('[role="tab"]'));
  function showTab(id, anim, focus) {
    var idx = -1;
    tabs.forEach(function (t, i) { if (t.getAttribute('aria-controls') === id) idx = i; });
    if (idx < 0) return;
    tabs.forEach(function (t, i) {
      var on = i === idx, p = document.getElementById(t.getAttribute('aria-controls'));
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
      t.classList.toggle('done', i < idx);
      p.classList.toggle('on', on);
      p.classList.remove('tab-in');
      if (on && anim) { void p.offsetWidth; p.classList.add('tab-in'); }
    });
    if (fill) fill.style.width = 'calc((100% - 100% / 7) * ' + idx / (tabs.length - 1) + ')';
    var t = tabs[idx];
    list.scrollTo({ left: t.offsetLeft + t.offsetWidth / 2 - list.clientWidth / 2, behavior: reduce ? 'auto' : 'smooth' });
    if (focus) t.focus();
  }
  /* כשעוברים שלב מתוך הקריאה, חוזרים לראש השלב החדש, מתחת לפס */
  function toPanels() {
    var top = tabsBox.getBoundingClientRect().top, under = 64 + bar.offsetHeight + 12;
    if (top < under || top > innerHeight * 0.5) window.scrollTo({ top: scrollY + top - under, behavior: reduce ? 'auto' : 'smooth' });
  }
  if (tabsBox && tabs.length) {
    tabsBox.classList.add('tabs-on');
    showTab(tabs[0].getAttribute('aria-controls'), false, false);
    list.addEventListener('keydown', function (e) {
      var i = tabs.indexOf(document.activeElement), k = e.key;
      if (i < 0) return;
      var n = k === 'ArrowLeft' ? i + 1 : k === 'ArrowRight' ? i - 1 : k === 'Home' ? 0 : k === 'End' ? tabs.length - 1 : -1;
      if (n < 0 || n >= tabs.length) return;
      e.preventDefault();
      showTab(tabs[n].getAttribute('aria-controls'), true, true);
    });
  }

  /* קישורים פנימיים גוללים בלי לדרוס את המפתח שבקישור. קישור לשלב בסעיף 4 פותח את הלשונית שלו */
  root.querySelectorAll('a[href^="#"]').forEach(function (a) {
    a.addEventListener('click', function (e) {
      var id = a.getAttribute('href').slice(1), t = document.getElementById(id);
      if (!t) return;
      e.preventDefault();
      if (tabsBox && t.getAttribute('role') === 'tabpanel') { showTab(id, true, false); toPanels(); return; }
      t.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
    });
  });
}

(function(){
  var app=document.getElementById('app');
  function fail(){app.innerHTML='<p style="text-align:center;padding:6rem 1rem;color:#5C5C5C;font-size:1.1rem">הקישור לא שלם. פתחו את הקישור המלא כפי שנשלח אליכם.</p>'}
  function b64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  var m=location.hash.match(/k=([A-Za-z0-9_-]+)/);
  if(!m||!window.crypto||!crypto.subtle){fail();return}
  var blob=b64u(document.getElementById('payload').textContent.trim());
  crypto.subtle.importKey('raw',b64u(m[1]),'AES-GCM',false,['decrypt'])
    .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:blob.slice(0,12)},k,blob.slice(12))})
    .then(function(buf){app.innerHTML=new TextDecoder().decode(buf);initPage(app)})
    .catch(fail);
})();
