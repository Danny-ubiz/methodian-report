:root {
  --y: #FFB72E; --yp: #FFF6E3; --ys: #FFE7B8; --ink: #141414; --ink2: #232323; --soft: #5C5C5C; --cream: #F7F7F7; --line: #E6E6E6; --gold: #8A5A05;
  --pur: #4B3D72; --mag: #D6248C;
  --ease: cubic-bezier(.23, 1, .32, 1); --hh: 56px; --gut: clamp(1.1rem, 4vw, 2rem);
}
@media (min-width: 768px) { :root { --hh: 64px; } }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--hh) + 1rem); }
body { margin: 0; background: #fff; color: var(--ink); font-family: 'Assistant', system-ui, sans-serif; font-size: 1.125rem; line-height: 1.6;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
h1, h2, h3, h4, p, figure, ol, ul { margin: 0; }
ol, ul { padding: 0; list-style: none; }
img { max-width: 100%; }
b { font-weight: 800; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
::selection { background: var(--y); color: var(--ink); }
:focus-visible { outline: 3px solid var(--y); outline-offset: 3px; border-radius: 8px; }
.rp { overflow-x: clip; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 78rem; margin-inline: auto; padding-inline: var(--gut); }
.co { opacity: .5; font-weight: 400; }
.pad { display: inline-block; flex: none; width: .62em; height: .62em; background: var(--y); border-radius: 22%; transform: rotate(12deg); }
.sk { display: block; border-radius: .3em; background: #E8E8E8; }
.s { position: relative; padding-block: clamp(3.5rem, 7vw, 5.5rem); }
.s--cream { background: var(--cream); }
.s--dark { background: var(--ink); color: #fff; }
.sh { margin-bottom: clamp(2rem, 4vw, 3rem); }
.sh.c { text-align: center; }
.sh.c .lede { margin-inline: auto; }
.h2 { font-size: clamp(2.4rem, 5.4vw, 4.2rem); font-weight: 800; line-height: 1.04; text-wrap: balance; }
.h3 { font-size: clamp(1.6rem, 2.8vw, 2.1rem); font-weight: 800; line-height: 1.12; text-wrap: balance; }
.lede { margin-top: 1rem; max-width: 46rem; font-size: clamp(1.15rem, 1.7vw, 1.35rem); line-height: 1.55; color: var(--soft); text-wrap: pretty; }
.s--dark .lede { color: rgba(255, 255, 255, .75); }

/* סעיף 7: עמוד הסטודיו בתוך מחשב וטלפון, והוא גולל לבד כשהוא במסך. היחידה u היא פיקסל של העיצוב (1200 רוחב במחשב, 390 בטלפון).
   build.py מחליף כל calc(var(--e)*16) ב-calc(var(--e)*16), ו---e נגזר מרוחב המסך המדומה. לכן העמוד הקטן שומר על הפרופורציות שלו. */

}

   בלי שום הצמדה לגלילה: העמוד תמיד זז כשגוללים, והמסכים מתחלפים לבד כשהם בתוך המסך, או בלחיצה.
   הקצב של ההחלפה הוא אנימציית spFill על הפס של השלב הפעיל, וסופה מקדם לשלב הבא.
   בתנועה מופחתת אין החלפה לבד ואין גלילה אוטומטית, והלחיצה ממשיכה לעבוד. */
function initPage() {
  var D = document, root = D.documentElement;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $ = function (s, r) { return (r || D).querySelector(s); };
  var $$ = function (s, r) { return [].slice.call((r || D).querySelectorAll(s)); };
  if (!reduce) root.classList.add('mo');

  // התמונות נטענות פעם אחת, ושאר העותקים משתמשים באותו קובץ
  $$('img[data-i]').forEach(function (im) { var s = $('img[data-k="' + im.getAttribute('data-i') + '"]'); if (s) im.src = s.src; });

  /* ---------- מעבר בתוך העמוד. בלי לשנות את הכתובת, כי המפתח יושב בה ---------- */
  function goTo(id) { var el = D.getElementById(id); if (el) el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); }
  $$('[data-go]').forEach(function (a) {
    a.addEventListener('click', function (ev) { ev.preventDefault(); goTo(a.getAttribute('data-go')); });
  });

  /* ---------- הפס העליון: איפה הקורא נמצא, והתקדמות בעמוד ---------- */
  var hdP = $('#hdP'), spies = $$('[data-spy]'), tabs = {}, cur = null, ticking = false;
  $$('.tab').forEach(function (t) { tabs[t.getAttribute('data-tab')] = t; });
  function chrome() {
    ticking = false;
    var max = Math.max(1, root.scrollHeight - innerHeight);
    if (hdP) hdP.style.transform = 'scaleX(' + Math.min(1, scrollY / max).toFixed(4) + ')';
    var on = null;
    spies.forEach(function (s) { if (s.getBoundingClientRect().top <= innerHeight * 0.4) on = s.getAttribute('data-spy'); });
    if (on === cur) return;
    if (cur && tabs[cur]) tabs[cur].classList.remove('on');
    if (on && tabs[on]) {
      var t = tabs[on], bar = t.parentNode;
      t.classList.add('on');
      if (bar.scrollWidth > bar.clientWidth) bar.scrollTo({ left: t.offsetLeft - (bar.clientWidth - t.offsetWidth) / 2, behavior: reduce ? 'auto' : 'smooth' });
    }
    cur = on;
  }
  addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(chrome); } }, { passive: true });
  addEventListener('resize', chrome);
  chrome();

  /* ---------- שלבים שמתחלפים לבד ---------- */
  function watch(el, cb, threshold) {
    if (!('IntersectionObserver' in window)) { cb(true); return; }
    new IntersectionObserver(function (es) { es.forEach(function (x) { cb(x.isIntersecting); }); }, { threshold: threshold }).observe(el);
  }
  $$('[data-sp]').forEach(function (box) {
    var items = $$('[data-sp-item]', box), scrs = $$('[data-sp-scr]', box), stage = $('[data-s]', box), N = items.length, i = 0;
    function go(n) {
      i = (n + N) % N;
      items.forEach(function (el, k) { el.classList.toggle('on', k === i); });
      scrs.forEach(function (el, k) { el.classList.toggle('on', k === i); });
      if (stage) stage.setAttribute('data-s', i);
    }
    items.forEach(function (el, k) {
      el.addEventListener('click', function () { box.classList.remove('auto'); go(k); });
    });
    if (reduce) return;
    box.classList.add('auto');
    box.addEventListener('animationend', function (ev) {
      if (ev.animationName === 'spFill' && box.classList.contains('auto')) go(i + 1);
    });
    watch(box, function (seen) { box.classList.toggle('run', seen); }, 0.35);
  });

  /* ---------- עמוד הסטודיו גולל לבד בתוך המחשב והטלפון, באותו קצב, רק כשהוא במסך ---------- */
  (function () {
    var dv = $('.dv'); if (!dv) return;
    var views = $$('.dv-vp', dv).map(function (vp) { return { vp: vp, page: $('.st-scroll', vp) }; });
    function measure() {
      views.forEach(function (v) { v.page.style.setProperty('--max', Math.max(0, v.page.offsetHeight - v.vp.clientHeight) + 'px'); });
    }
    if (reduce) return;
    measure();
    addEventListener('resize', measure);
    addEventListener('load', measure);
    if (D.fonts && D.fonts.ready) D.fonts.ready.then(measure);
    watch(dv, function (seen) { dv.classList.toggle('run', seen); }, 0.25);
  })();

  /* ---------- הופעה עדינה ---------- */
  var rvs = $$('.rv');
  if (reduce || !('IntersectionObserver' in window)) { rvs.forEach(function (el) { el.classList.add('in'); }); return; }
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (x) { if (x.isIntersecting) { x.target.classList.add('in'); io.unobserve(x.target); } });
  }, { threshold: 0.08 });
  rvs.forEach(function (el) { io.observe(el); });
}


(function(){
  var app=document.getElementById('app');
  function fail(){app.innerHTML='<p style="text-align:center;padding:6rem 1rem;color:#5C5C5C;font-size:1.1rem">הקישור לא שלם. פתחו את הקישור המלא כפי שנשלח אליכם.</p>'}
  function b64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  var m=location.hash.match(/k=([A-Za-z0-9_-]+)/);
  if(!m||!window.crypto||!crypto.subtle){fail();return}
  var blob=b64u(document.getElementById('payload').textContent.trim());
  crypto.subtle.importKey('raw',b64u(m[1]),'AES-GCM',false,['decrypt'])
    .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:blob.slice(0,12)},k,blob.slice(12))})
    .then(function(buf){app.innerHTML=new TextDecoder().decode(buf);initPage()})
    .catch(fail);
})();
