   שלושת מצבי הרשת זה מתחת לזה, ולכל שלב בטלפון ובמסך המחשב יש מסך משלו.
   עם mo, שלוש הצמדות נעות לפי הגלילה (הרשת, הטלפון, מסך המחשב), ושאר העמוד מופיע בעדינות. */
:root {
  --night: #4B3D72; --deep: #6A4684; --brand: #8257A6; --cream: #EEE7D7; --paper: #F8F5EE; --lav: #C3A6E3;
  --ink: #2A2140; --ink2: #4A4160; --muted: #675F7C; --line: #DCD3C0;
  --ease: cubic-bezier(.23, 1, .32, 1); --hh: 56px; --gut: clamp(1.1rem, 4.5vw, 2.5rem);
}
@media (min-width: 768px) { :root { --hh: 64px; } }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--hh) + 1rem); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Assistant', system-ui, sans-serif;
  font-size: 1.1875rem; line-height: 1.6; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
h1, h2, h3, p, figure, ol, ul { margin: 0; }
img { max-width: 100%; }
b { font-weight: 800; }
::selection { background: var(--lav); color: var(--ink); }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; border-radius: .4rem; }
.rp { overflow-x: clip; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 72rem; margin-inline: auto; padding-inline: var(--gut); }
.co { opacity: .5; font-weight: 400; }
.h2 { font-size: clamp(2.1rem, 5vw, 3.6rem); font-weight: 800; line-height: 1.08; text-wrap: balance; color: var(--ink); }
.rv { transition: opacity .6s var(--ease), transform .6s var(--ease); }
html.mo .rv:not(.in) { opacity: 0; transform: translateY(18px); }

/* ================================================================ הפס העליון */
.bar { position: fixed; inset: 0 0 auto; z-index: 50; height: var(--hh); background: rgba(248, 245, 238, .92);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(42, 33, 64, .08); }
.bar-in { height: 100%; max-width: 72rem; margin-inline: auto; padding-inline: var(--gut); display: flex; align-items: center; gap: 1rem; }
.bar-logo { height: 30px; width: auto; flex: none; }
.bar-t { margin-inline-start: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 1rem; font-weight: 800; color: var(--deep); }

/* ================================================================ הצמדות: מבנה משותף */
.pin { position: relative; }

  font-weight: 800; font-size: 1.1rem; font-variant-numeric: tabular-nums; }

/* ================================================================ פתיח */

  overflow: hidden; padding: calc(var(--hh) + 1.2rem) 0 2rem; }

}

.op-mat.m2 { width: 18rem; height: 5rem; bottom: 18%; right: -5rem; background: rgba(195, 166, 227, .09); }
.strip { display: inline-flex; gap: .35rem; }

.strip i:nth-child(3n) { border-radius: .1rem; }

/* ================================================================ סעיף 1: מה משתנה */

  .row { padding: 0; border-bottom: 0; }

}

/* ================================================================ סעיף 2: שלוש הרמות, השיא */
.s2 { background: var(--deep); color: var(--cream); }

  transition: background-color .35s var(--ease) calc(var(--i, 0) * 16ms), color .35s var(--ease) calc(var(--i, 0) * 16ms), box-shadow .35s var(--ease); }

.legend { display: flex; flex-wrap: wrap; gap: .6rem 1.4rem; font-size: 1.1875rem; font-weight: 800; color: var(--cream); }

/* מצב חי */

}
/* מצב סטטי */

/* ================================================================ סעיף 3: הטלפון */
.s3 { background: var(--cream); }

@media (min-width: 60rem) {

  .stp .no { transition: background-color .3s var(--ease), color .3s var(--ease), box-shadow .3s var(--ease); }

}

  box-shadow: 0 0 0 1px rgba(30, 24, 48, .5), 0 26px 44px -30px rgba(42, 33, 64, .55); }

.scr { position: absolute; inset: 0; padding-top: 2.6em; display: flex; flex-direction: column; opacity: 0; transform: translateY(.9em); pointer-events: none;
  transition: opacity .3s var(--ease), transform .3s var(--ease); }

  background: rgba(130, 87, 166, .35); animation: tap 1.7s var(--ease) .35s 1 both; }

.pay-h { justify-content: center; }

/* ================================================================ סעיף 4: תשלומים */

  var clamp = function (x, a, b) { return x < a ? a : x > b ? b : x; };
  var seg = function (p, a, b) { return clamp((p - a) / (b - a), 0, 1); };
  var vh = innerHeight;

  /* ---------- הפס העליון: כותרת הסעיף הנוכחי והתקדמות בעמוד ---------- */
  var barT = $('#barT'), barP = $('#barP'), secs = $$('[data-title]'), lastTitle = null;
  function chrome() {
    var max = Math.max(1, root.scrollHeight - innerHeight);
    if (barP) barP.style.transform = 'scaleX(' + clamp(scrollY / max, 0, 1).toFixed(4) + ')';
    var title = '';
    secs.forEach(function (s) { if (s.getBoundingClientRect().top <= innerHeight * 0.4) title = s.getAttribute('data-title') || ''; });
    if (barT && title !== lastTitle) { barT.textContent = title; lastTitle = title; }
  }

  if (reduce) {
    chrome();
    addEventListener('scroll', chrome, { passive: true });
    addEventListener('resize', chrome);
    return;
  }
  root.classList.add('mo');

  /* ---------- מנוע קטן ---------- */
  var mods = [], running = false;
  function kick() { if (!running) { running = true; requestAnimationFrame(tick); } }
  function tick() {
    var again = false;
    chrome();
    mods.forEach(function (m) { if (m.update()) again = true; });
    running = again;
    if (again) requestAnimationFrame(tick);
  }
  // ההתקדמות המצוירת מתקרבת ליעד בהדרגה בכל פריים, ולא קופצת לפי הגלילה הגולמית
  function smooth(m, target, rate) {
    var d = target - m.cur;
    if (Math.abs(d) < 0.0006) { m.cur = target; return false; }
    m.cur += d * rate; return true;
  }
  function prog(pin, stage) {
    var r = pin.getBoundingClientRect();
    return clamp(-r.top / Math.max(1, r.height - stage.offsetHeight), 0, 1);
  }
  function pinMod(sel, step) {
    var pin = $(sel); if (!pin) return;
    var stage = $('.stage', pin), s = { i: -1, pin: pin };
    var m = { cur: 0 };
    m.update = function () {
      var moving = smooth(m, prog(pin, stage), 0.24);
      step(m.cur, s);
      return moving;
    };
    mods.push(m);
  }
  function setOn(list, idx) { list.forEach(function (el, i) { el.classList.toggle('on', i === idx); }); }

  /* ---------- השיא: הרשת עוברת בין שלוש רמות ---------- */
  (function () {
    var grid = $('#liveGrid'); if (!grid) return;
    var pin = $('[data-pin="lv"]');
    var olds = $$('.t.old', grid), lvs = $$('.lv', pin), pips = $$('.pips i', pin);
    pinMod('[data-pin="lv"]', function (p, s) {
      var lv = p < 0.3 ? 0 : p < 0.62 ? 1 : 2;
      if (lv !== s.i) { grid.setAttribute('data-lv', lv); setOn(lvs, lv); setOn(pips, lv); s.i = lv; }
      // בפרימיום הישנים נדלקים לפי הגלילה, מהחדש אל הישן
      var n = lv === 2 ? Math.round(seg(p, 0.68, 0.95) * olds.length) : 0;
      if (n !== s.n) { olds.forEach(function (t, i) { t.classList.toggle('rip', i < n); }); s.n = n; }
      pin.setAttribute('data-st', lv + '|' + n);
    });
  })();

  /* ---------- הטלפון: חמישה מסכים ---------- */
  (function () {
    var phone = $('#livePhone'); if (!phone) return;
    var pin = $('[data-pin="ph"]');
    var scrs = $$('.scr', phone), stps = $$('.stp', pin), pips = $$('.pips i', pin);
    var optA = $('[data-o="a"]', phone), optB = $('[data-o="b"]', phone);
    var boxes = $$('.bx', phone), ok = $('.ok', phone), N = scrs.length;
    pinMod('[data-pin="ph"]', function (p, s) {
      var i = Math.min(N - 1, Math.floor(p * N)), t = p * N - i;
      if (i !== s.i) { setOn(scrs, i); setOn(stps, i); setOn(pips, i); s.i = i; }
      var b = i === 1 && t > 0.55;                      // בעמוד התשלום: מחודש אחד עוברים להצגת המנוי השנתי
      if (b !== s.b) { optA.classList.toggle('sel', !b); optB.classList.toggle('sel', b); s.b = b; }
      var typed = i < 3 ? 0 : i === 3 ? Math.round(clamp((t - 0.08) / 0.7, 0, 1) * boxes.length) : boxes.length;
      if (typed !== s.ty) {
        boxes.forEach(function (bx, k) { bx.classList.toggle('f', k < typed); });
        ok.classList.toggle('f', typed === boxes.length); s.ty = typed;
      }
      phone.style.setProperty('--pr', (i === 4 ? 0.12 + 0.62 * t : 0.12).toFixed(3));
      pin.setAttribute('data-st', i + '|' + typed + '|' + (b ? 'b' : 'a'));
    });
  })();

  /* ---------- מסך המחשב: ארבעה שלבים ---------- */
  (function () {
    var win = $('#liveWin'); if (!win) return;
    var pin = $('[data-pin="dk"]');
    var stps = $$('.stp', pin), pips = $$('.pips i', pin), N = stps.length;
    pinMod('[data-pin="dk"]', function (p, s) {
      var i = Math.min(N - 1, Math.floor(p * N)), t = p * N - i;
      if (i !== s.i) { win.setAttribute('data-s', i); setOn(stps, i); setOn(pips, i); s.i = i; }
      win.style.setProperty('--up', (i === 0 ? seg(t, 0.08, 0.85) : 1).toFixed(3));
      pin.setAttribute('data-st', String(i));
    });
  })();

  /* ---------- סעיף 1: כל שורה מתחלפת מ"היום" ל"במערכת" כשהיא עוברת את קו הקריאה ---------- */
  (function () {
    var rows = $$('.row'); if (!rows.length) return;
    mods.push({ update: function () {
      rows.forEach(function (r) { r.classList.toggle('on', r.getBoundingClientRect().top < vh * 0.74); });
      return false;
    } });
  })();

  /* ---------- סעיף 8: הקו מתמלא בגלילה והצמתים נדלקים ---------- */
  (function () {
    var tl = $('#tl'), fill = $('#tlFill'); if (!tl || !fill) return;
    var items = $$('li', tl), m = { cur: 0 };
    m.update = function () {
      var r = tl.getBoundingClientRect(), line = vh * 0.62;
      var moving = smooth(m, clamp((line - (r.top + 21)) / Math.max(1, r.height - 42), 0, 1), 0.2);
      fill.style.setProperty('--f', m.cur.toFixed(4));
      items.forEach(function (li) { li.classList.toggle('on', li.getBoundingClientRect().top + 21 <= line); });
      return moving;
    };
    mods.push(m);
  })();

  /* ---------- סעיף 6: העמוד המוקטן גולל לאט בתוך המסגרת ---------- */
  (function () {
    var vp = $('.fr-vp'), inner = $('.fr-in'); if (!vp || !inner) return;
    var m = { cur: 0 };
    m.update = function () {
      var r = vp.getBoundingClientRect();
      var t = clamp((vh * 0.92 - r.top) / (vh * 0.92 + r.height * 0.3), 0, 1);
      var moving = smooth(m, t, 0.14);
      var shift = Math.max(0, inner.offsetHeight - vp.clientHeight);
      inner.style.setProperty('--py', (-m.cur * shift).toFixed(1) + 'px');
      return moving;
    };
    mods.push(m);
  })();

  /* ---------- הופעה עדינה של שורות וכותרות ---------- */
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.12, rootMargin: '0px 0px -5% 0px' });
    $$('.rv').forEach(function (el) { io.observe(el); });
  } else {
    $$('.rv').forEach(function (el) { el.classList.add('in'); });
  }

  var lastW = innerWidth, lastH = innerHeight;
  addEventListener('scroll', kick, { passive: true });
  addEventListener('resize', function () {
    // בטלפון שורת הכתובת משנה את הגובה תוך כדי גלילה, ואז אין צורך בחישוב מחדש
    if (innerWidth === lastW && Math.abs(innerHeight - lastH) < 140) { vh = innerHeight; kick(); return; }
    lastW = innerWidth; lastH = innerHeight; vh = innerHeight; kick();
  });
  kick();
  if (D.fonts && D.fonts.ready) D.fonts.ready.then(kick);
  addEventListener('load', kick);
}


(function(){
  var app=document.getElementById('app');
  function fail(){app.innerHTML='<p style="text-align:center;padding:6rem 1rem;color:#5C5C5C;font-size:1.1rem">הקישור לא שלם. פתחו את הקישור המלא כפי שנשלח אליכם.</p>'}
  function b64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  var m=location.hash.match(/k=([A-Za-z0-9_-]+)/);
  if(!m||!window.crypto||!crypto.subtle){fail();return}
  var blob=b64u(document.getElementById('payload').textContent.trim());
  crypto.subtle.importKey('raw',b64u(m[1]),'AES-GCM',false,['decrypt'])
    .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:blob.slice(0,12)},k,blob.slice(12))})
    .then(function(buf){app.innerHTML=new TextDecoder().decode(buf);initPage()})
    .catch(fail);
})();
