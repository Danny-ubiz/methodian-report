:root{color-scheme:dark;--bg:#0E1014;--panel:#161A21;--panel2:#1B2029;--line:#272D38;--line2:#333B49;--bar:#4A566B;
  --ink:#FFFFFF;--ink2:#DFE3EA;--mute:#9099A8;--gold:#F5B424;--over:#FF7A6B;direction:rtl}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;direction:rtl;background:var(--bg);color:var(--ink2);font-family:Assistant,system-ui,sans-serif;
  font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.w{max-width:860px;margin:0 auto;padding:0 28px 80px}
@media(max-width:600px){.w{padding:0 18px 56px}body{font-size:17px}}
b,strong{color:var(--ink);font-weight:700}
.num{font-variant-numeric:tabular-nums}

header{padding:64px 0 0}
.kicker{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.16em;color:var(--gold);font-weight:700;margin-bottom:20px}
.kicker::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
h1{font-size:clamp(42px,8.4vw,66px);font-weight:800;line-height:1.02;margin:0 0 20px;letter-spacing:-.03em;color:var(--ink)}
.sub{font-size:20px;color:var(--ink2);margin:0 0 36px;line-height:1.55}

/* לשוניות: חודש ומחלקה */
.tin{position:absolute;opacity:0;pointer-events:none}
.mtabs{display:flex;width:fit-content;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;margin:0 0 18px}
.mtabs label{cursor:pointer;padding:9px 18px;border-radius:999px;font-size:16px;font-weight:700;color:var(--mute);text-align:center;transition:background .15s,color .15s;user-select:none}
.mtabs label:hover{color:var(--ink)}
.tabs{display:flex;width:fit-content;gap:26px;margin:0 0 40px;border-bottom:1px solid var(--line)}
.tabs label{cursor:pointer;padding:6px 2px 11px;margin-bottom:-1px;border-bottom:2px solid transparent;font-size:17px;font-weight:700;color:var(--mute);transition:color .15s,border-color .15s;user-select:none}
.tabs label:hover{color:var(--ink)}
.pane{display:none}
@media(max-width:600px){
  .mtabs{display:grid;width:auto;grid-template-columns:repeat(3,1fr);border-radius:20px}
  .mtabs label{padding:9px 6px}
  .tabs{width:auto;gap:0}.tabs label{flex:1;text-align:center}
}
#m04:checked~.mtabs label[for=m04]{background:var(--gold);color:#16130B}
#m04:focus-visible~.mtabs label[for=m04]{outline:2px solid var(--gold);outline-offset:3px}
#m04:checked~#d1:checked~.panes #p04-1{display:block}
#m04:checked~#d2:checked~.panes #p04-2{display:block}
#m05:checked~.mtabs label[for=m05]{background:var(--gold);color:#16130B}
#m05:focus-visible~.mtabs label[for=m05]{outline:2px solid var(--gold);outline-offset:3px}
#m05:checked~#d1:checked~.panes #p05-1{display:block}
#m05:checked~#d2:checked~.panes #p05-2{display:block}
#m06:checked~.mtabs label[for=m06]{background:var(--gold);color:#16130B}
#m06:focus-visible~.mtabs label[for=m06]{outline:2px solid var(--gold);outline-offset:3px}
#m06:checked~#d1:checked~.panes #p06-1{display:block}
#m06:checked~#d2:checked~.panes #p06-2{display:block}
#m07:checked~.mtabs label[for=m07]{background:var(--gold);color:#16130B}
#m07:focus-visible~.mtabs label[for=m07]{outline:2px solid var(--gold);outline-offset:3px}
#m07:checked~#d1:checked~.panes #p07-1{display:block}
#m07:checked~#d2:checked~.panes #p07-2{display:block}
#m08:checked~.mtabs label[for=m08]{background:var(--gold);color:#16130B}
#m08:focus-visible~.mtabs label[for=m08]{outline:2px solid var(--gold);outline-offset:3px}
#m08:checked~#d1:checked~.panes #p08-1{display:block}
#m08:checked~#d2:checked~.panes #p08-2{display:block}
#m09:checked~.mtabs label[for=m09]{background:var(--gold);color:#16130B}
#m09:focus-visible~.mtabs label[for=m09]{outline:2px solid var(--gold);outline-offset:3px}
#m09:checked~#d1:checked~.panes #p09-1{display:block}
#m09:checked~#d2:checked~.panes #p09-2{display:block}
#d1:checked~.tabs label[for=d1]{color:var(--ink);border-bottom-color:var(--gold)}
#d1:focus-visible~.tabs label[for=d1]{outline:2px solid var(--gold);outline-offset:3px}
#d2:checked~.tabs label[for=d2]{color:var(--ink);border-bottom-color:var(--gold)}
#d2:focus-visible~.tabs label[for=d2]{outline:2px solid var(--gold);outline-offset:3px}
/* בלוק */
.bl{border-top:1px solid var(--line);padding:32px 0 0;margin:0 0 44px}
.bl.gold{border-top:2px solid var(--gold)}
.bl-t{font-size:13px;letter-spacing:.13em;color:var(--mute);font-weight:700;margin-bottom:12px}
.bl-h{font-size:30px;font-weight:800;line-height:1.18;margin:0 0 10px;letter-spacing:-.02em;color:var(--ink)}
.bl p.lead{font-size:17px;color:var(--mute);margin:0 0 22px}

/* מספרי מפתח */
.nums{display:grid;grid-template-columns:repeat(3,1fr);margin:6px 0 0;border-top:1px solid var(--line)}
.nums div{padding:18px 22px 18px 0;border-inline-start:1px solid var(--line)}
.nums div:first-child{border-inline-start:0;padding-inline-start:0}
.nums dt{font-size:12.5px;letter-spacing:.1em;color:var(--mute);font-weight:700;margin-bottom:6px}
.nums dd{margin:0;font-size:38px;font-weight:800;line-height:1;letter-spacing:-.025em;color:var(--ink)}
.nums dd.g{color:var(--gold)}
@media(max-width:600px){.nums div{padding:14px 12px 14px 0}.nums dt{font-size:11.5px;letter-spacing:.04em}.nums dd{font-size:25px}}

.pace{margin:22px 0 0}
.pace .pt{font-size:16px;color:var(--ink2);margin-bottom:10px}
.pace .track{position:relative;height:12px;background:var(--panel2);border-radius:999px}
.pace .track i{position:absolute;inset-inline-start:0;top:0;bottom:0;background:var(--gold);border-radius:999px}
.pace .track s{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink);text-decoration:none}
.pace .leg{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:9px}

/* מגמות */
.prog{padding:20px 0;border-bottom:1px solid var(--line)}
.prog:first-of-type{border-top:1px solid var(--line)}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.pn{font-size:21px;font-weight:800;color:var(--ink)}
.tag{display:inline-block;font-size:12.5px;font-weight:700;color:var(--mute);border:1px solid var(--line2);border-radius:999px;padding:1px 10px;margin-inline-start:8px;vertical-align:3px}
.pr{font-size:15px;color:var(--mute);white-space:nowrap}
.pr b{font-size:22px;font-weight:800;color:var(--gold);margin-inline-start:4px}
.pr.over b{color:var(--ink)}
.pl{display:grid;grid-template-columns:44px 1fr 250px;align-items:center;gap:14px;margin-top:8px}
.pf{font-size:14px;font-weight:700;color:var(--mute)}
.bar{height:10px;background:var(--panel2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--bar);border-radius:999px}
.pv{font-size:15px;color:var(--ink2);white-space:nowrap}
.pv small{color:var(--mute);font-size:14px}
.pleft{font-size:15px;font-weight:700;color:var(--ink);text-align:end;white-space:nowrap}
.pnote{font-size:13.5px;color:var(--mute);margin-top:10px}
.pr.na{font-size:14px}
.pl.na .pf,.pl.na .pv{color:#5c6474}
@media(max-width:600px){
  .pl{grid-template-columns:40px 1fr;grid-template-areas:"f b" "f v";row-gap:6px;column-gap:10px}
  .pf{grid-area:f;align-self:start}.pl .bar{grid-area:b}.pv{grid-area:v}
  .pn{font-size:19px}
}

/* רשימות פשוטות */
.li{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:15px 0;border-bottom:1px solid var(--line)}
.li:first-of-type{border-top:1px solid var(--line)}
.li .a{font-size:18px;font-weight:700;color:var(--ink)}
.li .m{grid-column:1;font-size:14.5px;color:var(--mute)}
.li .v{grid-row:1 / span 2;grid-column:2;align-self:center;text-align:end;font-size:21px;font-weight:800;color:var(--ink);white-space:nowrap}
.li .v small{display:block;font-size:12.5px;font-weight:700;color:var(--mute);letter-spacing:.06em}

.course{display:grid;grid-template-columns:1fr 2fr 84px 44px;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.course:first-of-type{border-top:1px solid var(--line)}
.course .a{font-size:17px;font-weight:700;color:var(--ink)}
.course .v{font-size:18px;font-weight:800;color:var(--ink);text-align:end}
.course .p{font-size:14px;color:var(--mute);text-align:end}
.course.na .a,.course.na .v{color:#5c6474}
@media(max-width:600px){.course{grid-template-columns:1fr auto auto;grid-template-areas:"a v p" "b b b";row-gap:8px}
  .course .a{grid-area:a}.course .bar{grid-area:b}.course .v{grid-area:v}.course .p{grid-area:p}}

/* החשבון */
.calc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 24px}
.calc div{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line);font-size:17px}
.calc div span:last-child{font-weight:700;color:var(--ink);white-space:nowrap}
.calc div.min span:last-child::before{content:"פחות ";font-weight:400;color:var(--mute);font-size:14px}
.calc div:last-child{border-bottom:0;font-size:20px;font-weight:800;color:var(--ink)}
.calc div:last-child span:last-child{color:var(--gold);font-size:28px;font-weight:800}
.calc div.neg:last-child span:last-child{color:var(--ink)}
@media(max-width:600px){.calc{padding:4px 16px}.calc div{font-size:15.5px}}

.notes p{font-size:16px;color:var(--ink2);margin:0 0 12px}
.notes p b{color:var(--ink)}

.cum{font-size:15px;color:var(--mute);margin:16px 0 0}
.asof{font-size:15px;color:var(--mute);margin:-24px 0 30px}
footer{border-top:1px solid var(--line);padding-top:24px;color:var(--mute);font-size:15px}
.gate{min-height:60vh;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mute);font-size:18px}
</style>

(function(){
  var app=document.getElementById('app');
  function fail(){app.innerHTML='<div class="gate"><p>הקישור לא שלם.<br>פתחו את הקישור המלא כפי שנשלח אליכם.</p></div>'}
  function b64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  var m=location.hash.match(/k=([A-Za-z0-9_-]+)/);
  if(!m||!window.crypto||!crypto.subtle){fail();return}
  var blob=b64u(document.getElementById('payload').textContent.trim());
  crypto.subtle.importKey('raw',b64u(m[1]),'AES-GCM',false,['decrypt'])
    .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:blob.slice(0,12)},k,blob.slice(12))})
    .then(function(buf){app.innerHTML=new TextDecoder().decode(buf)})
    .catch(fail);
})();
