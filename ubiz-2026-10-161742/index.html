  var head = document.querySelector('.site-head');
  var hh = 64;
  function setHH() { hh = head ? head.offsetHeight : 64; doc.style.setProperty('--hh', hh + 'px'); }
  setHH();

  var running = false, mods = [];
  function tick(now) {
    var again = false;
    for (var i = 0; i < mods.length; i++) if (mods[i].update(now)) again = true;
    if (again) requestAnimationFrame(tick); else running = false;
  }
  function kick() { if (!running) { running = true; requestAnimationFrame(tick); } }

  /* ---------- הפתיח: הרקע הצהוב, הפסים, התמונה והתגיות זזים בקצב שונה ---------- */
  function hero() {
    var vis = document.querySelector('.hero-vis');
    if (!vis) return null;
    var tx = 0, ty = 0, mx = 0, my = 0, lastHp = -1;
    if (fine) {
      var zone = vis.closest('[data-hero]');
      zone.addEventListener('pointermove', function (e) {
        tx = clamp((e.clientX / innerWidth - .5) * 2, -1, 1);
        ty = clamp((e.clientY / innerHeight - .5) * 2, -1, 1);
        kick();
      });
      zone.addEventListener('pointerleave', function () { tx = 0; ty = 0; kick(); });
    }
    return {
      layout: function () { lastHp = -1; },
      update: function () {
        var hp = clamp((window.pageYOffset || 0) / innerHeight, 0, 1.2);
        if (hp > 1.15 && lastHp > 1.15) return false;
        mx += (tx - mx) * .1; my += (ty - my) * .1;
        var moving = Math.abs(tx - mx) > .002 || Math.abs(ty - my) > .002;
        if (!moving) { mx = tx; my = ty; }
        if (hp !== lastHp || moving) {
          vis.style.setProperty('--hp', hp.toFixed(4));
          vis.style.setProperty('--mx', mx.toFixed(4));
          vis.style.setProperty('--my', my.toFixed(4));
          lastHp = hp;
        }
        return moving;
      }
    };
  }

  /* ---------- השיא: שישה כרטיסים מפוזרים נאספים לערימה, והערימה נסגרת לכרטיס הצהוב ----------
     ההתקדמות (0 עד 1) נמדדת לפי מיקום הבמה המוצמדת, ומה שמצויר מתקרב אליה בהדרגה בכל פריים,
     כדי שגלגלת לא תקפוץ בבת אחת. במסך מגע ההחלקה קצרה יותר, כדי שהתמונה תישאר צמודה לאצבע. */
  function deck() {
    var sec = document.querySelector('[data-deck]');
    if (!sec) return null;
    var track = sec.querySelector('.deck-track'), stage = sec.querySelector('.deck-stage'), box = sec.querySelector('.deck');
    var cards = [].slice.call(box.querySelectorAll('.dcard')), team = cards[6], svc = cards.slice(0, 6);
    var swA = sec.querySelector('.sw-a'), swB = sec.querySelector('.sw-b'), swLink = swB.querySelector('a');
    var names = [].slice.call(team.querySelectorAll('.dnames li'));
    // מיקום מפוזר לכל כרטיס: מרכז יחסי לתיבה (מ-1- עד 1), סיבוב במעלות וקנה מידה
    var SCAT = {
      wide: [[-.62, -.62, -9, .54], [.62, -.5, 7, .5], [-.06, -.12, -4, .58], [.68, .2, 10, .52], [-.68, .42, 6, .5], [.14, .68, -11, .54]],
      narrow: [[-.72, -.62, -9, .5], [.72, -.46, 8, .46], [-.06, -.08, -5, .56], [.74, .26, 10, .48], [-.74, .44, 6, .46], [.1, .7, -11, .5]]
    };
    // ציר הזמן של הרגע, כחלק מההתקדמות
    var T0 = .06, STEP = .105, FLY = .055, TEAM0 = .69, TEAM1 = .775, C0 = .785, C1 = .865, N0 = .8;
    var L = null, shown = -1, lastT = 0;

    function clear() {
      cards.concat(names).forEach(function (c) { c.style.transform = ''; c.style.height = ''; c.style.zIndex = ''; c.style.opacity = ''; });
      [swA, swB].forEach(function (el) { el.style.opacity = ''; el.style.transform = ''; el.style.pointerEvents = ''; });
      if (swLink) swLink.removeAttribute('tabindex');
      stage.style.height = ''; track.style.height = '';
    }
    function off() { sec.classList.remove('deck-on'); clear(); L = null; }

    function layout() {
      // מסך נמוך מדי (טלפון לרוחב, חלון קטן): נשארים ברשת הרגילה
      if (innerHeight < 560 || innerWidth < 340) { off(); return; }
      sec.classList.add('deck-on');
      clear();
      var wide = innerWidth >= 1024;
      var stageH = innerHeight - hh;
      stage.style.height = stageH + 'px';
      track.style.height = Math.round(stageH + innerHeight * (wide ? 3.9 : 4.3)) + 'px';
      var W = box.clientWidth, A = box.clientHeight, Hs = 0;
      svc.forEach(function (c) { Hs = Math.max(Hs, c.offsetHeight); });
      svc.forEach(function (c) { c.style.height = Hs + 'px'; });
      // הכרטיס הצהוב לפחות בגובה של כרטיסי השירות, כדי שבסוף אף כרטיס לא יבלוט מתחתיו
      var Hy = Math.max(team.offsetHeight, Hs), headH = svc[0].querySelector('.dhead').offsetHeight;
      team.style.height = Hy + 'px';
      var S = Math.min(headH, Math.floor((A - Hy) / 6));
      if (S < 26 || Hs + 5 * S > A) { off(); return; }
      var total = Math.max(5 * S + Hs, 6 * S + Hy), y0 = Math.max(0, Math.round((A - total) / 2));
      var e = wide ? 9 : 6, yc = Math.max(0, Math.round((A - (6 * e + Hy)) / 2));
      var sc = wide ? SCAT.wide : SCAT.narrow, spill = wide ? 56 : 6;
      L = { fin: [], comp: [], scat: [], A: A, wide: wide };
      for (var k = 0; k < 6; k++) {
        var s = sc[k], vw = W * s[3], vh = Hs * s[3];
        var cx = W / 2 + s[0] * (W / 2 - vw / 2 + spill), cy = A / 2 + s[1] * (A / 2 - vh / 2);
        L.fin.push(y0 + k * S);
        L.comp.push(yc + k * e);
        L.scat.push({ x: cx - W / 2, y: cy - Hs / 2, r: s[2], s: s[3] });
      }
      // הכרטיס הצהוב מחכה מתחת לתחתית הבמה, ולא רק מתחת לתיבה, כדי שלא יציץ לפני הזמן
      var below = stage.getBoundingClientRect().bottom - box.getBoundingClientRect().top;
      L.teamFin = y0 + 6 * S; L.teamComp = yc + 6 * e; L.teamFrom = below + 70;
      shown = -1;
    }

    function tf(el, x, y, r, s) {
      el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) rotate(' + r.toFixed(2) + 'deg) scale(' + s.toFixed(4) + ')';
    }

    function draw(p) {
      var cp = inOut(seg(p, C0, C1));
      for (var k = 0; k < 6; k++) {
        var c = svc[k], a = T0 + k * STEP, t = out3(seg(p, a, a + FLY)), sc = L.scat[k];
        var land = lerp(L.fin[k], L.comp[k], cp);
        // כרטיס שעוד מחכה נמשך מעט לכיוון הערימה, כאילו היא מושכת אותו
        var pull = (1 - t) * seg(p, T0, a) * .16;
        var sx = sc.x * (1 - pull), sy = land + (sc.y - land) * (1 - pull);
        var hop = Math.sin(Math.PI * t) * (L.wide ? 34 : 18);
        tf(c, lerp(sx, 0, t), lerp(sy, land, t) - hop, lerp(sc.r, 0, t), lerp(sc.s, 1, t));
        c.style.zIndex = t > 0 ? 20 + k : 1 + k;
      }
      var tt = seg(p, TEAM0, TEAM1);
      var ty = lerp(L.teamFrom, L.teamFin, back(tt));
      tf(team, 0, lerp(ty, L.teamComp, cp), lerp(5, 0, out3(tt)), 1);
      team.style.zIndex = 40;
      for (var i = 0; i < names.length; i++) {
        var n = out3(seg(p, N0 + i * .012, N0 + i * .012 + .035));
        names[i].style.opacity = n.toFixed(3);
        names[i].style.transform = 'translateY(' + ((1 - n) * 8).toFixed(1) + 'px) scale(' + (.92 + n * .08).toFixed(3) + ')';
      }
      // בסוף הרגע מופיע כפתור. בטלפון הוא מחליף את הפסקה, במחשב הוא נכנס מתחתיה
      var b = out3(seg(p, C1 - .02, C1 + .05));
      swB.style.opacity = b.toFixed(3);
      swB.style.transform = 'translateY(' + ((1 - b) * 12).toFixed(1) + 'px)';
      swB.style.pointerEvents = b > .5 ? '' : 'none';
      // כפתור שעוד לא נראה לא מקבל פוקוס מהמקלדת
      if (swLink) { if (b > .5) swLink.removeAttribute('tabindex'); else swLink.setAttribute('tabindex', '-1'); }
      swA.style.opacity = L.wide ? '' : (1 - out3(seg(p, C1 - .05, C1))).toFixed(3);
    }

    return {
      layout: layout,
      update: function (now) {
        if (!L) return false;
        var r = track.getBoundingClientRect();
        var target = clamp((hh - r.top) / Math.max(1, r.height - (innerHeight - hh)), 0, 1);
        var dt = lastT ? Math.min(64, now - lastT) : 16;
        var p = shown < 0 ? target : shown + (target - shown) * (1 - Math.exp(-dt / (fine ? 110 : 55)));
        if (Math.abs(target - p) < .0004) p = target;
        lastT = p === target ? 0 : now;
        if (p === shown) return false;
        shown = p;
        draw(p);
        return p !== target;
      }
    };
  }

  /* ---------- הכלים: הטופס מתמלא ונשלח, ואז מגיעה הודעה בוואטסאפ, לפי הגלילה ---------- */
  function demo() {
    var fig = document.querySelector('[data-demo]');
    if (!fig) return null;
    fig.classList.add('dm-on');
    var fm = fig.querySelector('.fm'), wa = fig.querySelector('.wa'), link = fig.querySelector('.link'), last = '';
    // 0 כשהחלק נכנס כולו למסך מלמטה, 1 אחרי שעלה עוד חצי מסך. כך כל שלב קורה כשרואים אותו
    function pos(el, span) { var r = el.getBoundingClientRect(); return clamp((innerHeight * .95 - r.bottom) / (innerHeight * span), 0, 1); }
    return {
      layout: function () { last = ''; },
      update: function () {
        var st = [], lf;
        if (innerWidth >= 1024) {
          // הטופס והוואטסאפ זה לצד זה: רצף אחד שמתחיל כשרוב הדוגמה במסך
          var r = fig.getBoundingClientRect(), start = innerHeight - r.height * .8;
          var dp = clamp((start - r.top) / (innerHeight * .5), 0, 1);
          st = [.06, .16, .26, .38, .62, .76, .9].map(function (t) { return dp >= t; });
          lf = inOut(seg(dp, .4, .6));
        } else {
          // זה מתחת לזה: כל חלק מתקדם לפי המיקום שלו במסך
          var a = pos(fm, .5), w = pos(wa, .5);
          st = [a >= .04, a >= .2, a >= .38, a >= .58, w >= .04, w >= .28, w >= .52];
          lf = inOut(pos(link, .22));
        }
        var key = st.join() + lf.toFixed(3);
        if (key === last) return false;
        last = key;
        for (var i = 0; i < st.length; i++) fig.classList.toggle('s' + (i + 1), st[i]);
        fig.style.setProperty('--lf', lf.toFixed(3));
        return false;
      }
    };
  }

  /* ---------- המענק: הפס מתרוקן עד העשירית שמנוצלת, ופסי ההשוואה נמתחים ---------- */
  function fills() {
    var els = [].slice.call(document.querySelectorAll('[data-fill]'));
    if (!els.length) return null;
    var items = els.map(function (el) {
      el.classList.add('fill-on');
      return { el: el, f: -1, cells: [].slice.call(el.querySelectorAll('.gbar-cells i')), rows: [].slice.call(el.querySelectorAll('.cmp-row')) };
    });
    items.forEach(function (it) { it.rows.forEach(function (row) { row.style.setProperty('--f', '0'); }); });
    return {
      layout: function () { items.forEach(function (it) { it.f = -1; }); },
      update: function () {
        items.forEach(function (it) {
          var r = it.el.getBoundingClientRect();
          var f = clamp((innerHeight * .9 - r.top) / (innerHeight * .45), 0, 1);
          if (Math.abs(f - it.f) < .001) return;
          it.f = f;
          // התאים מתרוקנים מהקצה הרחוק לכיוון התא הראשון, שנשאר צהוב
          for (var i = 1; i < it.cells.length; i++) it.cells[i].classList.toggle('gone', f > .18 + (it.cells.length - 1 - i) * .07);
          it.rows.forEach(function (row, j) { row.style.setProperty('--f', out3(clamp(f * 1.6 - j * .18, 0, 1)).toFixed(3)); });
        });
        return false;
      }
    };
  }

  mods = [hero(), deck(), demo(), fills()].filter(Boolean);
  function relayout() { setHH(); mods.forEach(function (m) { if (m.layout) m.layout(); }); kick(); }
  addEventListener('scroll', kick, { passive: true });
  var lastW = innerWidth, lastH = innerHeight;
  addEventListener('resize', function () {
    // בטלפון שורת הכתובת משנה את הגובה תוך כדי גלילה, ואז אין צורך לפרוס מחדש
    if (innerWidth === lastW && Math.abs(innerHeight - lastH) < 140) { kick(); return; }
    lastW = innerWidth; lastH = innerHeight;
    relayout();
  });
  relayout();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
  addEventListener('load', relayout);
}

(function(){
  var app=document.getElementById('app');
  function fail(){app.innerHTML='<p style="text-align:center;padding:6rem 1rem;color:#5C5C5C;font-size:1.1rem">הקישור לא שלם. פתחו את הקישור המלא כפי שנשלח אליכם.</p>'}
  function b64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  var m=location.hash.match(/k=([A-Za-z0-9_-]+)/);
  if(!m||!window.crypto||!crypto.subtle){fail();return}
  var blob=b64u(document.getElementById('payload').textContent.trim());
  crypto.subtle.importKey('raw',b64u(m[1]),'AES-GCM',false,['decrypt'])
    .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:blob.slice(0,12)},k,blob.slice(12))})
    .then(function(buf){app.innerHTML=new TextDecoder().decode(buf);initPage()})
    .catch(fail);
})();
</script><noscript><p style="text-align:center">הדף דורש JavaScript.</p></noscript></body></html>
